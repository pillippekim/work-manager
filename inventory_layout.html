<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>적재대 현황 - 업무포탈</title>
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="common.css">
  <style>
    .layout-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card {
      flex: 1; min-width: 140px; background: #fff; border-radius: 10px;
      padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #4A90D9;
    }
    .stat-card .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .stat-card .stat-value { font-size: 24px; font-weight: 700; color: #1a1a2e; }
    .stat-card .stat-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
    .stat-card.green { border-left-color: #27AE60; }
    .stat-card.orange { border-left-color: #F39C12; }
    .stat-card.red { border-left-color: #E74C3C; }
    .stat-card.blue { border-left-color: #3498DB; }
    .stat-card.purple { border-left-color: #9B59B6; }

    .layout-map { background: #1a1a2e; border-radius: 12px; padding: 28px; overflow: hidden; }
    .layout-map-title { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .layout-map-title span { font-size: 12px; color: #888; font-weight: 400; margin-left: 10px; }
    .legend-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #ccc; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    .map-outer { display: flex; flex-direction: column; gap: 14px; }

    /* 적재불가 */
    .zone-restricted {
      background: rgba(74,144,217,0.15); border: 1.5px solid rgba(74,144,217,0.3);
      border-radius: 8px; padding: 24px; text-align: center; color: rgba(255,255,255,0.7);
    }
    .zone-restricted-title { font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.85); }
    .zone-restricted-sub { font-size: 15px; color: rgba(255,255,255,0.5); margin-top: 4px; }

    /*
      출입구 기준 메인 그리드 6열:
      col1: 11동 (60px) - 좌측
      col2: 중앙좌=A/1/2/5/6동 (1fr)
      col3: 간격 (28px)
      col4: 중앙우=B/3/4/7/8동 (1fr)
      col5: 12동 (60px) - 우측
      col6: 13동 (60px) - 우측
    */
    .map-main {
      display: grid;
      grid-template-columns: 60px 1fr 28px 1fr 60px 60px;
      grid-template-rows: auto auto auto;
      gap: 10px;
    }

    /* 11동: col1, row1~3 */
    .g-left { grid-column: 1; grid-row: 1 / 4; display: flex; }
    /* 12동: col5, row1~3 */
    .g-right1 { grid-column: 5; grid-row: 1 / 4; display: flex; }
    /* 13동: col6, row1~3 */
    .g-right2 { grid-column: 6; grid-row: 1 / 4; display: flex; }

    /* 중앙 좌 */
    .cl { grid-column: 2; }
    .cl.r1 { grid-row: 1; }
    .cl.r2 { grid-row: 2; }
    .cl.r3 { grid-row: 3; }
    /* 간격 */
    .cg { grid-column: 3; }
    .cg.r1 { grid-row: 1; }
    .cg.r2 { grid-row: 2; }
    .cg.r3 { grid-row: 3; }
    /* 중앙 우 */
    .cr { grid-column: 4; }
    .cr.r1 { grid-row: 1; }
    .cr.r2 { grid-row: 2; }
    .cr.r3 { grid-row: 3; }

    .rack-stack { display: flex; flex-direction: column; gap: 10px; }

    /*
      하단 그리드:
      col1: 13동 아래(빈공간, 60px)
      col2: 불량폐기 (12동 아래, 60px)
      col3: 10동 (1fr)
      col4: 간격 (28px)
      col5: 9동 (1fr)
      col6: 출하준비 (11동 아래, 60px)
    */
    .bottom-row {
      display: grid;
      grid-template-columns: 60px 1fr 28px 1fr 60px 60px;
      gap: 10px;
      align-items: stretch;
    }
    .bt-ship { grid-column: 1; display: flex; align-items: stretch; }
    .bt-9 { grid-column: 2; }
    .bt-gap { grid-column: 3; }
    .bt-10 { grid-column: 4; }
    .bt-scrap { grid-column: 5; display: flex; align-items: stretch; }
    .bt-empty { grid-column: 6; }

    /* 공정라벨 */
    .process-row { display: flex; justify-content: space-between; margin-top: 14px; padding: 0 4px; }
    .process-tag {
      background: rgba(180,60,60,0.7); color: #fff;
      padding: 6px 20px; border-radius: 4px; font-size: 13px; font-weight: 600;
    }
    .process-tag.entrance {
      background: rgba(39,174,96,0.7); color: #fff;
    }

    /* 랙 카드 */
    .rack-card {
      background: rgba(74,144,217,0.12); border: 1.5px solid rgba(74,144,217,0.35);
      border-radius: 8px; padding: 12px 14px; cursor: pointer;
      transition: all 0.2s ease; position: relative;
    }
    .rack-card:hover {
      background: rgba(74,144,217,0.22); border-color: rgba(74,144,217,0.7);
      transform: translateY(-1px); box-shadow: 0 4px 16px rgba(74,144,217,0.25);
    }
    .rack-card .rack-name { font-size: 17px; font-weight: 700; color: #fff; }
    .rack-card .rack-info { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .rack-card .rack-info-item { font-size: 11px; color: rgba(255,255,255,0.55); }
    .rack-card .rack-info-item strong { color: #fff; font-weight: 600; }
    .rack-card .rack-usage-bar { margin-top: 8px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .rack-usage-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .rack-card .rack-badge {
      position: absolute; top: 8px; right: 10px;
      padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
    }
    .rack-badge.active { background: rgba(39,174,96,0.2); color: #27AE60; }
    .rack-badge.empty { background: rgba(255,255,255,0.08); color: #666; }

    /* 세로 랙 */
    .rack-v {
      background: rgba(74,144,217,0.12); border: 1.5px solid rgba(74,144,217,0.35);
      border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }
    .rack-v:hover {
      background: rgba(74,144,217,0.22); border-color: rgba(74,144,217,0.7);
      box-shadow: 0 4px 16px rgba(74,144,217,0.25);
    }
    .rack-v .rv-name { font-size: 18px; font-weight: 700; color: #fff; text-align: center; line-height: 1.2; }
    .rack-v .rv-name span { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); }
    .rack-v .rv-stat { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 6px; }

    /* 대차 카드 */
    .zone-card {
      background: rgba(39,174,96,0.12); border: 1.5px solid rgba(39,174,96,0.35);
      border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.2s ease;
    }
    .zone-card:hover {
      background: rgba(39,174,96,0.22); border-color: rgba(39,174,96,0.7);
      transform: translateY(-1px); box-shadow: 0 4px 16px rgba(39,174,96,0.25);
    }
    .zone-card .zone-name { font-size: 16px; font-weight: 700; color: #fff; }
    .zone-card .zone-lane { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }

    /* 라벨 박스 */
    .label-box {
      border-radius: 6px; padding: 10px 4px; text-align: center;
      display: flex; flex-direction: column; justify-content: center;
      font-size: 11px; font-weight: 600; line-height: 1.4; width: 100%;
    }
    .label-box.scrap { background: rgba(243,156,18,0.15); border: 1.5px solid rgba(243,156,18,0.4); color: #F39C12; }
    .label-box.shipment { background: rgba(231,76,60,0.15); border: 1.5px solid rgba(231,76,60,0.4); color: #E74C3C; }
    .label-box .label-sub { font-size: 9px; color: rgba(255,255,255,0.3); margin-top: 3px; font-weight: 400; }

    .layout-loading { text-align: center; color: #888; padding: 60px 20px; font-size: 14px; }

    @media (max-width: 768px) {
      .layout-container { padding: 12px; }
      .layout-map { padding: 14px; }
      .map-main { grid-template-columns: 1fr; gap: 10px; }
      .g-left, .g-right1, .g-right2 { grid-column: 1; grid-row: auto; height: 60px; }
      .cl, .cr { grid-column: 1; grid-row: auto; }
      .cg { display: none; }
      .bottom-row { grid-template-columns: 1fr; gap: 10px; }
      .bt-empty { display: none; }
      .bt-scrap, .bt-10, .bt-9, .bt-ship { grid-column: 1; }
      .bt-gap { display: none; }
      .stats-row { gap: 8px; }
      .stat-card { min-width: 100px; padding: 12px; }
      .stat-card .stat-value { font-size: 20px; }
      .rack-v { height: 60px; }
    }
  </style>
</head>
<body>
  <div id="sidebar"></div>
  <main>
    <div class="page-header">
      <h1 class="page-title">적재대 현황</h1>
      <p class="page-desc">영업슈트 적재대 전체 배치도 — 동을 클릭하면 상세 현황을 확인할 수 있습니다</p>
    </div>
    <div class="layout-container">
      <div class="stats-row">
        <div class="stat-card blue"><div class="stat-label">전체 슬롯</div><div class="stat-value" id="statTotal">-</div><div class="stat-sub">고정랙 기준</div></div>
        <div class="stat-card green"><div class="stat-label">사용 중</div><div class="stat-value" id="statUsed">-</div><div class="stat-sub">적재 슬롯</div></div>
        <div class="stat-card orange"><div class="stat-label">빈 슬롯</div><div class="stat-value" id="statEmpty">-</div><div class="stat-sub">사용 가능</div></div>
        <div class="stat-card red"><div class="stat-label">입고대기</div><div class="stat-value" id="statWaiting">-</div><div class="stat-sub">랙 배정 필요</div></div>
        <div class="stat-card purple"><div class="stat-label">사용률</div><div class="stat-value" id="statRate">-</div><div class="stat-sub">전체 기준</div></div>
      </div>
      <div class="layout-map">
        <div class="layout-map-title">영업슈트 LAY-OUT <span>클릭하여 상세 현황 확인</span></div>
        <div class="legend-row">
          <div class="legend-item"><div class="legend-dot" style="background:rgba(74,144,217,0.5);"></div> 고정 랙 (동)</div>
          <div class="legend-item"><div class="legend-dot" style="background:rgba(39,174,96,0.5);"></div> 대차 전용 구역</div>
          <div class="legend-item"><div class="legend-dot" style="background:rgba(255,255,255,0.1);"></div> 적재 불가</div>
          <div class="legend-item"><div class="legend-dot" style="background:rgba(231,76,60,0.5);"></div> 출하준비대</div>
        </div>
        <div id="mapGrid"><div class="layout-loading">데이터를 불러오는 중...</div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="sidebar.js"></script>
  <script src="auth_guard.js"></script>
  <script>
    var SUPABASE_URL = 'https://vpaixxlhzkwtgcllimvn.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwYWl4eGxoemt3dGdjbGxpbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNzk4NjMsImV4cCI6MjA5MTk1NTg2M30.V8Bj0cMbM0E2TFhklYYa7TM-vO6Fi70ctACA7uUf4Ig';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var racksData = [], zonesData = [], slotsData = [], lotsData = [];

    document.addEventListener('DOMContentLoaded', function() {
      if (typeof checkAuth === 'function') { checkAuth(); }
      loadLayoutData();
    });

    function loadLayoutData() {
      Promise.all([
        supabase.from('inventory_racks').select('*').eq('active', true).order('sort_order'),
        supabase.from('inventory_zones').select('*').eq('active', true).order('sort_order'),
        supabase.from('inventory_rack_slots').select('*'),
        supabase.from('inventory_lots').select('*').in('status', ['waiting', 'stocked'])
      ]).then(function(res) {
        racksData = res[0].data || [];
        zonesData = res[1].data || [];
        slotsData = res[2].data || [];
        lotsData = res[3].data || [];
        renderStats();
        renderMap();
      }).catch(function(err) {
        console.error(err);
        document.getElementById('mapGrid').innerHTML = '<div class="layout-loading">데이터 로드 실패</div>';
      });
    }

    function renderStats() {
      var tot = slotsData.length, used = 0, emp = 0, wait = 0;
      for (var i = 0; i < slotsData.length; i++) { if (slotsData[i].status === 'occupied') used++; else emp++; }
      for (var j = 0; j < lotsData.length; j++) { if (lotsData[j].status === 'waiting') wait++; }
      var rate = tot > 0 ? Math.round((used / tot) * 100) : 0;
      document.getElementById('statTotal').textContent = tot.toLocaleString();
      document.getElementById('statUsed').textContent = used.toLocaleString();
      document.getElementById('statEmpty').textContent = emp.toLocaleString();
      document.getElementById('statWaiting').textContent = wait.toLocaleString();
      document.getElementById('statRate').textContent = rate + '%';
    }

    function getRackStats(rid) {
      var t = 0, u = 0;
      for (var i = 0; i < slotsData.length; i++) {
        if (slotsData[i].rack_id === rid) { t++; if (slotsData[i].status === 'occupied') u++; }
      }
      return { total: t, used: u, empty: t - u };
    }
    function getUsageColor(r) { if (r >= 90) return '#E74C3C'; if (r >= 70) return '#F39C12'; if (r >= 40) return '#3498DB'; return '#27AE60'; }
    function findRack(c) { for (var i = 0; i < racksData.length; i++) { if (racksData[i].rack_code === c) return racksData[i]; } return null; }
    function findZones(zc) { var r = []; for (var i = 0; i < zonesData.length; i++) { if (zonesData[i].zone_code === zc) r.push(zonesData[i]); } return r; }

    function buildRackCard(rack) {
      var s = getRackStats(rack.id);
      var rate = s.total > 0 ? Math.round((s.used / s.total) * 100) : 0;
      var color = getUsageColor(rate);
      var bc = s.used > 0 ? 'active' : 'empty';
      var bt = s.used > 0 ? '사용중' : '비어있음';
      var h = '';
      h += '<div class="rack-card" onclick="goToRack(\'' + rack.rack_code + '\')" title="' + rack.rack_name + ' 상세보기">';
      h += '<div class="rack-badge ' + bc + '">' + bt + '</div>';
      h += '<div class="rack-name">' + rack.rack_name + '</div>';
      h += '<div class="rack-info">';
      h += '<div class="rack-info-item">슬롯 <strong>' + s.total + '</strong></div>';
      h += '<div class="rack-info-item">사용 <strong>' + s.used + '</strong></div>';
      h += '<div class="rack-info-item">빈칸 <strong>' + s.empty + '</strong></div>';
      h += '<div class="rack-info-item">사용률 <strong>' + rate + '%</strong></div>';
      h += '</div>';
      h += '<div class="rack-usage-bar"><div class="rack-usage-fill" style="width:' + rate + '%;background:' + color + ';"></div></div>';
      h += '</div>';
      return h;
    }

    function buildVertical(rack) {
      var s = getRackStats(rack.id);
      var name = rack.rack_name;
      var num = name.replace('동', '');
      var h = '';
      h += '<div class="rack-v" onclick="goToRack(\'' + rack.rack_code + '\')" title="' + rack.rack_name + ' 상세보기">';
      h += '<div class="rv-name">' + num + '<span>동</span></div>';
      h += '<div class="rv-stat">' + s.used + '/' + s.total + '</div>';
      h += '</div>';
      return h;
    }

    function buildZoneCard(zone) {
      var lots = 0, qty = 0;
      for (var i = 0; i < lotsData.length; i++) {
        if (lotsData[i].zone_id === zone.id && lotsData[i].status === 'stocked') { lots++; qty += lotsData[i].quantity || 0; }
      }
      var h = '';
      h += '<div class="zone-card" onclick="goToZone(\'' + zone.zone_code + '\',' + zone.lane_no + ')" title="' + zone.zone_name + ' ' + zone.lane_name + ' 상세보기">';
      h += '<div class="zone-name">' + zone.zone_name + ' - ' + zone.lane_name + '</div>';
      h += '<div class="zone-lane">LOT ' + lots + '건 / ' + qty.toLocaleString() + '개</div>';
      h += '</div>';
      return h;
    }

    function rc(code) { var r = findRack(code); return r ? buildRackCard(r) : '<div></div>'; }

    function renderMap() {
      var h = '';
      h += '<div class="map-outer">';

      // ① 상단 공정라벨: 포장 > 검사 > 조립
      h += '<div class="process-row">';
      h += '<div class="process-tag">포장</div>';
      h += '<div class="process-tag">검사</div>';
      h += '<div class="process-tag">조립</div>';
      h += '</div>';

      // ② 출하준비 + 9동 | gap | 10동 + 불량폐기
      h += '<div class="bottom-row">';
      h += '<div class="bt-ship"><div class="label-box shipment">출하<br>준비<div class="label-sub">관리 제외</div></div></div>';
      h += '<div class="bt-9">' + rc('R9') + '</div>';
      h += '<div class="bt-gap"></div>';
      h += '<div class="bt-10">' + rc('R10') + '</div>';
      h += '<div class="bt-scrap"><div class="label-box scrap">불량<br>폐기<div class="label-sub">관리 제외</div></div></div>';
      h += '</div>';

      // ③ 메인 그리드: 11동(좌) | A/1/2/5/6동 | gap | B/3/4/7/8동 | 12동(우) | 13동(우)
      h += '<div class="map-main">';

      // 11동 (col1 좌측)
      var r11 = findRack('R11');
      h += '<div class="g-left">' + (r11 ? buildVertical(r11) : '') + '</div>';

      // row1: 6/5동 | gap | 8/7동
      h += '<div class="cl r1"><div class="rack-stack">' + rc('R6') + rc('R5') + '</div></div>';
      h += '<div class="cg r1"></div>';
      h += '<div class="cr r1"><div class="rack-stack">' + rc('R8') + rc('R7') + '</div></div>';

      // 12동 (col5 우측)
      var r12 = findRack('R12');
      h += '<div class="g-right1">' + (r12 ? buildVertical(r12) : '') + '</div>';

      // 13동 (col6 우측)
      var r13 = findRack('R13');
      h += '<div class="g-right2">' + (r13 ? buildVertical(r13) : '') + '</div>';

      // row2: A동 | gap | B동
      var az = findZones('ZA'), bz = findZones('ZB');
      h += '<div class="cl r2"><div class="rack-stack">';
      for (var a = az.length - 1; a >= 0; a--) h += buildZoneCard(az[a]);
      h += '</div></div>';
      h += '<div class="cg r2"></div>';
      h += '<div class="cr r2"><div class="rack-stack">';
      for (var b = bz.length - 1; b >= 0; b--) h += buildZoneCard(bz[b]);
      h += '</div></div>';

      // row3: 1/2동 | gap | 3/4동
      h += '<div class="cl r3"><div class="rack-stack">' + rc('R2') + rc('R1') + '</div></div>';
      h += '<div class="cg r3"></div>';
      h += '<div class="cr r3"><div class="rack-stack">' + rc('R4') + rc('R3') + '</div></div>';

      h += '</div>'; // map-main

      // ④ 하단: 출입구(좌측) + 적재불가
      h += '<div style="display:flex;gap:14px;align-items:stretch;">';
      h += '<div class="process-tag entrance" style="display:flex;align-items:center;padding:12px 20px;border-radius:6px;font-size:14px;">출입구</div>';
      h += '<div class="zone-restricted" style="flex:1;">';
      h += '<div class="zone-restricted-title">포장BOX / 공BOX / 팔레트 적재</div>';
      h += '<div class="zone-restricted-sub">(지정품목 외 적재 불가지역)</div>';
      h += '</div>';
      h += '</div>';

      h += '</div>';
      document.getElementById('mapGrid').innerHTML = h;
    }

    function goToRack(rackCode) { window.location.href = 'inventory_rack.html?rack=' + rackCode; }
    function goToZone(zoneCode, laneNo) { window.location.href = 'inventory_zone.html?zone=' + zoneCode + '&lane=' + laneNo; }
  </script>
</body>
</html>
