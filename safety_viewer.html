function expandSafetyRows(r){
  const cd = r.check_data;
  if (!cd || typeof cd !== 'object') return [r];
  const entries = Object.entries(cd);
  const nested = entries.filter(([k,v]) => v && typeof v === 'object' && !Array.isArray(v));
  if (nested.length === 0) return [r];   // 평면 구조(성형·사상 등)는 그대로

    const m = EQ_KEY_MAP[eqKey] || [eqKey, ''];
    return { ...r, _eqKey: eqKey, equipment_no: r.equipment_no || m[0], equipment_id: r.equipment_id || m[1], check_data: sub };
  });
}

// 행(공정·설비)과 항목 번호로 한글 라벨 찾기 — 없으면 '항목N' 폴백
function itemLabelOf(r, num) {
  const L = ITEM_LABELS[r._process];
  if (!L) return '항목 ' + num;
  if (L._nested) {
    let sub = r._eqKey ? L._nested[r._eqKey] : null;
    if (!sub) { for (const k in L._nested) { if (L._nested[k][num]) { sub = L._nested[k]; break; } } }
    return (sub && sub[num]) || ('항목 ' + num);
  }
  return L[num] || ('항목 ' + num);
}

async function init() {
  const user = await checkAuth();
  if (!user) return;
  me = user;
  document.getElementById('authCheckOverlay').style.display = 'none';
  document.getElementById('userInfo').textContent = user.name || '';
  const today = new Date();
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('startDate').value = fmt(today);
  document.getElementById('endDate').value = fmt(today);
}

function setPeriod(type, btn) {
  const now = new Date();
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let s, e;
  if (type==='today') { s=e=fmt(now); }
  else if (type==='yesterday') { s=e=fmt(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1)); }
  else if (type==='thisMonth') { s=fmt(new Date(now.getFullYear(),now.getMonth(),1)); e=fmt(new Date(now.getFullYear(),now.getMonth()+1,0)); }
  else if (type==='lastMonth') { s=fmt(new Date(now.getFullYear(),now.getMonth()-1,1)); e=fmt(new Date(now.getFullYear(),now.getMonth(),0)); }
  document.getElementById('startDate').value = s;
  document.getElementById('endDate').value = e;
  document.querySelectorAll('.period-btn').forEach(b=>{b.classList.remove('active')});
  btn.classList.add('active');
  loadData();
}

async function loadData() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const proc = document.getElementById('filterProcess').value;
  const equipFilter = document.getElementById('filterEquip').value.trim().toLowerCase();
  
  if (!start || !end) { showToast('기간을 선택해주세요.'); return; }
  
  allData = [];
  const tables = proc === 'all' ? SAFETY_TABLES : SAFETY_TABLES.filter(t => t.key === proc);
  
  for (const t of tables) {
    try {
      let q = db.from(t.table).select('*').gte(t.dateCol, start).lte(t.dateCol, end);
      const { data } = await q.order(t.dateCol, { ascending: false });
      if (data) {
        data.forEach(r => {
          expandSafetyRows(r).forEach(x => {
            if (equipFilter && !(x.equipment_no||'').toLowerCase().includes(equipFilter)) return;
            allData.push({ ...x, _process: t.label, _table: t.table });
          });
        });
      }
    } catch(e) {}
  }
  
  renderStats();
  renderTable();
}

function renderStats() {
  let normal=0, repair=0, unusable=0, notuse=0;
  allData.forEach(r => {
    const cd = r.check_data || {};
    Object.values(cd).forEach(v => {
      if (typeof v !== 'string') return;
      if (v==='○') normal++;
      else if (v==='△') repair++;
      else if (v==='×') unusable++;
      else if (v==='│') notuse++;
    });
  });
  document.getElementById('statTotal').innerHTML = allData.length + ' <span style="font-size:14px;font-weight:400">건</span>';
  document.getElementById('statNormal').textContent = normal;
  document.getElementById('statRepair').textContent = repair;
  document.getElementById('statUnusable').textContent = unusable;
}

// ── 헤더 정렬·필터 ──
function setSort(key) {
  if (sortState.key === key) sortState.dir = -sortState.dir;
  else { sortState.key = key; sortState.dir = INIT_DIR[key] || 1; }
  applyView();
}
function setColFilter(key, val) { colFilters[key] = val; applyView(); }

// 행의 이상 등급: × = 2, △ = 1, 정상 = 0 (점검결과 정렬·필터용)
function issueRankOf(r) {
  const cd = r.check_data || {};
  let rank = 0;
  for (const k in cd) {
    const v = cd[k];
    if (typeof v !== 'string' || k === 'remarks') continue;
    if (v === '×') return 2;
    if (v === '△') rank = 1;
  }
  return rank;
}

const SORT_VAL = {
  check_date: r => r.check_date || '',
  process: r => r._process || '',
  equip: r => r.equipment_no || '',
  eqid: r => r.equipment_id || '',
  result: r => issueRankOf(r),
  checker: r => r.checked_by_name || '',
  time: r => r.checked_at || ''
};

function getViewRows() {
  const rows = allData.filter(r => {
    if (colFilters.process && (r._process || '') !== colFilters.process) return false;
    if (colFilters.equip && (r.equipment_no || '') !== colFilters.equip) return false;
    if (colFilters.eqid && (r.equipment_id || '').toLowerCase().indexOf(colFilters.eqid.trim().toLowerCase()) === -1) return false;
    if (colFilters.checker && (r.checked_by_name || '') !== colFilters.checker) return false;
    if (colFilters.result === 'issue' && issueRankOf(r) === 0) return false;
    if (colFilters.result === 'normal' && issueRankOf(r) !== 0) return false;
    return true;
  });
  if (sortState.key && SORT_VAL[sortState.key]) {
    const fv = SORT_VAL[sortState.key], d = sortState.dir;
    rows.sort((a, b) => {
      const va = fv(a), vb = fv(b);
      const c = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'ko');
      return c * d;
    });
  }
  return rows;   // 정렬 미지정 시 조회 원래 순서 유지
}

function renderTable() {
  if (allData.length === 0) {
    document.getElementById('resultArea').innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;font-size:14px">데이터가 없어요.</div>';
    viewRows = [];
    return;
  }
  const uniq = fn => [...new Set(allData.map(fn).filter(v => v))].sort((a, b) => String(a).localeCompare(String(b), 'ko'));
  const opts = (arr, cur) => '<option value="">전체</option>' + arr.map(v =>
    `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${v}</option>`).join('');
  const sTh = (key, label, extra) =>
    `<th class="sortable" onclick="setSort('${key}')">${label}<span class="s-arr" data-k="${key}"></span>${extra || ''}</th>`;

  // 헤더+필터 행은 조회 시 1회만 그림 → 이후 tbody만 갱신 (필터 입력 중 포커스 유지)
  document.getElementById('resultArea').innerHTML = `
    <div style="font-size:12px;color:#64748b;margin-bottom:6px" id="viewCount"></div>
    <div class="table-wrap"><table>
      <thead>
      <tr>
        <th>NO</th>${sTh('check_date','점검일')}${sTh('process','공정')}${sTh('equip','설비')}${sTh('eqid','관리번호')}
        ${sTh('result','점검결과',' <span style="font-weight:400;font-size:11px;color:#94a3b8">(행 클릭 시 항목 표시)</span>')}<th>특이사항</th>${sTh('checker','점검자')}${sTh('time','점검시간')}<th>작업</th>
      </tr>
      <tr class="filter-row">
        <th></th><th></th>
        <th><select onchange="setColFilter('process',this.value)">${opts(uniq(r => r._process), colFilters.process)}</select></th>
        <th><select onchange="setColFilter('equip',this.value)">${opts(uniq(r => r.equipment_no), colFilters.equip)}</select></th>
        <th><input type="text" value="${colFilters.eqid}" oninput="setColFilter('eqid',this.value)" placeholder="검색"></th>
        <th><select onchange="setColFilter('result',this.value)"><option value="">전체</option><option value="issue"${colFilters.result==='issue' ? ' selected' : ''}>이상 있음(△·×)</option><option value="normal"${colFilters.result==='normal' ? ' selected' : ''}>정상만</option></select></th>
        <th></th>
        <th><select onchange="setColFilter('checker',this.value)">${opts(uniq(r => r.checked_by_name), colFilters.checker)}</select></th>
        <th></th><th></th>
      </tr>
      </thead>
      <tbody id="sfTbody"></tbody>
    </table></div>`;
  applyView();
}

function applyView() {
  viewRows = getViewRows();
  const tb = document.getElementById('sfTbody');
  if (!tb) return;

  const badgeHtml = (v, ttl) => {
    const t = ttl ? ` title="${ttl}"` : '';
    if (v==='○') return `<span class="badge badge-normal"${t}>○</span>`;
    if (v==='△') return `<span class="badge badge-repair"${t}>△</span>`;
    if (v==='×') return `<span class="badge badge-unusable"${t}>×</span>`;
    if (v==='│') return `<span class="badge badge-notuse"${t}>│</span>`;
    return v||'-';
  };

  tb.innerHTML = viewRows.map((r,i) => {
    const cd = r.check_data || {};
    const items = Object.entries(cd).filter(([k,v]) => typeof v === 'string' && k !== 'remarks');
    const resultHtml = items.map(([k,v]) => badgeHtml(v, k + '. ' + itemLabelOf(r, k))).join(' ');
    const detailHtml = items.map(([k,v]) => `<span class="sf-detail-item">${k}. ${itemLabelOf(r, k)} ${badgeHtml(v)}</span>`).join('');
    const hasIssue = items.some(([k,v]) => v==='△' || v==='×');
    const time = r.checked_at ? new Date(r.checked_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '-';
    const remarks = cd.remarks || r.overall_remarks || r.remarks || '-';
    return `<tr class="sf-row" onclick="toggleSfDetail(${i})" style="cursor:pointer;${hasIssue?'background:#fef2f2':''}">
      <td style="text-align:center">${i+1}</td>
      <td>${r.check_date||r[Object.keys(r).find(k=>k.includes('date'))]||'-'}</td>
      <td><span style="font-weight:600">${r._process}</span></td>
      <td style="font-size:12px">${r.equipment_no||'-'}</td>
      <td style="font-size:11px;color:#888">${r.equipment_id||'-'}</td>
      <td>${resultHtml}</td>
      <td style="font-size:12px">${remarks}</td>
      <td>${r.checked_by_name||'-'}</td>
      <td style="font-size:11px;color:#888">${time}</td>
      <td onclick="event.stopPropagation()"><div class="row-actions"><button class="btn-row btn-row-edit" onclick="openEditSafety(${i})">수정</button><button class="btn-row btn-row-del" onclick="deleteSafety(${i})">삭제</button></div></td>
    </tr>
    <tr class="sf-detail" id="sfDetail${i}" style="display:none">
      <td colspan="10"><div class="sf-detail-grid">${detailHtml || '<span style="color:#aaa">점검 항목 없음</span>'}</div></td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" style="text-align:center;color:#aaa;padding:24px">필터 조건에 맞는 행이 없어요.</td></tr>';

  const vc = document.getElementById('viewCount');
  if (vc) vc.textContent = `표시 ${viewRows.length}건 / 전체 ${allData.length}건` + (viewRows.length !== allData.length ? ' — 필터 적용 중 (엑셀도 표시된 행만 저장)' : '');
  document.querySelectorAll('.s-arr').forEach(el => {
    el.textContent = (el.dataset.k === sortState.key) ? (sortState.dir === 1 ? '▲' : '▼') : '';
  });
}

// 점검 항목 상세행 접기/펼치기
function toggleSfDetail(i) {
  const el = document.getElementById('sfDetail' + i);
  if (el) el.style.display = (el.style.display === 'none') ? '' : 'none';
}

// ═══ 수정/삭제 (2026-10-15) ═══
// · 수정: 해당 행(설비)의 점검 항목(○/△/×/│)과 특이사항만 변경.
//   혼련·도포·쇼트처럼 한 기록에 여러 설비가 묶인 경우(check_data 중첩)는 그 설비 블록만 바꿔서 저장.
// · 삭제: 점검 테이블에는 소프트삭제 컬럼이 없어 완전 삭제(합의: 2026-10-15).
//   대신 삭제 전 원본을 변경이력(audit_logs)에 먼저 기록하고, 기록 실패 시 삭제를 중단해 유실을 막음.
//   중첩 기록은 묶인 설비 전체가 함께 지워지므로 경고에 명시.
const SAFETY_RESULT_OPTS = ['○','△','×','│'];

async function logSvAudit(action, table, recordId, before, after, reason) {
  const payload = {
    table_name: table, action,
    changed_by_emp_code: me?.emp_code || null, changed_by_name: me?.name || '-',
    changed_by_dept: me?.department || '', before_data: before, after_data: after,
    reason: reason || null
  };
  let r = await db.from('audit_logs').insert({ ...payload, record_id: recordId });
  if (r.error) r = await db.from('audit_logs').insert({ ...payload, record_id: null, reason: ((reason || '') + ' record_id=' + recordId).trim() });
  window._lastAuditErr = r.error ? r.error.message : null;   // 실패 원인을 알림창에 그대로 노출
  return !r.error;
}

function svMeta(r) {
  return `${r.check_date || '-'} · ${r._process} · ${r.equipment_no || '-'}` + (r.equipment_id ? ` (${r.equipment_id})` : '') + ` · 점검자 ${r.checked_by_name || '-'}`;
}

function openEditSafety(i) {
  const r = viewRows[i]; if (!r) return;
  editingSafety = r;
  const cd = r.check_data || {};
  const items = Object.entries(cd).filter(([k,v]) => typeof v === 'string' && k !== 'remarks');
  document.getElementById('svm_meta').textContent = svMeta(r);
  document.getElementById('svm_items').innerHTML = items.map(([k,v]) =>
    `<div class="svm-item"><span>${k}. ${itemLabelOf(r, k)}</span>
     <select id="svi_${k}">${SAFETY_RESULT_OPTS.map(o => `<option value="${o}"${o===v?' selected':''}>${o==='○'?'○ 정상':o==='△'?'△ 수리요망':o==='×'?'× 사용불가':'│ 미사용'}</option>`).join('')}${SAFETY_RESULT_OPTS.includes(v)?'':`<option value="${v}" selected>${v}</option>`}</select></div>`).join('')
    || '<div style="color:#aaa;font-size:13px;padding:8px 0">점검 항목이 없어요.</div>';
  const remarks = (cd.remarks !== undefined ? cd.remarks : (r.overall_remarks !== undefined && r.overall_remarks !== null ? r.overall_remarks : r.remarks)) || '';
  document.getElementById('svm_remarks').value = remarks;
  document.getElementById('safetyModal').classList.add('open');
}

async function saveEditSafety() {
  try {
  const r = editingSafety; if (!r) return;
  const btn = document.getElementById('svm_save'); btn.disabled = true;
  // 최신 원본을 다시 읽어 그 위에 반영 (수정 사이에 바뀐 다른 설비 블록 보존)
  const { data: rec, error: qErr } = await db.from(r._table).select('*').eq('id', r.id).single();
  if (qErr || !rec) { btn.disabled = false; alert('[저장 중단] 원본 조회 실패\n' + (qErr?.message || '기록 없음')); return; }

  const curCd = r.check_data || {};
  const newVals = {};
  Object.entries(curCd).forEach(([k,v]) => {
    if (typeof v !== 'string' || k === 'remarks') return;
    const sel = document.getElementById('svi_' + k);
    if (sel) newVals[k] = sel.value;
  });
  const remarksVal = document.getElementById('svm_remarks').value.trim();

  const upd = {};
  const beforeScope = JSON.parse(JSON.stringify(r.check_data || {}));
  if (r._eqKey) {
    // 중첩 구조: 해당 설비 블록만 교체
    const full = (rec.check_data && typeof rec.check_data === 'object') ? JSON.parse(JSON.stringify(rec.check_data)) : {};
    const sub = (full[r._eqKey] && typeof full[r._eqKey] === 'object') ? full[r._eqKey] : {};
    Object.keys(newVals).forEach(k => { sub[k] = newVals[k]; });
    if (remarksVal || sub.remarks !== undefined) sub.remarks = remarksVal;
    full[r._eqKey] = sub;
    upd.check_data = full;
  } else {
    // 평면 구조
    const full = (rec.check_data && typeof rec.check_data === 'object') ? JSON.parse(JSON.stringify(rec.check_data)) : {};
    Object.keys(newVals).forEach(k => { full[k] = newVals[k]; });
    if (full.remarks !== undefined) full.remarks = remarksVal;
    else if ('overall_remarks' in rec) upd.overall_remarks = remarksVal || null;
    else if ('remarks' in rec) upd.remarks = remarksVal || null;
    else if (remarksVal) full.remarks = remarksVal;
    upd.check_data = full;
  }

  const { data: updRows, error } = await db.from(r._table).update(upd).eq('id', r.id).select('id');
  btn.disabled = false;
  if (error) { alert('[저장 실패] ' + error.message); return; }
  if (!updRows || updRows.length === 0) { alert('[저장 안 됨] 이 테이블(' + r._table + ')에 수정 권한 정책이 없어 0건 처리됐어요.\n관리자에게 정책 추가를 요청해 주세요.'); return; }
  try { await logSvAudit('update', r._table, r.id, { equipment: r.equipment_no, eqKey: r._eqKey || null, check_data: beforeScope }, { check_data: upd.check_data, remarks: remarksVal }, '설비점검 수정'); } catch(e) {}
  showToast('✓ 수정 완료');
  closeSafetyModal();
  loadData();
  } catch(ex) { var b=document.getElementById('svm_save'); if(b) b.disabled=false; alert('[저장 오류] ' + (ex && ex.message ? ex.message : ex)); console.error(ex); }
}

async function deleteSafety(i) {
  try {
  const r = viewRows[i]; if (!r) { alert('행 정보를 찾지 못했어요. 새로고침 후 다시 시도해 주세요.'); return; }
  const siblings = allData.filter(x => x._table === r._table && x.id === r.id);
  const eqNames = [...new Set(siblings.map(x => x.equipment_no || '-'))];
  let msg = '이 점검 기록을 삭제할까요?\n\n' + svMeta(r);
  if (eqNames.length > 1) msg += '\n\n⚠ 이 기록에는 설비 ' + eqNames.length + '개가 묶여 있어 모두 함께 삭제돼요:\n· ' + eqNames.join('\n· ');
  msg += '\n\n※ 점검 기록은 완전 삭제되며 되돌릴 수 없어요. (삭제 전 내용은 변경이력에 보존)';
  if (!confirm(msg)) return;

  // 1) 원본 확보 → 2) 변경이력 기록 (실패 시 삭제 중단) → 3) 삭제
  const { data: rec, error: qErr } = await db.from(r._table).select('*').eq('id', r.id).single();
  if (qErr || !rec) { alert('[삭제 중단] 원본 조회 실패\n' + (qErr ? qErr.message : '기록 없음') + '\n(이 메시지를 관리자에게 전달해 주세요)'); return; }
  const audited = await logSvAudit('delete', r._table, r.id, rec, null, '설비점검 조회에서 완전 삭제');
  if (audited !== true) { alert('[삭제 중단] 변경이력 기록 실패\n' + (window._lastAuditErr || '원인 미상') + '\n(이력 없이 완전 삭제는 위험해 중단했어요. 이 메시지를 관리자에게 전달해 주세요)'); return; }
  const { data: delRows, error } = await db.from(r._table).delete().eq('id', r.id).select('id');
  if (error) { alert('[삭제 실패] ' + error.message + '\n(이 메시지를 관리자에게 전달해 주세요)'); return; }
  if (!delRows || delRows.length === 0) { alert('[삭제 안 됨] 이 테이블(' + r._table + ')에 삭제 권한 정책이 없어 0건 처리됐어요.\n관리자에게 정책 추가를 요청해 주세요.'); return; }
  showToast('✓ 삭제 완료');
  loadData();
  } catch(ex) { alert('[삭제 오류] ' + (ex && ex.message ? ex.message : ex) + '\n(이 메시지를 관리자에게 전달해 주세요)'); console.error(ex); }
}

function closeSafetyModal() {
  document.getElementById('safetyModal').classList.remove('open');
  editingSafety = null;
}

function downloadExcel() {
  if (viewRows.length === 0) { showToast('다운로드할 데이터가 없어요. (필터를 확인해 주세요)'); return; }
  const rows = viewRows.map((r,i) => {
    const cd = r.check_data || {};
    const items = Object.entries(cd).filter(([k,v]) => typeof v === 'string' && k !== 'remarks');
    return {
      'NO': i+1,
      '점검일': r.check_date || '-',
      '공정': r._process,
      '설비': r.equipment_no || '-',
      '관리번호': r.equipment_id || '-',
      '점검결과': items.map(([k,v]) => `${k}.${itemLabelOf(r, k)}:${v}`).join(' / '),
      '특이사항': cd.remarks || r.overall_remarks || '',
      '점검자': r.checked_by_name || '-'
    };
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, '설비점검');
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  XLSX.writeFile(wb, `설비점검_${start}_${end}.xlsx`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
