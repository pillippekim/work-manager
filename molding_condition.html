<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성형조건 조회 - HKHT</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="auth_guard.js"></script>
<style>
/* ── molding_condition 고유 스타일 ── */
.container{max-width:1500px}
.filter-bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.filter-group label{display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:500}
.filter-group input,.filter-group select{padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;background:#fff;outline:none;font-family:inherit}
.filter-group input:focus,.filter-group select:focus{border-color:#243bb2}
.btn-excel{background:#059669;color:white;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.period-btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.period-btn{padding:8px 14px;border:1px solid #d1d5db;background:white;color:#555;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.period-btn.active{background:#243bb2;color:white;border-color:#243bb2}
.table-wrap{overflow-x:auto}
th{background:#f8fafc;color:#475569;font-weight:600;border-bottom:2px solid #e2e8f0;white-space:nowrap}
td{border-bottom:1px solid #f1f5f9;white-space:nowrap}
th.cond-std{background:#fff8e6}
th.cond-first{background:#e9f9f0}
th.cond-middle{background:#fdeef4}
th.cond-last{background:#eef7ef}
.cond-cell{font-size:12px;text-align:center}
.cond-cell b{font-size:13px}
.cond-cell .u{color:#94a3b8;font-size:10px;margin-left:1px}
.cond-empty{color:#cbd5e1;text-align:center}
.tag-old{display:inline-block;background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.tag-change{display:inline-block;background:#fff7ed;color:#d97706;border:1px solid #fdba74;border-radius:4px;font-size:11px;padding:1px 6px;font-weight:700}
.face-tag{display:inline-block;border-radius:4px;font-size:11px;padding:1px 6px;font-weight:700}
</style>
</head>
<body>

<!-- 권한 체크 로딩 화면 -->
<div id="authCheckOverlay" style="position:fixed;inset:0;background:#f1f3f9;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
  <div style="width:36px;height:36px;border:3px solid #e5e5e5;border-top-color:#243bb2;border-radius:50%;animation:authSpin 0.8s linear infinite"></div>
  <div style="font-size:13px;color:#888;font-family:inherit">권한 확인 중...</div>
  <style>@keyframes authSpin { to { transform: rotate(360deg); } }</style>
</div>

<!-- WM 레이아웃 -->
<div id="top-header" class="top-header"></div>
<nav id="sidebar-nav" class="sidebar"></nav>

<div class="main">

<div class="page-header">
    <div class="header-row">
      <div>
        <h1>🌡️ 성형조건 조회</h1>
        <div class="sub">성형 작업일지의 기준·초품·중품·종품 조건(성형압력/상판온도/하판온도)을 조회하고 엑셀로 추출합니다</div>
      </div>
      <div class="header-actions">
        <button class="btn-excel" onclick="downloadExcel()">📥 엑셀</button>
      </div>
    </div>
  </div>

<div class="container">

  <div class="card">
    <div class="filter-bar">
      <div class="filter-group"><label>시작일</label><input type="date" id="startDate" /></div>
      <div class="filter-group"><label>종료일</label><input type="date" id="endDate" /></div>
      <div class="filter-group">
        <div class="period-btns">
          <button class="period-btn active" onclick="setPeriod('today',this)">당일</button>
          <button class="period-btn" onclick="setPeriod('thisMonth',this)">당월</button>
          <button class="period-btn" onclick="setPeriod('yesterday',this)">전일</button>
          <button class="period-btn" onclick="setPeriod('lastMonth',this)">전월</button>
        </div>
      </div>
      <div class="filter-group"><label>설비</label><input type="text" id="filterEquip" placeholder="예: 05호기" /></div>
      <div class="filter-group"><label>사번/품명</label><input type="text" id="filterSabun" placeholder="사번 또는 품명 검색" /></div>
      <button class="btn-search" onclick="loadData()">🔍 조회</button>
      <button class="btn-excel" onclick="downloadExcel()">📥 엑셀</button>
    </div>
  </div>

  <div class="stats-row" id="statsArea">
    <div class="stat-card"><div class="stat-label">총 작업 기록</div><div class="stat-num" id="statTotal">0 <span style="font-size:14px;font-weight:400">건</span></div></div>
    <div class="stat-card"><div class="stat-label">조건 입력</div><div class="stat-num" style="color:#243bb2" id="statCond">0</div></div>
    <div class="stat-card"><div class="stat-label">초·중·종 완비</div><div class="stat-num" style="color:#10b981" id="statFull">0</div></div>
    <div class="stat-card"><div class="stat-label">조건 미입력</div><div class="stat-num" style="color:#ef4444" id="statNone">0</div></div>
  </div>

  <div class="card" id="resultArea">
    <div style="text-align:center;color:#aaa;padding:40px;font-size:14px">조회 버튼을 눌러주세요</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://vpaixxlhzkwtgcllimvn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwYWl4eGxoemt3dGdjbGxpbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNzk4NjMsImV4cCI6MjA5MTk1NTg2M30.V8Bj0cMbM0E2TFhklYYa7TM-vO6Fi70ctACA7uUf4Ig';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allData = [];      // 원본 기록
let dispRows = [];     // 화면/엑셀용 전개 행 (교체 전/후 분리)
let PRODUCTS = {};     // 사번 → 품명 (products는 로그인 세션 필요 — RLS)

const TYPES = [['standard','기준'],['first','초품'],['middle','중품'],['last','종품']];
const FACE_LABELS = { single:'-', ga:'가면', na:'나면', da:'다면' };
const FACE_COLORS = { ga:'#fff3cd', na:'#dbeafe', da:'#d4edda' };

async function init() {
  const user = await checkAuth();
  if (!user) return;
  document.getElementById('authCheckOverlay').style.display = 'none';
  document.getElementById('userInfo') && (document.getElementById('userInfo').textContent = user.name || '');
  const today = new Date();
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('startDate').value = fmt(today);
  document.getElementById('endDate').value = fmt(today);
  loadProducts();   // 백그라운드 로딩 (품명 표시용)
}

async function loadProducts() {
  // 1,000행 제한 → range 페이지네이션으로 전부 로딩
  let from = 0;
  const chunk = 1000;
  while (true) {
    const { data, error } = await db.from('products')
      .select('sabun, part_name')
      .range(from, from + chunk - 1);
    if (error || !data || data.length === 0) break;
    data.forEach(r => { PRODUCTS[r.sabun] = r.part_name || ''; });
    if (data.length < chunk) break;
    from += chunk;
  }
}

function setPeriod(type, btn) {
  const now = new Date();
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let s, e;
  if (type==='today') { s=e=fmt(now); }
  else if (type==='yesterday') { s=e=fmt(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1)); }
  else if (type==='thisMonth') { s=fmt(new Date(now.getFullYear(),now.getMonth(),1)); e=fmt(new Date(now.getFullYear(),now.getMonth()+1,0)); }
  else if (type==='lastMonth') { s=fmt(new Date(now.getFullYear(),now.getMonth()-1,1)); e=fmt(new Date(now.getFullYear(),now.getMonth(),0)); }
  document.getElementById('startDate').value = s;
  document.getElementById('endDate').value = e;
  document.querySelectorAll('.period-btn').forEach(b=>{b.classList.remove('active')});
  btn.classList.add('active');
  loadData();
}

async function loadData() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  if (!start || !end) { showToast('기간을 선택해주세요.'); return; }

  document.getElementById('resultArea').innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;font-size:14px">조회 중...</div>';

  // 1,000행 제한 → range 페이지네이션 / 소프트삭제 제외
  allData = [];
  let from = 0;
  const chunk = 1000;
  while (true) {
    const { data, error } = await db.from('molding_reports')
      .select('id, work_date, shift_type, equipment_no, work_type, sabun, product_name, worker_name, note, upper_temp, lower_temp, molding_pressure')
      .gte('work_date', start).lte('work_date', end)
      .is('deleted_at', null)
      .order('work_date', { ascending: false })
      .order('equipment_no', { ascending: true })
      .range(from, from + chunk - 1);
    if (error) { showToast('조회 오류: ' + error.message); return; }
    if (!data || data.length === 0) break;
    allData = allData.concat(data);
    if (data.length < chunk) break;
    from += chunk;
  }

  // 텍스트 필터
  const fe = document.getElementById('filterEquip').value.trim();
  const fs = document.getElementById('filterSabun').value.trim().toLowerCase();
  if (fe) allData = allData.filter(r => (r.equipment_no||'').includes(fe));
  if (fs) allData = allData.filter(r => {
    const nm = (r.product_name || PRODUCTS[r.sabun] || '').toLowerCase();
    return String(r.sabun||'').toLowerCase().includes(fs) || nm.includes(fs);
  });

  buildDispRows();
  renderStats();
  renderTable();
}

// note JSON에서 해당 면의 조건 4유형 추출 (suffix='' 교체 전 / '_c' 교체 후)
function condSetOf(conds, face, suffix) {
  const out = {}; let has = false;
  TYPES.forEach(([key]) => {
    const c = (conds[key + suffix] || {})[face] || {};
    const v = { p: c.pressure || '', u: c.upper || '', l: c.lower || '' };
    out[key] = v;
    if (v.p || v.u || v.l) has = true;
  });
  return has ? out : null;
}

// 기록 1건 → 화면 행(교체 전 1행 + 교체 후 있으면 1행) 전개
function buildDispRows() {
  dispRows = [];
  allData.forEach(r => {
    let face = 'single', conds = null;
    try {
      const n = JSON.parse(r.note);
      face = n.face || 'single';
      conds = n.conditions || null;
    } catch(e) {}

    const base = {
      work_date: r.work_date || '', shift: r.shift_type || '', equip: r.equipment_no || '',
      work_type: r.work_type || '표준', sabun: r.sabun || '',
      pname: r.product_name || PRODUCTS[r.sabun] || '',
      worker: r.worker_name || '', face: face
    };

    let main = conds ? condSetOf(conds, face, '') : null;
    let isOld = false;
    if (!main && (r.upper_temp != null || r.lower_temp != null || (r.molding_pressure != null && r.molding_pressure !== ''))) {
      // 구버전 단일 기록 → '기준' 열에 표시 + (구) 표식
      main = { standard: { p: r.molding_pressure || '', u: r.upper_temp != null ? r.upper_temp : '', l: r.lower_temp != null ? r.lower_temp : '' },
               first: {p:'',u:'',l:''}, middle: {p:'',u:'',l:''}, last: {p:'',u:'',l:''} };
      isOld = true;
    }
    dispRows.push({ ...base, stage: '', cond: main, old: isOld });

    // 금형 교체 후 세트
    const after = conds ? condSetOf(conds, face, '_c') : null;
    if (after) dispRows.push({ ...base, stage: 'after', cond: after, old: false });
  });
}

function isFull(cond) {
  // 초품·중품·종품 3유형 모두 값(압력/온도 중 하나라도) 존재
  return cond && ['first','middle','last'].every(k => cond[k].p || cond[k].u || cond[k].l);
}

function renderStats() {
  const total = allData.length;
  let condCnt = 0, fullCnt = 0;
  // 기록 단위 통계 (교체 후 행은 제외하고 원 기록 기준)
  dispRows.filter(x => x.stage === '').forEach(x => {
    if (x.cond && !x.old) condCnt++;
    else if (x.old) condCnt++;
    if (isFull(x.cond)) fullCnt++;
  });
  document.getElementById('statTotal').innerHTML = total + ' <span style="font-size:14px;font-weight:400">건</span>';
  document.getElementById('statCond').textContent = condCnt;
  document.getElementById('statFull').textContent = fullCnt;
  document.getElementById('statNone').textContent = total - condCnt;
}

function condCellHtml(v) {
  if (!v || (!v.p && !v.u && !v.l)) return '<td class="cond-empty">·</td>';
  const t = (v.u !== '' || v.l !== '') ? `${v.u !== '' ? v.u : '-'}/${v.l !== '' ? v.l : '-'}<span class="u">℃</span>` : '';
  const p = v.p !== '' ? `<b>${v.p}</b><span class="u">kgf</span>` : '';
  return `<td class="cond-cell">${[p, t].filter(Boolean).join(' · ') || '·'}</td>`;
}

function renderTable() {
  if (dispRows.length === 0) {
    document.getElementById('resultArea').innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;font-size:14px">데이터가 없어요.</div>';
    return;
  }
  const hasFace = dispRows.some(x => x.face !== 'single');

  document.getElementById('resultArea').innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>NO</th><th>작업일</th><th>근무</th><th>설비</th><th>사번</th><th>품명</th>${hasFace ? '<th>면</th>' : ''}<th>구분</th>
        <th class="cond-std">기준</th><th class="cond-first">초품</th><th class="cond-middle">중품</th><th class="cond-last">종품</th>
        <th>작업자</th>
      </tr></thead>
      <tbody>
      ${dispRows.map((x, i) => {
        const faceTd = hasFace
          ? `<td>${x.face !== 'single' ? `<span class="face-tag" style="background:${FACE_COLORS[x.face]||'#f1f5f9'}">${FACE_LABELS[x.face]||x.face}</span>` : '-'}</td>`
          : '';
        const stageTd = x.stage === 'after'
          ? '<td><span class="tag-change">🔄 교체 후</span></td>'
          : `<td>교체 전${x.old ? '<span class="tag-old">구버전 단일기록</span>' : ''}</td>`;
        const c = x.cond || { standard:null, first:null, middle:null, last:null };
        return `<tr${x.stage==='after' ? ' style="background:#fffbf5"' : ''}>
          <td style="text-align:center">${i+1}</td>
          <td>${x.work_date}</td><td>${x.shift}</td>
          <td style="font-size:12px">${x.equip}</td>
          <td>${x.sabun}</td><td style="font-size:12px">${x.pname || '-'}</td>
          ${faceTd}${stageTd}
          ${condCellHtml(c.standard)}${condCellHtml(c.first)}${condCellHtml(c.middle)}${condCellHtml(c.last)}
          <td style="font-size:12px">${x.worker || '-'}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
    <div style="font-size:11px;color:#94a3b8;margin-top:8px">· 각 칸: <b>압력</b>kgf · 상판/하판℃ &nbsp;|&nbsp; "·" = 미입력 &nbsp;|&nbsp; 구버전 단일기록 = 조건 세분화 이전 방식으로 입력된 데이터(기준 열에 표시)</div>`;
}

function downloadExcel() {
  if (dispRows.length === 0) { showToast('다운로드할 데이터가 없어요.'); return; }
  const rows = dispRows.map((x, i) => {
    const c = x.cond || {};
    const row = {
      'NO': i+1, '작업일': x.work_date, '근무': x.shift, '설비': x.equip,
      '사번': x.sabun, '품명': x.pname, '면': FACE_LABELS[x.face] || x.face,
      '구분': x.stage === 'after' ? '금형 교체 후' : (x.old ? '교체 전(구버전 단일기록)' : '교체 전')
    };
    TYPES.forEach(([key, label]) => {
      const v = c[key] || { p:'', u:'', l:'' };
      row[label + ' 압력(kgf/cm²)'] = v.p;
      row[label + ' 상판온도(℃)'] = v.u;
      row[label + ' 하판온도(℃)'] = v.l;
    });
    row['작업자'] = x.worker;
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '성형조건');
  const s = document.getElementById('startDate').value, e = document.getElementById('endDate').value;
  XLSX.writeFile(wb, `성형조건_${s}_${e}.xlsx`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
<script src="sidebar.js"></script>
</body>
</html>
