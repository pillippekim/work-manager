<script>
var SU = 'https://vpaixxlhzkwtgcllimvn.supabase.co';
var SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwYWl4eGxoemt3dGdjbGxpbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNzk4NjMsImV4cCI6MjA5MTk1NTg2M30.V8Bj0cMbM0E2TFhklYYa7TM-vO6Fi70ctACA7uUf4Ig';
var db = window.supabase.createClient(SU, SK);
var myInfo = null;
var items = [], plans = [], stockMap = {}, moveMap = {}, PRODUCTS = {};
var activeMgr = '';   // '' = 전체 탭

// 담당자 태그 배열 (복수: 쉼표 구분 저장)
function getMgrs(it){
  return String(it.managers || '').split(',').map(function(x){ return x.trim(); }).filter(function(x){ return x; });
}

function fmt(n){ return (n||0).toLocaleString(); }
function fmtKst(iso, withTime) {
  if (!iso) return '-';
  var d = new Date(iso);
  var p = function(n){ return ('0' + n).slice(-2); };
  var s = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  return withTime ? s + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) : s;
}
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

// ── 기준정보(품명 자동) ──
async function loadProductsMap(){
  var from=0, chunk=1000;
  while(true){
    var r = await db.from('products').select('sabun, part_name').range(from, from+chunk-1);
    if (r.error || !r.data || !r.data.length) break;
    r.data.forEach(function(x){ if(x.part_name) PRODUCTS[String(x.sabun).trim()] = x.part_name; });
    if (r.data.length < chunk) break;
    from += chunk;
  }
}
function regAutoName(){
  var s = document.getElementById('regSabun').value.trim();
  if (PRODUCTS[s]) document.getElementById('regName').value = PRODUCTS[s];
}

// ── 데이터 로드 ──
async function loadAll(){
  var ir = await db.from('special_items').select('*').eq('active', true).order('sabun');
  items = ir.data || [];
  var pr = await db.from('special_item_plans').select('*').order('plan_date');
  plans = pr.data || [];
  await loadStock();
  await loadMoves();
  await loadTargetSums();
  render();
}

// 현재고: 적재대 슬롯 + 대차 LOT 합산
async function loadStock(){
  stockMap = {};
  var from=0, chunk=1000;
  while(true){
    var r = await db.from('inventory_rack_slots').select('product_code, quantity').gt('quantity', 0).range(from, from+chunk-1);
    if (r.error || !r.data || !r.data.length) break;
    r.data.forEach(function(s){
      var k = String(s.product_code||'').trim(); if(!k) return;
      if (!stockMap[k]) stockMap[k] = { rack:0, zone:0 };
      stockMap[k].rack += (s.quantity||0);
    });
    if (r.data.length < chunk) break;
    from += chunk;
  }
  var zr = await db.from('inventory_lots').select('product_code, quantity, status, location_type').eq('location_type','zone');
  (zr.data||[]).forEach(function(l){
    if ((l.status==='stocked'||l.status==='waiting') && (l.quantity||0)>0){
      var k = String(l.product_code||'').trim(); if(!k) return;
      if (!stockMap[k]) stockMap[k] = { rack:0, zone:0 };
      stockMap[k].zone += (l.quantity||0);
    }
  });
}

// 입출고 이력 (최근 30일, 대상 사번만)
async function loadMoves(){
  moveMap = {};
  if (!items.length) return;
  var sabuns = items.map(function(i){ return i.sabun; });
  var since = new Date(); since.setDate(since.getDate()-30); since.setHours(0,0,0,0);
  var r = await db.from('inventory_movements').select('product_code, movement_type, quantity, created_at, reason')
    .in('product_code', sabuns).gte('created_at', since.toISOString())
    .order('created_at', { ascending: false }).limit(3000);
  (r.data||[]).forEach(function(m){
    var k = String(m.product_code||'').trim();
    if (!moveMap[k]) moveMap[k] = [];
    moveMap[k].push(m);
  });
}

// ── 품목별 계산 ──
function calcItem(sabun){
  var st = stockMap[sabun] || { rack:0, zone:0 };
  var cur = st.rack + st.zone;
  var t0 = new Date(); t0.setHours(0,0,0,0);
  var tIn=0, tOut=0, daily={};
  (moveMap[sabun]||[]).forEach(function(m){
    var d = new Date(m.created_at);
    var q = m.quantity||0;
    if (d >= t0){
      if (m.movement_type==='inbound') tIn+=q;
      if (m.movement_type==='outbound') tOut+=q;
    }
    if (m.movement_type==='outbound'){
      var key = fmtKst(m.created_at);   // 한국시간 기준 일자
      daily[key] = (daily[key]||0) + q;
    }
  });
  return { cur:cur, rack:st.rack, zone:st.zone, tIn:tIn, tOut:tOut, prev:cur - tIn + tOut, daily:daily };
}

// ── 렌더 ──
function renderMgrTabs(){
  var tagCnt = {};
  items.forEach(function(it){ getMgrs(it).forEach(function(m){ tagCnt[m] = (tagCnt[m]||0)+1; }); });
  var tags = Object.keys(tagCnt).sort();
  var h = '<span class="mgr-tab' + (activeMgr==='' ? ' active' : '') + '" onclick="setMgr(\'\')">전체 (공유용)<span class="cnt">' + items.length + '</span></span>';
  tags.forEach(function(t){
    h += '<span class="mgr-tab' + (activeMgr===t ? ' active' : '') + '" onclick="setMgr(\'' + t + '\')">' + t + ' 담당<span class="cnt">' + tagCnt[t] + '</span></span>';
  });
  h += '<button class="btn-mini" style="background:#f0f2f7;color:#444;margin-left:auto" onclick="copyTabLink()">🔗 이 탭 링크 복사</button>';
  document.getElementById('mgrTabs').innerHTML = h;
}
function setMgr(m){ activeMgr = m; render(); }
function copyTabLink(){
  var url = location.origin + location.pathname + (activeMgr ? '?mgr=' + encodeURIComponent(activeMgr) : '');
  navigator.clipboard.writeText(url).then(function(){ showToast('링크 복사됨! 카톡 등에 붙여넣어 공유하세요 ✓'); });
}

function render(){
  renderMgrTabs();
  var view = activeMgr ? items.filter(function(it){ return getMgrs(it).indexOf(activeMgr) !== -1; }) : items;

  document.getElementById('sumItems').textContent = view.length + '개' + (activeMgr ? ' (' + activeMgr + ')' : '');
  var totOut=0, plan7=0;
  var lim = new Date(); lim.setDate(lim.getDate()+7);
  var viewSabuns = view.map(function(i){ return i.sabun; });
  view.forEach(function(it){ totOut += calcItem(it.sabun).tOut; });
  plans.forEach(function(p){
    if (!p.done && viewSabuns.indexOf(p.sabun) !== -1 && new Date(p.plan_date) <= lim) plan7++;
  });
  document.getElementById('sumTodayOut').textContent = fmt(totOut) + ' EA';
  document.getElementById('sumPlans').textContent = plan7 + '건';

  var h = '';
  if (!view.length) h = '<div class="empty-s">' + (activeMgr ? ('[' + activeMgr + '] 담당 품목이 없습니다.') : '등록된 특별관리 품목이 없습니다. 위에서 품목을 등록해주세요.') + '</div>';
  view.forEach(function(it){
    var c = calcItem(it.sabun);
    var myPlans = plans.filter(function(p){ return p.sabun === it.sabun && !p.done; });
    var dailyKeys = Object.keys(c.daily).sort().reverse().slice(0, 14);

    h += '<div class="item-card">';
    var mgrBadges = getMgrs(it).map(function(m){ return '<span class="mgr-badge">👤 ' + m + '</span>'; }).join('');
    h += '<div class="ic-head"><div><span class="ic-title">' + it.sabun + '</span>' + mgrBadges
      + '<span class="ic-sub">' + (it.product_name||'-') + (it.part_no ? ' · ' + it.part_no : '') + (it.customer ? ' · ' + it.customer : '') + (it.car_model ? ' · ' + it.car_model : '') + '</span></div>'
      + '<div style="display:flex;gap:6px;">'
      + '<button class="btn-mini" style="background:#f0f2f7;color:#444" onclick="editManagers(' + it.id + ')">👤 담당</button>'
      + '<button class="btn-mini" style="background:#dcfce7;color:#166534" onclick="copyStatus(\'' + it.sabun + '\')" id="copyBtn_' + it.sabun + '">📋 현황 복사</button>'
      + '<button class="btn-mini" style="background:#eef2ff;color:#243bb2" onclick="toggleHist(\'' + it.sabun + '\')">출하 이력</button>'
      + '<button class="btn-mini" style="background:#fef2f2;color:#b91c1c" onclick="removeItem(' + it.id + ',\'' + it.sabun + '\')">관리 해제</button>'
      + '</div></div>';

    h += '<div class="ic-stats">'
      + '<div class="ic-stat"><div class="l">전일재고</div><div class="n">' + fmt(c.prev) + '</div></div>'
      + '<div class="ic-stat"><div class="l">금일입고</div><div class="n n-in">+' + fmt(c.tIn) + '</div></div>'
      + '<div class="ic-stat"><div class="l">금일출고</div><div class="n n-out">-' + fmt(c.tOut) + '</div></div>'
      + '<div class="ic-stat cur"><div class="l">현재고</div><div class="n">' + fmt(c.cur) + '</div><div class="s">적재대 ' + fmt(c.rack) + ' · 대차 ' + fmt(c.zone) + '</div></div>'
      + '</div>';

    // 납품/발주 예정
    h += '<div class="ic-sec"><div class="ic-sec-title"><span>📅 납품·발주 예정 (' + myPlans.length + '건)</span>'

async function addItem(){
  var sab = document.getElementById('regSabun').value.trim();
  if (!sab) { showToast('사번을 입력해주세요'); return; }
  if (items.some(function(i){ return i.sabun === sab; })) { showToast('이미 등록된 품목이에요'); return; }
  var mgrsRaw = document.getElementById('regManagers').value.trim() || ((myInfo && myInfo.name) || '');
  var mgrs = mgrsRaw.split(',').map(function(x){ return x.trim(); }).filter(function(x){ return x; }).join(', ');
  var rec = {
    sabun: sab,
    product_name: document.getElementById('regName').value.trim() || null,
    part_no: document.getElementById('regPartNo').value.trim() || null,
    customer: document.getElementById('regCustomer').value.trim() || null,
    car_model: document.getElementById('regCar').value.trim() || null,
    managers: mgrs || null,
    active: true, created_by: (myInfo && myInfo.name) || null
  };
  var r = await db.from('special_items').insert(rec);
  if (r.error) { showToast('등록 실패: ' + r.error.message); return; }
  ['regSabun','regName','regPartNo','regCustomer','regCar','regManagers'].forEach(function(id){ document.getElementById(id).value=''; });
  showToast('품목 등록 완료 ✓');
  loadAll();
}
async function editManagers(id){

  var v = prompt('[' + it.sabun + '] 담당자를 입력하세요.\n복수 담당은 쉼표로 구분해요. (예: 김우현, 홍길동)', it.managers || '');

async function addPlan(sab){

  var q = parseInt(document.getElementById('pfQty_' + sab).value) || 0;
  if (!d || q <= 0) { showToast('예정일과 수량을 입력해주세요'); return; }

    sabun: sab, plan_date: d, quantity: q,

    note: document.getElementById('pfNote_' + sab).value.trim() || null,

  });
  if (r.error) { showToast('등록 실패: ' + r.error.message); return; }
  showToast('예정 등록 완료 ✓');
  loadAll();
}
async function donePlan(id){
  await db.from('special_item_plans').update({ done: true }).eq('id', id);
  showToast('완료 처리 ✓'); loadAll();
}
async function delPlan(id){

// ── 카톡 공유용 현황 복사 ──
function copyStatus(sab){
  var it = items.find(function(i){ return i.sabun === sab; });
  var c = calcItem(sab);
  var now = new Date();
  var wd = ['일','월','화','수','목','금','토'][now.getDay()];
  var txt = '● ' + sab + '번 ' + (it.product_name || '') + ' 현황\n'
    + '  (' + (now.getMonth()+1) + '. ' + now.getDate() + '. ' + wd + ') ' + ('0'+now.getHours()).slice(-2) + '시' + ('0'+now.getMinutes()).slice(-2) + '분 기준\n\n'
    + '- 전일재고 :  ' + fmt(c.prev) + '개\n'
    + '- 금일입고 :  ' + fmt(c.tIn) + '개\n'
    + '- 금일출고 :  ' + fmt(c.tOut) + '개\n'
    + '- 현재고  :  ' + fmt(c.cur) + '개 (적재대 ' + fmt(c.rack) + ' · 대차 ' + fmt(c.zone) + ')\n';
  var myPlans = plans.filter(function(p){ return p.sabun === sab && !p.done; });
  if (myPlans.length){
    txt += '\n* 예정:\n';
    myPlans.forEach(function(p){
      txt += '  - ' + p.plan_date.slice(5).replace('-','/') + ' ' + fmt(p.quantity) + '개 ' + (p.category||'') + (p.note ? ' (' + p.note + ')' : '') + '\n';
    });
  }
  navigator.clipboard.writeText(txt).then(function(){
    var b = document.getElementById('copyBtn_' + sab);
    b.textContent = '✓ 복사됨!'; b.classList.add('copy-ok');
    setTimeout(function(){ b.textContent = '📋 현황 복사'; b.classList.remove('copy-ok'); }, 1600);
  });
}

function showToast(msg){
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1a2340;color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.25);';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}

// ═══════ 목표(타임라인) 관리 ═══════
var targetCum = {};   // 사번 → 목표 시작일 이후 출하 누계

async function loadTargetSums(){
  targetCum = {};
  var tItems = items.filter(function(i){ return i.target_start; });
  if (!tItems.length) return;
  var minStart = tItems.map(function(i){ return i.target_start; }).sort()[0];
  var r = await db.from('inventory_movements').select('product_code, quantity, created_at')
    .eq('movement_type', 'outbound')
    .in('product_code', tItems.map(function(i){ return i.sabun; }))
    .gte('created_at', minStart + 'T00:00:00').limit(10000);
  (r.data || []).forEach(function(m){
    var k = String(m.product_code || '').trim();
    var it = tItems.find(function(i){ return i.sabun === k; });
    if (!it) return;
    if (fmtKst(m.created_at) >= it.target_start){
      targetCum[k] = (targetCum[k] || 0) + (m.quantity || 0);
    }
  });
}

async function editTarget(id){
  var it = items.find(function(i){ return i.id === id; });
  if (!it) return;
  var q = prompt('[' + it.sabun + '] 목표수량을 입력하세요 (예: 36000)\n비우고 확인 = 목표 해제', it.target_qty || '');
  if (q === null) return;
  var qty = parseInt(String(q).replace(/,/g, '')) || null;
  var st = it.target_start || todayStr();
  if (qty){
    var d = prompt('출하 누계 계산 시작일 (YYYY-MM-DD)\n예: 100일작전 시작일', st);
    if (d === null) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.trim())){ showToast('날짜 형식이 올바르지 않아요 (예: 2026-07-10)'); return; }
    st = d.trim();
  } else { st = null; }
  await db.from('special_items').update({ target_qty: qty, target_start: st }).eq('id', id);
  showToast(qty ? '목표 설정 완료 ✓ (' + fmt(qty) + ' · ' + st + '~)' : '목표 해제됨');
  loadAll();
}

// ═══════ 보기 모드 (목록 / 월간 스케줄) ═══════
var viewMode = 'list';
var expandedSet = {};
var curYM = todayStr().slice(0, 7);
var monthCache = {};   // 'YYYY-MM' → { 사번: {일: 출고합} }

function setView(m){ viewMode = m; render(); }

// ═══════ 필터 (사번 / 납품처 / 차종) — 담당자 탭과 AND 조건 ═══════
var fSabun = '', fCust = '', fCar = '';
var _fltSig = '';   // 드롭다운 재생성 최소화용 서명(열려있는 셀렉트가 닫히는 것 방지)
function splitVals(s){ return String(s || '').split(',').map(function(x){ return x.trim(); }).filter(function(x){ return x; }); }
function filterView(list){
  return list.filter(function(it){
    if (fSabun && String(it.sabun || '').indexOf(fSabun) === -1) return false;                 // 부분일치
    if (fCust && splitVals(it.customer).indexOf(fCust) === -1) return false;                   // 복수 납품처 중 하나라도 일치
    if (fCar && splitVals(it.car_model).indexOf(fCar) === -1) return false;
    return true;
  });
}
function getView(){   // 담당자 탭 필터 → 검색 필터 순서로 AND 적용 (목록/월간/엑셀 공용)
  var v = activeMgr ? items.filter(function(it){ return getMgrs(it).indexOf(activeMgr) !== -1; }) : items;
  return filterView(v);
}
function filterTag(){   // 요약 카드 꼬리표: (김우현·YMP·JG·사번:5023)
  var t = [];
  if (activeMgr) t.push(activeMgr);
  if (fCust) t.push(fCust);
  if (fCar) t.push(fCar);
  if (fSabun) t.push('사번:' + fSabun);
  return t.length ? ' (' + t.join('·') + ')' : '';
}
function buildFilterOptions(){
  var cs = {}, cars = {};
  items.forEach(function(it){
    splitVals(it.customer).forEach(function(v){ cs[v] = 1; });
    splitVals(it.car_model).forEach(function(v){ cars[v] = 1; });
  });
  var l1 = Object.keys(cs).sort(), l2 = Object.keys(cars).sort();
  var sig = l1.join('|') + '#' + l2.join('|');
  if (sig === _fltSig) return;   // 값 구성이 그대로면 재생성 생략
  _fltSig = sig;
  fillSelect('fltCust', l1, '납품처 전체', fCust);
  fillSelect('fltCar', l2, '차종 전체', fCar);
}
function fillSelect(id, vals, allLabel, cur){
  var el = document.getElementById(id); if (!el) return;
  if (cur && vals.indexOf(cur) === -1) vals = vals.concat([cur]);   // 선택 중인 값은 항상 유지
  el.innerHTML = '<option value="">' + allLabel + '</option>' + vals.map(function(v){
    return '<option value="' + String(v).replace(/"/g, '&quot;') + '"' + (v === cur ? ' selected' : '') + '>' + v + '</option>';
  }).join('');
}
function onFilterChange(){
  fSabun = document.getElementById('fltSabun').value.trim();
  fCust = document.getElementById('fltCust').value;
  fCar = document.getElementById('fltCar').value;
  document.getElementById('fltReset').style.display = (fSabun || fCust || fCar) ? '' : 'none';
  render();
}
function resetFilters(){
  fSabun = ''; fCust = ''; fCar = '';
  document.getElementById('fltSabun').value = '';
  document.getElementById('fltCust').value = '';
  document.getElementById('fltCar').value = '';
  document.getElementById('fltReset').style.display = 'none';
  render();
}
function shiftMonth(d){
  var pt = curYM.split('-'); var dt = new Date(parseInt(pt[0]), parseInt(pt[1]) - 1 + d, 1);
  curYM = dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2);
  delete monthCache[curYM];   // 이동 시 새로 조회
  render();
}
function toggleRow(sab){ expandedSet[sab] = !expandedSet[sab]; render(); }

async function ensureMonth(ym){
  if (monthCache[ym]) return;
  var map = {};
  if (items.length){
    var sabuns = items.map(function(i){ return i.sabun; });
    var pt = ym.split('-');
    var start = new Date(parseInt(pt[0]), parseInt(pt[1]) - 1, 1).toISOString();          // 한국시간 월초
    var end = new Date(parseInt(pt[0]), parseInt(pt[1]), 1).toISOString();                 // 다음달 0시(미포함)
    var r = await db.from('inventory_movements').select('product_code, movement_type, quantity, created_at')
      .in('product_code', sabuns).eq('movement_type', 'outbound')
      .gte('created_at', start).lt('created_at', end).limit(5000);
    (r.data || []).forEach(function(m){
      var k = String(m.product_code || '').trim();
      var day = new Date(m.created_at).getDate();   // 한국시간 기준 일
      if (!map[k]) map[k] = {};
      map[k][day] = (map[k][day] || 0) + (m.quantity || 0);
    });
  }
  monthCache[ym] = map;
}

// ── 신규 render (기존 정의를 대체) ──
function render(){
  renderMgrTabs();
  document.getElementById('vmList').classList.toggle('vm-on', viewMode === 'list');
  document.getElementById('vmMonth').classList.toggle('vm-on', viewMode === 'month');
  document.getElementById('monthNav').style.display = viewMode === 'month' ? 'inline-flex' : 'none';
  document.querySelector('.sp-wrap').classList.toggle('wide', viewMode === 'month');   // 월간은 전체 폭 사용

  buildFilterOptions();          // 납품처/차종 드롭다운 자동 수집
  var view = getView();          // 담당자 탭 + 사번/납품처/차종 필터 AND 적용

  document.getElementById('sumItems').textContent = view.length + '개' + filterTag();
  var totOut = 0, plan7 = 0;
  var lim = new Date(); lim.setDate(lim.getDate() + 7);
  var viewSabuns = view.map(function(i){ return i.sabun; });
  view.forEach(function(it){ totOut += calcItem(it.sabun).tOut; });
  plans.forEach(function(p){
    if (!p.done && viewSabuns.indexOf(p.sabun) !== -1 && new Date(p.plan_date) <= lim) plan7++;
  });
  document.getElementById('sumTodayOut').textContent = fmt(totOut) + ' EA';
  document.getElementById('sumPlans').textContent = plan7 + '건';

  if (viewMode === 'month') { renderMonth(view); return; }
  renderList(view);
}

// ── 목록 보기: 한 줄 요약 + 클릭 펼침 (품목 20~30개 대응) ──
function renderList(view){
  if (!view.length){
    document.getElementById('itemList').innerHTML = '<div class="empty-s">' + ((fSabun || fCust || fCar) ? '검색/필터 조건에 맞는 품목이 없습니다. 우측 상단 ↺ 초기화를 눌러보세요.' : (activeMgr ? '[' + activeMgr + '] 담당 품목이 없습니다.' : '등록된 특별관리 품목이 없습니다.')) + '</div>';
    return;
  }
  var h = '<table class="lst"><tr><th style="width:26px"></th><th>사번</th><th>품명</th><th>담당</th><th>전일재고</th><th>금일입고</th><th>금일출고</th><th>현재고</th><th>다음 예정</th><th style="width:200px">작업</th></tr>';
  view.forEach(function(it){
    var c = calcItem(it.sabun);
    var next = plans.filter(function(p){ return p.sabun === it.sabun && !p.done; })[0];
    var open = !!expandedSet[it.sabun];
    h += '<tr class="sumrow" onclick="toggleRow(\'' + it.sabun + '\')">'
      + '<td style="color:#999">' + (open ? '▾' : '▸') + '</td>'
      + '<td style="font-weight:800;color:#1a2340">' + it.sabun + '</td>'
      + '<td style="text-align:left">' + (it.product_name || '-') + '<span style="color:#aaa;font-size:11px"> ' + (it.customer || '') + '</span></td>'
      + '<td>' + getMgrs(it).map(function(m){ return '<span class="mgr-badge" style="margin-left:2px">' + m + '</span>'; }).join('') + '</td>'
      + '<td>' + fmt(c.prev) + '</td>'
      + '<td class="n-in">+' + fmt(c.tIn) + '</td>'
      + '<td class="n-out">-' + fmt(c.tOut) + '</td>'
      + '<td style="font-weight:800;color:#243bb2">' + fmt(c.cur) + '</td>'
      + '<td style="font-size:11.5px;color:#b45309">' + (next ? (next.plan_date.slice(5).replace('-', '/') + ' · ' + fmt(next.quantity)) : '-') + '</td>'
      + '<td onclick="event.stopPropagation()">'
      + '<button class="btn-mini" style="background:#dcfce7;color:#166534" id="copyBtn_' + it.sabun + '" onclick="copyStatus(\'' + it.sabun + '\')">📋 복사</button> '
      + '<button class="btn-mini" style="background:#f0f2f7;color:#444" onclick="editManagers(' + it.id + ')">👤</button> '
      + '<button class="btn-mini" style="background:#fff7e6;color:#b45309" onclick="editTarget(' + it.id + ')">🎯</button> '
      + '<button class="btn-mini" style="background:#fef2f2;color:#b91c1c" onclick="removeItem(' + it.id + ',\'' + it.sabun + '\')">해제</button>'
      + '</td></tr>';
    if (open){
      h += '<tr><td colspan="10" class="detail-cell">' + buildCardBody(it) + '</td></tr>';
    }
  });
  h += '</table>';
  document.getElementById('itemList').innerHTML = h;
}

// ── 월간 스케줄: 사번 × 일자 매트릭스 (실적=자동, 예상=수동) ──
function renderMonth(view){
  document.getElementById('curYmLabel').textContent = curYM.replace('-', '년 ') + '월';
  document.getElementById('itemList').innerHTML = '<div class="empty-s">월간 데이터 불러오는 중...</div>';
  ensureMonth(curYM).then(function(){
    var mm = monthCache[curYM] || {};
    var pt = curYM.split('-'); var lastDay = new Date(parseInt(pt[0]), parseInt(pt[1]), 0).getDate();
    var tStr = todayStr(); var isThisMonth = tStr.slice(0, 7) === curYM;
    var todayD = isThisMonth ? parseInt(tStr.slice(8, 10)) : -1;

    var h = '<div class="mon-wrap"><table class="mon"><tr><th style="min-width:130px;left:0;z-index:4;">사번 / 품명</th>'
      + '<th class="fxc fx2">목표</th><th class="fxc fx3">누계</th><th class="fxc fx4">잔여</th><th class="fxc fx5">달성</th><th class="fxc fx6">현재고<div style="font-size:9px;font-weight:500">(물류)</div></th>';
    for (var d = 1; d <= lastDay; d++){
      var wd = new Date(parseInt(pt[0]), parseInt(pt[1]) - 1, d).getDay();
      h += '<th class="' + (d === todayD ? 'today' : '') + '" style="' + (wd === 0 ? 'color:#dc2626;' : (wd === 6 ? 'color:#2563eb;' : '')) + '">' + d + '</th>';
    }
    h += '<th style="min-width:70px">실적합</th><th style="min-width:70px">예정합</th></tr>';

    view.forEach(function(it){
      var actual = mm[it.sabun] || {};
      var planByDay = {};
      plans.forEach(function(p){
        if (p.sabun === it.sabun && !p.done && p.plan_date.slice(0, 7) === curYM){
          var dd = parseInt(p.plan_date.slice(8, 10));
          planByDay[dd] = (planByDay[dd] || 0) + (p.quantity || 0);
        }
      });
      var sumA = 0, sumP = 0;
      var cinfo = calcItem(it.sabun);
      var tq = it.target_qty || 0;
      var cum = targetCum[it.sabun] || 0;
      var remain = tq - cum;
      var rate = tq > 0 ? Math.round(cum / tq * 100) : null;
      h += '<tr><td class="itc" onclick="editTarget(' + it.id + ')" title="클릭: 목표 설정" style="cursor:pointer">' + it.sabun
        + '<div style="font-size:10px;color:#888;font-weight:500">' + (it.product_name || '') + '</div>'
        + '<div style="font-size:9.5px;color:#aaa;font-weight:500">' + [(it.customer||''),(it.car_model||'')].filter(function(x){return x;}).join(' · ') + '</div></td>'
        + (tq > 0
          ? '<td class="fxc fx2" style="font-weight:700">' + fmt(tq) + '<div style="font-size:8.5px;color:#999">' + (it.target_start||'').slice(5).replace('-','/') + '~</div></td>'
            + '<td class="fxc fx3" style="font-weight:700">' + fmt(cum) + '</td>'
            + '<td class="fxc fx4 ' + (remain > 0 ? 'tg-lack' : 'tg-ok') + '">' + (remain > 0 ? fmt(remain) : (remain < 0 ? '+' + fmt(-remain) : '달성')) + '</td>'
            + '<td class="fxc fx5 ' + (rate >= 100 ? 'tg-ok' : '') + '" style="font-weight:700">' + rate + '%</td>'
          : '<td class="fxc fx2" style="color:#ccc;font-size:10px;cursor:pointer" onclick="editTarget(' + it.id + ')">🎯 목표<br>설정</td><td class="fxc fx3" style="color:#ddd">-</td><td class="fxc fx4" style="color:#ddd">-</td><td class="fxc fx5" style="color:#ddd">-</td>')
        + '<td class="fxc fx6" style="font-weight:700;color:#243bb2">' + fmt(cinfo.cur) + '</td>';
      for (var d = 1; d <= lastDay; d++){
        var a = actual[d] || 0, pq = planByDay[d] || 0;
        sumA += a; sumP += pq;
        var ds = curYM + '-' + ('0' + d).slice(-2);
        h += '<td class="day' + (d === todayD ? ' today' : '') + '" onclick="addPlanQuick(\'' + it.sabun + '\',\'' + ds + '\')" title="' + it.sabun + ' · ' + ds + ' (클릭: 예상출하 등록)">'
          + (a ? '<div class="mn-act">' + fmt(a) + '</div>' : '')
          + (pq ? '<div class="mn-plan">+' + fmt(pq) + '</div>' : '')
          + '</td>';
      }
      h += '<td class="mn-act" style="background:#fef2f2">' + fmt(sumA) + '</td><td class="mn-plan" style="background:#fff7e6">' + fmt(sumP) + '</td></tr>';
    });
    h += '</table></div>';
    if (!view.length) h = '<div class="empty-s">표시할 품목이 없습니다.</div>';
    document.getElementById('itemList').innerHTML = h;
    alignMonSticky();
    requestAnimationFrame(alignMonSticky); // 폰트/레이아웃 확정 후 한 번 더 보정
  });
}

// ── 월간 표 고정열 위치 자동 보정 ──
// 열 내용(긴 숫자·품명)에 따라 실제 폭이 CSS 가정치(64px 등)보다 커지면
// 하드코딩된 left가 어긋나 헤더가 깨지므로, 실제 폭을 측정해 left를 다시 계산한다.
function alignMonSticky(){
  var tbl = document.querySelector('table.mon');
  if (!tbl || !tbl.rows.length) return;
  var hr = tbl.rows[0];
  if (hr.cells.length < 6) return;
  var left = 0;
  for (var c = 0; c < 6; c++){ // 0=사번/품명, 1~5=목표·누계·잔여·달성·현재고
    var w = hr.cells[c].getBoundingClientRect().width; // 소수점 폭 그대로 사용(1px 틈 방지)
    for (var r = 0; r < tbl.rows.length; r++){
      var cell = tbl.rows[r].cells[c];
      if (cell) cell.style.left = left + 'px';
    }
    left += w;
  }
}
window.addEventListener('resize', function(){ alignMonSticky(); });

// 월간 타임라인 엑셀 다운로드
function exportMonthExcel(){
  var view = getView();   // 담당자 탭 + 필터 동일 적용
  var mm = monthCache[curYM] || {};
  var pt = curYM.split('-'); var lastDay = new Date(parseInt(pt[0]), parseInt(pt[1]), 0).getDate();
  var head = ['사번','품명','납품처','차종','담당','구분','목표수량','출하누계','필요잔여','현재고(물류)'];
  for (var d = 1; d <= lastDay; d++) head.push(d + '일');
  head.push('월 합계');
  var rows = [head];
  view.forEach(function(it){
    var actual = mm[it.sabun] || {};
    var planByDay = {};
    plans.forEach(function(p){
      if (p.sabun === it.sabun && !p.done && p.plan_date.slice(0, 7) === curYM){
        var dd = parseInt(p.plan_date.slice(8, 10));
        planByDay[dd] = (planByDay[dd] || 0) + (p.quantity || 0);
      }
    });
    var c = calcItem(it.sabun);
    var tq = it.target_qty || '';
    var cum = targetCum[it.sabun] || 0;
    var base = [it.sabun, it.product_name || '', it.customer || '', it.car_model || '', getMgrs(it).join(', ')];
    var rowA = base.concat(['실적(출하)', tq, tq !== '' ? cum : '', tq !== '' ? (tq - cum) : '', c.cur]);
    var rowP = base.concat(['예정(예상)', '', '', '', '']);
    var sa = 0, sp = 0;
    for (var d = 1; d <= lastDay; d++){
      var a = actual[d] || '', pq = planByDay[d] || '';
      rowA.push(a); rowP.push(pq);
      sa += (a || 0); sp += (pq || 0);
    }
    rowA.push(sa); rowP.push(sp);
    rows.push(rowA); rows.push(rowP);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:9},{wch:20},{wch:12},{wch:7},{wch:12},{wch:10},{wch:9},{wch:9},{wch:9},{wch:10}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, curYM + ' 타임라인');
  XLSX.writeFile(wb, '특별관리_타임라인_' + curYM + (activeMgr ? '_' + activeMgr : '') + '.xlsx');
}

// 매트릭스 칸 클릭 → 예상출하 바로 등록
async function addPlanQuick(sab, dateStr){
  var q = prompt('[' + sab + '] ' + dateStr + ' 예상 출하량을 입력하세요 (숫자만):');
  if (q === null) return;
  var qty = parseInt(String(q).replace(/,/g, '')) || 0;
  if (qty <= 0) { showToast('1 이상의 숫자를 입력해주세요'); return; }
  var cat = prompt('구분 입력 (예: YMP 납품 / 수출·곤산) — 생략하려면 그냥 확인:') || '';
  var r = await db.from('special_item_plans').insert({
    sabun: sab, plan_date: dateStr, quantity: qty, category: cat.trim() || null,
    note: null, done: false, created_by: (myInfo && myInfo.name) || null
  });
  if (r.error) { showToast('등록 실패: ' + r.error.message); return; }
  showToast(dateStr + ' 예상출하 ' + fmt(qty) + ' 등록 ✓');
  loadAll();
}

document.addEventListener('DOMContentLoaded', async function(){
  myInfo = await checkAuth();
  if (!myInfo) return;
  var qm = new URLSearchParams(location.search).get('mgr');
  if (qm) activeMgr = qm;   // 공유 링크의 꼬리표(?mgr=이름)로 탭 자동 선택
  if (myInfo.name) document.getElementById('regManagers').value = myInfo.name;   // 담당자 기본값 = 로그인 사용자
  loadProductsMap();
  loadAll();
});
