<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공정별 생산보고서 - HKHT</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="auth_guard.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Noto Sans KR',sans-serif; }
body { background:#eef0f4; color:#222; }

/* ── 공정 탭바 ── */
.proc-tabs { max-width:900px; margin:0 auto 12px; background:#fff; border:1px solid #e5e8f0; border-radius:12px; padding:10px 12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.pt-btn { padding:7px 13px; border:1px solid #dfe3ec; border-radius:20px; background:#fff; font-size:13px; font-weight:600; color:#555; cursor:pointer; }
.pt-btn:hover { background:#f0f2f7; }
.pt-btn.active { background:#243bb2; border-color:#243bb2; color:#fff; }
.pt-btn.na { color:#b6bcc9; cursor:pointer; }
.pt-sep { width:1px; height:20px; background:#d5dae5; margin:0 4px; }
.pt-grp { font-size:10.5px; color:#98a0b0; font-weight:700; letter-spacing:1px; margin-right:2px; }

/* ── 기간/옵션 컨트롤 (인쇄 시 숨김) ── */
.rp-controls { background:#fff; border:1px solid #e5e8f0; border-radius:12px; padding:14px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; max-width:900px; margin:0 auto 16px; }
.rp-controls label { font-size:13px; color:#555; font-weight:600; }
.rp-controls input[type=date] { padding:7px 10px; border:1px solid #dfe3ec; border-radius:7px; font-size:13px; }
.btn { padding:8px 14px; border:none; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; }
.btn-quick { background:#f0f2f7; color:#444; }
.btn-load { background:#243bb2; color:#fff; }
.btn-print { background:#16a34a; color:#fff; }
.btn-xlsx { background:#0f766e; color:#fff; }
.btn-ghost { background:#fff; color:#555; border:1px solid #dfe3ec; }
.chk-line { display:flex; align-items:center; gap:5px; font-size:13px; color:#555; font-weight:600; cursor:pointer; user-select:none; }

/* ── 리포트 용지 ── */
.paper { max-width:900px; margin:0 auto; background:#fff; padding:36px 40px; box-shadow:0 2px 14px rgba(0,0,0,.08); border-radius:12px; position:relative; }
.rp-head { text-align:center; border-bottom:3px solid #1a2340; padding-bottom:14px; margin-bottom:6px; }
.rp-head h1 { font-size:23px; letter-spacing:5px; color:#1a2340; }
.rp-meta { display:flex; justify-content:space-between; font-size:12px; color:#555; margin:8px 0 18px; flex-wrap:wrap; gap:4px; }

/* ── 결재란: 컴팩트 · 우측상단 고정(absolute → 본문 밀지 않음) ── */
.sign-box { position:absolute; top:12px; right:16px; }
.sign-box table { border-collapse:collapse; }
.sign-box th, .sign-box td { border:1px solid #999; font-size:10px; text-align:center; }
.sign-box th { background:#f3f4f8; padding:2px 0; width:46px; font-weight:600; }
.sign-box td { height:28px; }
body.no-sign .sign-box { display:none; }

/* 요약 카드 */
.sum-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:16px; }
.sum-card { border:1px solid #dfe3ec; border-radius:6px; padding:7px 2px; text-align:center; }
.sum-card .n { font-size:15px; font-weight:800; }
.sum-card .l { font-size:9.5px; color:#777; margin-top:1px; letter-spacing:-0.3px; }

h2.sec { font-size:14px; color:#1a2340; border-left:4px solid #1a2340; padding-left:8px; margin:22px 0 8px; }
table.rp { width:100%; border-collapse:collapse; font-size:12px; }
table.rp th, table.rp td { border:1px solid #c9cfdb; padding:5px 7px; text-align:center; }
table.rp th { background:#f0f2f7; font-weight:700; }
table.rp td.left { text-align:left; }
table.rp td.right { text-align:right; }
tr.grp-row { cursor:pointer; }
tr.grp-row:hover td { background:#f7f8fc; }
tr.det-row { display:none; }
tr.det-row.open { display:table-row; }
tr.det-row > td { background:#fafbfe; padding:8px; }
table.det { width:100%; border-collapse:collapse; font-size:11px; }
table.det th, table.det td { border:1px solid #dde2ec; padding:3px 6px; text-align:center; }
table.det th { background:#eef1f8; font-weight:600; }
table.det td.left { text-align:left; }
.arrow { font-size:10px; color:#98a0b0; }
.empty-msg { color:#999; font-size:12px; padding:14px; text-align:center; border:1px dashed #d5dae5; border-radius:6px; }
.lot-warn { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; font-size:12px; font-weight:700; border-radius:6px; padding:7px 12px; margin:-6px 0 14px; }
.foot-note { font-size:11px; color:#888; margin-top:24px; border-top:1px solid #e5e8f0; padding-top:8px; }
.na-msg { text-align:center; padding:60px 10px; color:#98a0b0; font-size:14px; }

@media print {
  body { background:#fff; }
  .top-header, .sidebar, .page-header, .rp-controls, .proc-tabs, .no-print { display:none !important; }
  .main { margin:0 !important; padding:0 !important; }
  .paper { box-shadow:none; margin:0; max-width:100%; padding:10mm 12mm; border-radius:0; }
  .sign-box { top:6mm; right:8mm; }
  h2.sec { page-break-after:avoid; }
  table.rp { page-break-inside:auto; }
  tr { page-break-inside:avoid; }
}
</style>
</head>
<body>

<div id="top-header" class="top-header"></div>
<nav id="sidebar-nav" class="sidebar"></nav>

<div class="main">
  <div class="page-header">
    <h1 class="page-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      공정별 생산보고서
      <span class="header-actions">
        <button class="btn btn-xlsx" onclick="downloadXlsx()">⬇ 엑셀</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
      </span>
    </h1>
    <p class="page-desc">작업일지 데이터를 공정별·기간별로 자동 집계한 생산 리포트</p>
  </div>

  <div style="padding:20px 20px 40px;">

    <div class="proc-tabs" id="procTabs"></div>

    <div class="rp-controls">
      <label>기간</label>
      <input type="date" id="sDate"> <span style="color:#aaa">~</span> <input type="date" id="eDate">
      <button class="btn btn-quick" onclick="quick('today')">당일</button>
      <button class="btn btn-quick" onclick="quick('yesterday')">전일</button>
      <button class="btn btn-quick" onclick="quick('month')">당월</button>
      <button class="btn btn-quick" onclick="quick('lastMonth')">전월</button>
      <button class="btn btn-load" onclick="loadReport(true)">🔍 조회</button>
      <span style="flex:1"></span>
      <label class="chk-line"><input type="checkbox" id="chkSign" checked onchange="toggleSign()"> 결재란</label>
      <button class="btn btn-ghost" id="btnExpand" onclick="toggleAllDetails()">전체 펼치기</button>
    </div>

    <div class="paper" id="paper">
      <div class="sign-box">
        <table>
          <tr><th>작성</th><th>검토</th><th>승인</th></tr>
          <tr><td></td><td></td><td></td></tr>
        </table>
      </div>
      <div class="rp-head"><h1 id="rpTitle">생산보고서</h1></div>
      <div class="rp-meta">
        <div>기간: <b id="mPeriod">-</b></div>
        <div>출력일: <b id="mPrinted">-</b> · 출력자: <b id="mUser">-</b></div>
      </div>
      <div id="rpBody"><div class="empty-msg">기간을 선택하고 조회해주세요.</div></div>
      <div class="foot-note" id="rpFoot">
        ※ 본 리포트는 현장 작업일지 Raw Data를 기간 기준으로 자동 집계한 자료입니다. 삭제 처리된 작업일지는 집계에서 제외됩니다.
      </div>
    </div>

  </div>
</div>

<script>
var SU = 'https://vpaixxlhzkwtgcllimvn.supabase.co';
var SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwYWl4eGxoemt3dGdjbGxpbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNzk4NjMsImV4cCI6MjA5MTk1NTg2M30.V8Bj0cMbM0E2TFhklYYa7TM-vO6Fi70ctACA7uUf4Ig';
var db = window.supabase.createClient(SU, SK);
var myInfo = null;

/* ── 공정 탭 정의 (공정 흐름 순서 / impl=true 만 구현됨) ── */
var PROCS = [
  /* 전공정 3종은 MES 업로드 원자료(mes_*_raw) 기준 — mes:true → fetchMesRows 사용. 재단은 현장일지(cutting_reports) 보조 보기 지원 */
  { k:'weighing',  label:'평량',   grp:'전공정(MES)', table:'mes_weighing_raw', impl:true, mes:true },
  { k:'mixing',    label:'혼련',   grp:'전공정(MES)', table:'mes_mixing_raw',   impl:true, mes:true },
  { k:'cutting',   label:'재단',   grp:'전공정(MES)', table:'mes_cutting_raw',  impl:true, mes:true, alt:'cutting_reports' },
  { k:'molding',   label:'성형',   grp:'성형',   table:'molding_reports',   impl:true  },
  { k:'postcure',  label:'2차가류', grp:'후공정', table:'postcure_reports',  impl:true  },
  { k:'shot',      label:'쇼트',   grp:'후공정', table:'shot_reports',      impl:true  },
  { k:'sasang',    label:'사상',   grp:'후공정', table:'sasang_reports',    impl:true  },
  { k:'coating',   label:'도포',   grp:'후공정', table:'coating_reports',   impl:true  },
  { k:'assembly',  label:'조립',   grp:'후공정', table:'assembly_reports',  impl:true  },
  { k:'inspection',label:'검사',   grp:'후공정', table:'inspection_reports',impl:true  },
  { k:'packaging', label:'포장',   grp:'후공정', table:'packaging_reports', impl:true  }
];
var curProc = 'packaging';
var dataCache = {};   /* key: proc|sdate|edate → rows */
var PRODUCTS = null;  /* 사번 → {partNo, partName} */
var lastXlsx = null;  /* 현재 화면 기준 엑셀 시트 데이터 */

/* ── 유틸 ── */
function fmtLocal(d){ var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2); return y+'-'+m+'-'+dd; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(n){ return (n||0).toLocaleString('ko-KR'); }
function procOf(k){ for (var i=0;i<PROCS.length;i++){ if (PROCS[i].k===k) return PROCS[i]; } return null; }
/* LOT 미입력 판정: 배열형(lot_nos)·단일형(lot_no) 모두 대응 */
function lotMissingArr(arr){ return !(arr||[]).some(function(l){ return l && String(l).trim(); }); }
function lotMissingOne(v){ return !(v && String(v).trim()); }
/* 경고 스트립 + 미입력 내역 섹션 HTML (cols: [{h:헤더,w:너비px(선택)}], rowsHtml: tr 문자열) */
function lotWarnStrip(n){
  return n > 0 ? '<div class="lot-warn">⚠ LOT 미입력 '+num(n)+'건 — 하단 [LOT 미입력 내역]에서 확인 후 보완 요청 바랍니다</div>' : '';
}
function lotMissSection(cols, rowsHtml){
  var h = '<h2 class="sec" style="border-left-color:#dc2626;color:#b91c1c">⚠ LOT 미입력 내역</h2>';
  h += '<table class="rp"><tr>' + cols.map(function(c){ return '<th'+(c.w?' style="width:'+c.w+'px"':'')+'>'+c.h+'</th>'; }).join('') + '</tr>' + rowsHtml + '</table>';
  return h;
}

/* ── 탭바 렌더 ── */
function renderTabs(){
  var h='', prevGrp=null;
  PROCS.forEach(function(p){
    if (prevGrp!==null && p.grp!==prevGrp) h += '<span class="pt-sep"></span>';
    if (p.grp!==prevGrp) h += '<span class="pt-grp">'+p.grp+'</span>';
    prevGrp = p.grp;
    var cls = 'pt-btn' + (p.k===curProc?' active':'') + (p.impl?'':' na');
    h += '<button class="'+cls+'" onclick="setProc(\''+p.k+'\')">'+p.label+'</button>';
  });
  document.getElementById('procTabs').innerHTML = h;
}

function setProc(k){
  curProc = k;
  try { history.replaceState(null,'', location.pathname + '?proc=' + k); } catch(e){}
  renderTabs();
  loadReport(false);
}

/* ── 기간 ── */
function quick(t){
  var now = new Date();
  var s=document.getElementById('sDate'), e=document.getElementById('eDate');
  if (t==='today'){ s.value=fmtLocal(now); e.value=fmtLocal(now); }
  if (t==='yesterday'){ var y=new Date(now); y.setDate(y.getDate()-1); s.value=fmtLocal(y); e.value=fmtLocal(y); }
  if (t==='month'){ s.value=fmtLocal(new Date(now.getFullYear(),now.getMonth(),1)); e.value=fmtLocal(now); }
  if (t==='lastMonth'){ s.value=fmtLocal(new Date(now.getFullYear(),now.getMonth()-1,1)); e.value=fmtLocal(new Date(now.getFullYear(),now.getMonth(),0)); }
  loadReport(true);
}

/* ── 데이터 조회 (1,000행 제한 대응 페이지네이션 / 삭제건 제외) ── */
async function fetchAllRows(table, s, e){
  var all=[], from=0, step=1000;
  while (true){
    var res = await db.from(table).select('*')
      .is('deleted_at', null)
      .gte('work_date', s).lte('work_date', e)
      .order('work_date', {ascending:true})
      .order('created_at', {ascending:true})
      .range(from, from+step-1);
    if (res.error) throw res.error;
    all = all.concat(res.data||[]);
    if (!res.data || res.data.length < step) break;
    from += step;
  }
  return all;
}

async function loadProducts(){
  if (PRODUCTS) return PRODUCTS;
  PRODUCTS = {};
  var from=0, step=1000;
  while (true){
    var res = await db.from('products').select('sabun, part_no, part_name').range(from, from+step-1);
    if (res.error) break;
    (res.data||[]).forEach(function(r){ PRODUCTS[r.sabun] = { partNo:r.part_no||'', partName:r.part_name||'' }; });
    if (!res.data || res.data.length < step) break;
    from += step;
  }
  return PRODUCTS;
}

/* ── 메인 로드 ── */
async function loadReport(force){
  var s = document.getElementById('sDate').value, e = document.getElementById('eDate').value;
  if (!s || !e) return;
  if (s > e){ var t=s; s=e; e=t; document.getElementById('sDate').value=s; document.getElementById('eDate').value=e; }
  var p = procOf(curProc);
  document.getElementById('rpTitle').textContent = p.label + ' 생산 REPORT';
  document.getElementById('mPeriod').textContent = s + ' ~ ' + e;
  document.getElementById('mPrinted').textContent = fmtLocal(new Date());
  document.getElementById('mUser').textContent = (myInfo && myInfo.name) || '-';
  var body = document.getElementById('rpBody');
  lastXlsx = null;
  resetExpandBtn();

  if (!p.impl){
    body.innerHTML = '<div class="na-msg">'+ esc(p.na || p.label + ' 보고서는 준비 중입니다.') +'</div>';
    return;
  }

  var useAlt = (curProc === 'cutting' && cutSrc === 'field');
  var key = curProc + (useAlt ? '@field' : '') + '|' + s + '|' + e;
  var rows;
  if (!force && dataCache[key]){
    rows = dataCache[key];
  } else {
    body.innerHTML = '<div class="empty-msg">데이터를 불러오는 중...</div>';
    try {
      rows = useAlt ? await fetchAllRows(p.alt, s, e) : (p.mes ? await fetchMesRows(p.table, s, e) : await fetchAllRows(p.table, s, e));
      dataCache[key] = rows;
    } catch(err){
      body.innerHTML = '<div class="empty-msg">조회 실패: '+ esc(err.message||err) +'</div>';
      return;
    }
  }
  if (curProc === 'packaging') await renderPackaging(rows);
  else if (curProc === 'assembly') await renderAssembly(rows);
  else if (curProc === 'inspection') await renderInspection(rows);
  else if (curProc === 'coating') await renderCoating(rows);
  else if (curProc === 'sasang') await renderSasang(rows);
  else if (curProc === 'postcure') await renderPostcure(rows);
  else if (curProc === 'shot') await renderShot(rows);
  else if (curProc === 'cutting') await (useAlt ? renderCutting(rows) : renderMesCutting(rows));
  else if (curProc === 'mixing') await renderMesMixing(rows);
  else if (curProc === 'weighing') await renderMesWeighing(rows);
  else if (curProc === 'molding') await renderMolding(rows);
}

/* ════════════════════ 포장 (packaging) ════════════════════ */
async function renderPackaging(rows){
  var body = document.getElementById('rpBody');
  if (!rows.length){ body.innerHTML = '<div class="empty-msg">해당 기간에 제출된 포장 작업일지가 없습니다.</div>'; return; }
  await loadProducts();

  /* 집계: 사번(품목)별 */
  var bySabun = {}, byWorker = {}, lotSet = {}, totalQty = 0;
  rows.forEach(function(r){
    var sb = r.worker_id || '(사번미입력)';
    if (!bySabun[sb]) bySabun[sb] = { qty:0, cnt:0, lots:{}, workers:{}, rows:[] };
    var g = bySabun[sb];
    g.qty += (r.quantity||0); g.cnt++; g.rows.push(r);
    if (r.worker_name) g.workers[r.worker_name] = 1;
    (r.lot_nos||[]).forEach(function(l){ if(l){ g.lots[l]=1; lotSet[l]=1; } });
    var w = r.worker_name || '(미지정)';
    if (!byWorker[w]) byWorker[w] = { qty:0, cnt:0 };
    byWorker[w].qty += (r.quantity||0); byWorker[w].cnt++;
    totalQty += (r.quantity||0);
  });
  var sabuns = Object.keys(bySabun).sort(function(a,b){ return bySabun[b].qty - bySabun[a].qty; });
  var workers = Object.keys(byWorker).sort(function(a,b){ return byWorker[b].qty - byWorker[a].qty; });
  var lotMiss = rows.filter(function(r){ return lotMissingArr(r.lot_nos); });

  var h = '';
  /* 요약 카드 */
  h += '<div class="sum-grid">'
    + '<div class="sum-card"><div class="n">'+num(totalQty)+'</div><div class="l">총 포장수량</div></div>'
    + '<div class="sum-card"><div class="n">'+num(sabuns.length)+'</div><div class="l">품목(사번) 수</div></div>'
    + '<div class="sum-card"><div class="n">'+num(Object.keys(lotSet).length)+'</div><div class="l">LOT 수</div></div>'
    + '<div class="sum-card"><div class="n">'+num(rows.length)+'</div><div class="l">작업 건수</div></div>'
    + '<div class="sum-card"><div class="n">'+num(workers.length)+'</div><div class="l">투입 작업자</div></div>'
    + '</div>';
  h += lotWarnStrip(lotMiss.length);

  /* 1. 품목별 포장 실적 (클릭 → LOT 상세) */
  h += '<h2 class="sec">1. 품목(사번)별 포장 실적 <span style="font-weight:400;font-size:11px;color:#98a0b0">— 행 클릭 시 LOT 상세</span></h2>';
  h += '<table class="rp"><tr><th style="width:78px">사번</th><th style="width:118px">품번</th><th>품명</th><th style="width:110px">작업자</th><th style="width:85px">포장수량</th><th style="width:58px">LOT 수</th><th style="width:50px">건수</th><th style="width:26px"></th></tr>';
  sabuns.forEach(function(sb, i){
    var g = bySabun[sb];
    var prod = PRODUCTS[sb] || { partNo:'-', partName:'-' };
    var wNames = Object.keys(g.workers).join(', ') || '-';
    h += '<tr class="grp-row" onclick="toggleDet(\'pk'+i+'\')">'
      + '<td>'+esc(sb)+'</td><td>'+esc(prod.partNo||'-')+'</td><td class="left">'+esc(prod.partName||'-')+'</td>'
      + '<td style="font-size:11px">'+esc(wNames)+'</td>'
      + '<td class="right" style="font-weight:700">'+num(g.qty)+'</td>'

/* ════════════════════ 쇼트 (shot) ════════════════════ */
/* 주의: worker_id 컬럼 = 사번(제품코드). shot_type: freeze=냉동쇼트 / auto=자동사상.
   조건 필드가 방식별로 다름 — 냉동: temperature/duration_min/ball_size, 자동: grinding_time_sec/rotation_time_sec */
function shotTypeLabel(t){
  if (t === 'freeze') return '냉동쇼트';
  if (t === 'auto') return '자동사상';
  return t || '(방식미지정)';
}
function shotCondOf(r){
  var parts = [];
  if (r.shot_type === 'freeze'){
    if (r.temperature != null) parts.push(r.temperature + '℃');
    if (r.duration_min != null) parts.push(r.duration_min + '분');
    if (r.ball_size && String(r.ball_size).trim()) parts.push('볼(' + r.ball_size + ')');
  } else if (r.shot_type === 'auto'){
    if (r.grinding_time_sec != null) parts.push('연마' + r.grinding_time_sec + '초');
    if (r.rotation_time_sec != null) parts.push('회전' + r.rotation_time_sec + '초');
  }
  return parts.length ? parts.join(' · ') : '-';
}
async function renderShot(rows){
  var body = document.getElementById('rpBody');
  if (!rows.length){ body.innerHTML = '<div class="empty-msg">해당 기간에 제출된 쇼트 작업일지가 없습니다.</div>'; return; }
  await loadProducts();

  /* 집계: 품목별 / 방식별 / 설비별 */
  var bySabun = {}, byType = {}, byEquip = {}, totalQty = 0;
  rows.forEach(function(r){
    var q = r.work_qty || 0;
    totalQty += q;
    var sb = r.worker_id || '(사번미입력)';
    if (!bySabun[sb]) bySabun[sb] = { qty:0, cnt:0, workers:{}, types:{}, rows:[] };
    var g = bySabun[sb];
    g.qty += q; g.cnt++; g.rows.push(r);
    if (r.worker_name) g.workers[r.worker_name] = 1;
    g.types[shotTypeLabel(r.shot_type)] = 1;
    var tp = shotTypeLabel(r.shot_type);
    if (!byType[tp]) byType[tp] = { qty:0, cnt:0, sabuns:{} };
    byType[tp].qty += q; byType[tp].cnt++; byType[tp].sabuns[sb] = 1;
    var eq = (r.equipment || '').trim() || '(설비미지정)';
    if (!byEquip[eq]) byEquip[eq] = { qty:0, cnt:0, sabuns:{}, workers:{} };
    byEquip[eq].qty += q; byEquip[eq].cnt++; byEquip[eq].sabuns[sb] = 1;
    if (r.worker_name) byEquip[eq].workers[r.worker_name] = 1;
  });
  // 품목별 정렬: 방식 묶음(자동사상 → 냉동쇼트 → 혼합 → 미지정) → 묶음 내 수량 내림차순
  function shotGroupRank(g){
    var keys = Object.keys(g.types);
    if (keys.length === 1){
      if (keys[0] === '자동사상') return 0;
      if (keys[0] === '냉동쇼트') return 1;
      return 3;  // (방식미지정) 등
    }
    return 2;  // 두 방식 혼합 품목
  }
  var sabuns = Object.keys(bySabun).sort(function(a,b){
    var ra = shotGroupRank(bySabun[a]), rb = shotGroupRank(bySabun[b]);
    if (ra !== rb) return ra - rb;
    return bySabun[b].qty - bySabun[a].qty;
  });
  var types = Object.keys(byType).sort(function(a,b){ return byType[b].qty - byType[a].qty; });
  var equips = Object.keys(byEquip).sort(function(a,b){ return byEquip[b].qty - byEquip[a].qty; });
  var lotMiss = rows.filter(function(r){ return lotMissingOne(r.lot_no); });
  var frQty = (byType['냉동쇼트']||{}).qty || 0;
  var auQty = (byType['자동사상']||{}).qty || 0;

  var h = '';
  /* 요약 카드 */

    + '<div class="sum-card"><div class="n">'+num(totalQty)+'</div><div class="l">총 작업수량</div></div>'
    + '<div class="sum-card"><div class="n" style="color:#2563eb">'+num(frQty)+'</div><div class="l">❄ 냉동쇼트</div></div>'
    + '<div class="sum-card"><div class="n" style="color:#7c3aed">'+num(auQty)+'</div><div class="l">⚙ 자동사상</div></div>'
    + '<div class="sum-card"><div class="n">'+num(sabuns.length)+'</div><div class="l">품목(사번) 수</div></div>'
    + '<div class="sum-card"><div class="n">'+num(equips.length)+'</div><div class="l">가동 설비</div></div>'
    + '</div>';
  h += lotWarnStrip(lotMiss.length);

function rangeStr(min, max, unit){
  if (min == null) return '-';
  return (min === max ? min : min + '~' + max) + (unit || '');
}

    var g = bySabun[sb];
    g.qty += q; g.cnt++; g.rows.push(r);

    var du = (r.duration_min == null) ? null : Number(r.duration_min);

/* ════════════════════ 사상 (sasang) ════════════════════ */
/* 설비 미입력 시 방법(work_method)으로 추론 — 수사상=수작업, 자동사상=LM 사상기(1대뿐) */
function sasangEquipOf(r){
  if (r.equipment_no && String(r.equipment_no).trim()) return r.equipment_no;
  if (r.work_method === '수사상') return '수작업(수사상)';
  if (r.work_method === '자동사상') return 'LM 사상기';
  return '';
}
async function renderSasang(rows){
  var body = document.getElementById('rpBody');
  if (!rows.length){ body.innerHTML = '<div class="empty-msg">해당 기간에 제출된 사상 작업일지가 없습니다.</div>'; return; }
  await loadProducts();

  /* 집계: 품목별 / 설비별 / 작업자별 */
  var bySabun = {}, byEquip = {}, byWorker = {}, totalQty = 0, totalDef = 0;
  rows.forEach(function(r){
    var q = r.production_qty || 0, d = r.defect_qty || 0;
    totalQty += q; totalDef += d;
    var sb = r.sabun || '(사번미입력)';
    if (!bySabun[sb]) bySabun[sb] = { qty:0, def:0, cnt:0, workers:{}, methods:{}, pname:'', rows:[] };
    var g = bySabun[sb];
    g.qty += q; g.def += d; g.cnt++; g.rows.push(r);
    if (r.worker_name) g.workers[r.worker_name] = 1;
    if (r.work_method) g.methods[r.work_method] = 1;
    if (!g.pname && r.product_name) g.pname = r.product_name;
    var eq = sasangEquipOf(r) || '(설비미지정)';
    if (!byEquip[eq]) byEquip[eq] = { qty:0, def:0, cnt:0, sabuns:{}, workers:{} };
    byEquip[eq].qty += q; byEquip[eq].def += d; byEquip[eq].cnt++;
    byEquip[eq].sabuns[sb] = 1;
    if (r.worker_name) byEquip[eq].workers[r.worker_name] = 1;
    var w = r.worker_name || '(작업자미지정)';
    if (!byWorker[w]) byWorker[w] = { qty:0, def:0, cnt:0, sabuns:{} };
    byWorker[w].qty += q; byWorker[w].def += d; byWorker[w].cnt++;
    byWorker[w].sabuns[sb] = 1;
  });
  var sabuns = Object.keys(bySabun).sort(function(a,b){ return bySabun[b].qty - bySabun[a].qty; });
  var equips = Object.keys(byEquip).sort(function(a,b){ return byEquip[b].qty - byEquip[a].qty; });
  var workers = Object.keys(byWorker).sort(function(a,b){ return byWorker[b].qty - byWorker[a].qty; });
  var lotMiss = rows.filter(function(r){ return lotMissingOne(r.lot_no); });
  var defRate = totalQty > 0 ? (totalDef / totalQty * 100) : 0;

  var h = '';
  /* 요약 카드 */
  h += '<div class="sum-grid">'
    + '<div class="sum-card"><div class="n">'+num(totalQty)+'</div><div class="l">총 생산수량</div></div>'
    + '<div class="sum-card"><div class="n" style="color:'+(totalDef>0?'#dc2626':'#222')+'">'+num(totalDef)+'</div><div class="l">불량</div></div>'
    + '<div class="sum-card"><div class="n" style="color:'+(totalDef>0?'#dc2626':'#222')+'">'+ (Math.round(defRate*100)/100) +'%</div><div class="l">불량률</div></div>'
    + '<div class="sum-card"><div class="n">'+num(sabuns.length)+'</div><div class="l">품목(사번) 수</div></div>'
    + '<div class="sum-card"><div class="n">'+num(equips.length)+'</div><div class="l">가동 설비</div></div>'
    + '</div>';
  h += lotWarnStrip(lotMiss.length);

  /* 1. 품목별 사상 실적 */
  h += '<h2 class="sec">1. 품목(사번)별 사상 실적 <span style="font-weight:400;font-size:11px;color:#98a0b0">— 행 클릭 시 상세</span></h2>';
  h += '<table class="rp"><tr><th style="width:74px">사번</th><th style="width:110px">품번</th><th>품명</th><th style="width:100px">작업자</th><th style="width:78px">방법</th><th style="width:80px">생산수량</th><th style="width:54px">불량</th><th style="width:46px">건수</th><th style="width:26px"></th></tr>';
  sabuns.forEach(function(sb, i){
    var g = bySabun[sb];
    var prod = PRODUCTS[sb] || { partNo:'-', partName:'' };
    var pname = g.pname || prod.partName || '-';
    var wNames = Object.keys(g.workers).join(', ') || '-';
    var mNames = Object.keys(g.methods).join('·') || '-';
    h += '<tr class="grp-row" onclick="toggleDet(\'ss'+i+'\')">'
      + '<td>'+esc(sb)+'</td><td>'+esc(prod.partNo||'-')+'</td><td class="left">'+esc(pname)+'</td>'
      + '<td style="font-size:11px">'+esc(wNames)+'</td>'
      + '<td style="font-size:11px">'+esc(mNames)+'</td>'
      + '<td class="right" style="font-weight:700">'+num(g.qty)+'</td>'
      + '<td style="color:'+(g.def>0?'#dc2626':'#999')+'">'+num(g.def)+'</td>'
      + '<td>'+num(g.cnt)+'</td>'
      + '<td class="arrow" id="ar-ss'+i+'">▼</td></tr>';
    h += '<tr class="det-row" id="det-ss'+i+'"><td colspan="9">'
      + '<table class="det"><tr><th style="width:80px">일자</th><th style="width:110px">설비</th><th>LOT</th><th style="width:100px">시간</th><th>비고</th></tr>';
    g.rows.forEach(function(r){
      var tm = (r.start_time && r.end_time) ? (String(r.start_time).slice(0,5)+'~'+String(r.end_time).slice(0,5)) : '-';
      h += '<tr><td>'+esc(r.work_date)+'</td><td>'+esc(sasangEquipOf(r)||'-')+'</td>'
        + '<td class="left">'+esc(r.lot_no||'-')+'</td><td>'+tm+'</td>'
        + '<td class="left">'+esc(r.note||'')+'</td></tr>';
    });
    h += '</table></td></tr>';
  });
  h += '</table>';

  /* 2. 설비별 실적 (수작업 vs LM 사상기) */
  h += '<h2 class="sec">2. 설비(방식)별 사상 실적</h2>';
  h += '<table class="rp" style="max-width:600px"><tr><th>설비</th><th style="width:90px">생산수량</th><th style="width:60px">불량</th><th style="width:54px">건수</th><th style="width:64px">품목 수</th><th>작업자</th></tr>';
  equips.forEach(function(eq){
    var g = byEquip[eq];
    h += '<tr><td>'+esc(eq)+'</td><td class="right">'+num(g.qty)+'</td>'
      + '<td style="color:'+(g.def>0?'#dc2626':'#999')+'">'+num(g.def)+'</td>'
      + '<td>'+num(g.cnt)+'</td>'
      + '<td>'+num(Object.keys(g.sabuns).length)+'</td>'
      + '<td style="font-size:11px">'+esc(Object.keys(g.workers).join(', ')||'-')+'</td></tr>';
  });
  h += '</table>';

  /* 3. 작업자별 실적 */
  h += '<h2 class="sec">3. 작업자별 사상 실적</h2>';
  h += '<table class="rp" style="max-width:480px"><tr><th>작업자</th><th style="width:90px">생산수량</th><th style="width:60px">불량</th><th style="width:54px">건수</th><th style="width:64px">품목 수</th></tr>';
  workers.forEach(function(w){
    var g = byWorker[w];
    h += '<tr><td>'+esc(w)+'</td><td class="right">'+num(g.qty)+'</td>'
      + '<td style="color:'+(g.def>0?'#dc2626':'#999')+'">'+num(g.def)+'</td>'
      + '<td>'+num(g.cnt)+'</td>'
      + '<td>'+num(Object.keys(g.sabuns).length)+'</td></tr>';
  });
  h += '</table>';

  /* 4. 특이사항 (일자+내용 중복 제거) */
  var remSeen = {}, rems = [];
  rows.forEach(function(r){
    var t = (r.note||'').trim();
    if (!t) return;
    var k = r.work_date + '|' + t;
    if (remSeen[k]) return; remSeen[k]=1;
    rems.push({ d:r.work_date, by:r.created_by_name||r.worker_name||'-', t:t });
  });
  if (rems.length){
    h += '<h2 class="sec">4. 특이사항 / 전달사항</h2>';
    h += '<table class="rp"><tr><th style="width:90px">일자</th><th style="width:90px">작성자</th><th>내용</th></tr>';
    rems.forEach(function(r){ h += '<tr><td>'+esc(r.d)+'</td><td>'+esc(r.by)+'</td><td class="left">'+esc(r.t)+'</td></tr>'; });
    h += '</table>';
  }

  if (lotMiss.length){
    var lmRows = '';
    lotMiss.forEach(function(r){
      lmRows += '<tr><td>'+esc(r.work_date)+'</td><td>'+esc(sasangEquipOf(r)||'-')+'</td><td>'+esc(r.sabun||'-')+'</td>'
        + '<td class="left">'+esc(r.product_name||(PRODUCTS[r.sabun]||{}).partName||'-')+'</td>'
        + '<td class="right">'+num(r.production_qty)+'</td><td>'+esc(r.worker_name||'-')+'</td><td class="left">'+esc(r.note||'')+'</td></tr>';
    });
    h += lotMissSection([{h:'일자',w:80},{h:'설비',w:110},{h:'사번',w:80},{h:'품명'},{h:'수량',w:80},{h:'작업자',w:90},{h:'비고'}], lmRows);
  }
  body.innerHTML = h;

  /* 엑셀 */
  var sh1 = [['사번','품번','품명','작업자','방법','생산수량','불량','건수']];
  sabuns.forEach(function(sb){
    var g=bySabun[sb], prod=PRODUCTS[sb]||{partNo:'',partName:''};
    sh1.push([sb, prod.partNo, g.pname||prod.partName, Object.keys(g.workers).join(', '), Object.keys(g.methods).join('·'), g.qty, g.def, g.cnt]);
  });
  var sh2 = [['설비','생산수량','불량','건수','품목 수','작업자']];
  equips.forEach(function(eq){
    var g=byEquip[eq];
    sh2.push([eq, g.qty, g.def, g.cnt, Object.keys(g.sabuns).length, Object.keys(g.workers).join(', ')]);
  });
  var sh3 = [['작업자','생산수량','불량','건수','품목 수']];
  workers.forEach(function(w){
    var g=byWorker[w];
    sh3.push([w, g.qty, g.def, g.cnt, Object.keys(g.sabuns).length]);
  });
  var sh4 = [['일자','근무','설비','사번','품번','품명','LOT','방법','생산수량','불량','작업자','시작','종료','비고']];
  rows.forEach(function(r){
    var prod = PRODUCTS[r.sabun]||{partNo:'',partName:''};
    sh4.push([r.work_date, r.shift_type||'', sasangEquipOf(r), r.sabun||'', prod.partNo,
      r.product_name||prod.partName, r.lot_no||'', r.work_method||'',
      r.production_qty||0, r.defect_qty||0, r.worker_name||'', r.start_time||'', r.end_time||'', r.note||'']);
  });
  lastXlsx = { name:'sasang', sheets:[ {n:'품목별요약',d:sh1}, {n:'설비별',d:sh2}, {n:'작업자별',d:sh3}, {n:'상세내역',d:sh4} ] };
  if (lotMiss.length){
    var shL = [['일자','설비','사번','품명','수량','작업자','비고']];
    lotMiss.forEach(function(r){ shL.push([r.work_date, sasangEquipOf(r), r.sabun||'', r.product_name||(PRODUCTS[r.sabun]||{}).partName||'', r.production_qty||0, r.worker_name||'', r.note||'']); });
    lastXlsx.sheets.push({ n:'LOT미입력', d:shL });
  }
  if (rems.length){
    var sh5 = [['일자','작성자','내용']];
    rems.forEach(function(r){ sh5.push([r.d, r.by, r.t]); });
    lastXlsx.sheets.push({ n:'특이사항', d:sh5 });
  }
}

/* ════════════════════ 검사 (inspection) ════════════════════ */
function parseDefectTypes(str){
  // "찍힘(3), 이물(2)" → [{type:'찍힘',qty:3},{type:'이물',qty:2}]
  var out = [];
  String(str||'').replace(/([^,()]+)\((\d+)\)/g, function(_, t, q){
    var name = t.trim();
    if (name) out.push({ type:name, qty:parseInt(q)||0 });
    return '';
  });
  return out;
}
async function renderInspection(rows){
  var body = document.getElementById('rpBody');
  if (!rows.length){ body.innerHTML = '<div class="empty-msg">해당 기간에 제출된 검사 작업일지가 없습니다.</div>'; return; }
  await loadProducts();

  var bySabun = {}, byWorker = {}, byDefect = {}, tIns=0, tPass=0, tFail=0, recheckCnt=0;
  rows.forEach(function(r){
    var ins = r.inspect_qty||0, ps = r.pass_qty||0, fl = r.fail_qty||0;
    tIns += ins; tPass += ps; tFail += fl;
    if (r.recheck) recheckCnt++;
    var sb = r.worker_id || '(사번미입력)';
    if (!bySabun[sb]) bySabun[sb] = { ins:0, pass:0, fail:0, cnt:0, re:0, workers:{}, rows:[] };
    var g = bySabun[sb];
    g.ins += ins; g.pass += ps; g.fail += fl; g.cnt++; g.rows.push(r);
    if (r.recheck) g.re++;
    if (r.worker_name) g.workers[r.worker_name] = 1;
    var w = r.worker_name || '(미지정)';
    if (!byWorker[w]) byWorker[w] = { ins:0, pass:0, fail:0, cnt:0 };
    byWorker[w].ins += ins; byWorker[w].pass += ps; byWorker[w].fail += fl; byWorker[w].cnt++;
    parseDefectTypes(r.defect_type).forEach(function(d){
      if (!byDefect[d.type]) byDefect[d.type] = { qty:0, sabuns:{} };
      byDefect[d.type].qty += d.qty;
      byDefect[d.type].sabuns[sb] = (byDefect[d.type].sabuns[sb]||0) + d.qty;
    });
  });
  var sabuns = Object.keys(bySabun).sort(function(a,b){ return bySabun[b].ins - bySabun[a].ins; });
  var workers = Object.keys(byWorker).sort(function(a,b){ return byWorker[b].ins - byWorker[a].ins; });
  var defects = Object.keys(byDefect).sort(function(a,b){ return byDefect[b].qty - byDefect[a].qty; });
  var lotMiss = rows.filter(function(r){ return lotMissingArr(r.lot_nos); });
  var passRate = function(p, i){ return i > 0 ? (Math.round(p/i*10000)/100) : 0; };

  var h = '';
  h += '<div class="sum-grid">'
    + '<div class="sum-card"><div class="n">'+num(tIns)+'</div><div class="l">총 검사수량</div></div>'
    + '<div class="sum-card"><div class="n" style="color:#0369a1">'+num(tPass)+'</div><div class="l">합격</div></div>'
    + '<div class="sum-card"><div class="n" style="color:'+(tFail>0?'#dc2626':'#222')+'">'+num(tFail)+'</div><div class="l">불합격</div></div>'
    + '<div class="sum-card"><div class="n">'+passRate(tPass,tIns)+'%</div><div class="l">합격률</div></div>'
    + '<div class="sum-card"><div class="n">'+num(sabuns.length)+'</div><div class="l">품목(사번) 수</div></div>'
    + '</div>';
  h += lotWarnStrip(lotMiss.length);

  /* 1. 품목별 검사 실적 */
  h += '<h2 class="sec">1. 품목(사번)별 검사 실적 <span style="font-weight:400;font-size:11px;color:#98a0b0">— 행 클릭 시 LOT 상세</span></h2>';
  h += '<table class="rp"><tr><th style="width:74px">사번</th><th style="width:108px">품번</th><th>품명</th><th style="width:96px">검사자</th><th style="width:78px">검사수량</th><th style="width:64px">합격</th><th style="width:60px">불합격</th><th style="width:64px">합격률</th><th style="width:46px">재검</th><th style="width:26px"></th></tr>';
  sabuns.forEach(function(sb, i){
    var g = bySabun[sb];
    var prod = PRODUCTS[sb] || { partNo:'-', partName:'-' };
    h += '<tr class="grp-row" onclick="toggleDet(\'in'+i+'\')">'
      + '<td>'+esc(sb)+'</td><td>'+esc(prod.partNo||'-')+'</td><td class="left">'+esc(prod.partName||'-')+'</td>'
      + '<td style="font-size:11px">'+esc(Object.keys(g.workers).join(', ')||'-')+'</td>'
      + '<td class="right" style="font-weight:700">'+num(g.ins)+'</td>'
      + '<td class="right" style="color:#0369a1">'+num(g.pass)+'</td>'
      + '<td class="right" style="color:'+(g.fail>0?'#dc2626':'#999')+'">'+num(g.fail)+'</td>'
      + '<td>'+passRate(g.pass,g.ins)+'%</td>'
      + '<td>'+(g.re>0?g.re:'-')+'</td>'
      + '<td class="arrow" id="ar-in'+i+'">▼</td></tr>';
    h += '<tr class="det-row" id="det-in'+i+'"><td colspan="10">'
      + '<table class="det"><tr><th style="width:80px">일자</th><th>LOT</th><th>불량유형</th><th style="width:44px">재검</th><th>비고</th></tr>';
    g.rows.forEach(function(r){
      var lots = (r.lot_nos||[]).filter(function(l){return l;}).join(', ');
      h += '<tr><td>'+esc(r.work_date)+'</td><td class="left">'+ (lots?esc(lots):'-') +'</td>'
        + '<td class="left" style="color:'+(r.defect_type?'#b45309':'#999')+'">'+esc(r.defect_type||'-')+'</td>'
        + '<td>'+(r.recheck?'<span style="color:#7c3aed;font-weight:700">재검</span>':'-')+'</td>'
        + '<td class="left">'+esc(r.defect_memo||'')+'</td></tr>';
    });
    h += '</table></td></tr>';
  });
  h += '</table>';

  /* 2. 불량유형별 집계 */
  if (defects.length){
    h += '<h2 class="sec">2. 불량유형별 집계</h2>';
    h += '<table class="rp"><tr><th style="width:130px">불량유형</th><th style="width:70px">수량</th><th>발생 사번 (수량)</th></tr>';
    defects.forEach(function(t){
      var d = byDefect[t];
      var sbList = Object.keys(d.sabuns).sort(function(a,b){ return d.sabuns[b]-d.sabuns[a]; })
        .map(function(sb){ return sb+' ('+d.sabuns[sb]+')'; }).join(', ');
      h += '<tr><td>'+esc(t)+'</td><td class="right" style="color:#dc2626;font-weight:700">'+num(d.qty)+'</td><td class="left" style="font-size:11px">'+esc(sbList)+'</td></tr>';
    });
    h += '</table>';
  }

  /* 3. 검사자별 실적 */
  h += '<h2 class="sec">'+(defects.length?'3':'2')+'. 검사자별 실적</h2>';
  h += '<table class="rp" style="max-width:520px"><tr><th>검사자</th><th style="width:86px">검사수량</th><th style="width:70px">합격</th><th style="width:70px">불합격</th><th style="width:64px">건수</th></tr>';
  workers.forEach(function(w){
    var g = byWorker[w];
    h += '<tr><td>'+esc(w)+'</td><td class="right">'+num(g.ins)+'</td><td class="right" style="color:#0369a1">'+num(g.pass)+'</td>'
      + '<td class="right" style="color:'+(g.fail>0?'#dc2626':'#999')+'">'+num(g.fail)+'</td><td>'+num(g.cnt)+'</td></tr>';
  });
  h += '</table>';

  /* 4. 특이사항 */
  var remSeen = {}, rems = [];
  rows.forEach(function(r){
    var t = (r.remarks||'').trim();
    if (!t) return;
    var k = r.work_date + '|' + t;
    if (remSeen[k]) return; remSeen[k]=1;
    rems.push({ d:r.work_date, by:r.created_by_name||r.worker_name||'-', t:t });
  });
  if (rems.length){
    h += '<h2 class="sec">'+((defects.length?3:2)+1)+'. 특이사항 / 전달사항</h2>';
    h += '<table class="rp"><tr><th style="width:90px">일자</th><th style="width:90px">작성자</th><th>내용</th></tr>';
    rems.forEach(function(r){ h += '<tr><td>'+esc(r.d)+'</td><td>'+esc(r.by)+'</td><td class="left">'+esc(r.t)+'</td></tr>'; });
    h += '</table>';
  }
  if (recheckCnt > 0){
    h += '<div style="font-size:11px;color:#7c3aed;margin-top:10px">※ 재검 기록 '+recheckCnt+'건이 집계에 포함되어 있습니다 (품목별 표의 재검 열 참고)</div>';
  }

/* ════════════════════ 도포 (coating) ════════════════════ */
async function renderCoating(rows){
  var body = document.getElementById('rpBody');
  if (!rows.length){ body.innerHTML = '<div class="empty-msg">해당 기간에 제출된 도포 작업일지가 없습니다.</div>'; return; }
  await loadProducts();

  var bySabun = {}, byType = {}, byWorker = {}, totalQty = 0, totalDef = 0;
  rows.forEach(function(r){
    var q = r.total_qty || 0, d = r.defect_qty || 0;
    totalQty += q; totalDef += d;
    var sb = r.worker_id || '(사번미입력)';
    if (!bySabun[sb]) bySabun[sb] = { qty:0, def:0, cnt:0, workers:{}, types:{}, rows:[] };
    var g = bySabun[sb];
    g.qty += q; g.def += d; g.cnt++; g.rows.push(r);
    if (r.worker_name) g.workers[r.worker_name] = 1;
    if (r.work_type) g.types[r.work_type] = 1;
    var t = r.work_type || '(유형미지정)';
    if (!byType[t]) byType[t] = { qty:0, def:0, cnt:0, sabuns:{} };
    byType[t].qty += q; byType[t].def += d; byType[t].cnt++; byType[t].sabuns[sb] = 1;
    var w = r.worker_name || '(미지정)';
    if (!byWorker[w]) byWorker[w] = { qty:0, def:0, cnt:0 };
    byWorker[w].qty += q; byWorker[w].def += d; byWorker[w].cnt++;
  });
  var sabuns = Object.keys(bySabun).sort(function(a,b){ return bySabun[b].qty - bySabun[a].qty; });
  var types = Object.keys(byType).sort(function(a,b){ return byType[b].qty - byType[a].qty; });
  var workers = Object.keys(byWorker).sort(function(a,b){ return byWorker[b].qty - byWorker[a].qty; });
  var defRate = totalQty > 0 ? (Math.round(totalDef/totalQty*10000)/100) : 0;

  var h = '';
  h += '<div class="sum-grid">'
    + '<div class="sum-card"><div class="n">'+num(totalQty)+'</div><div class="l">총 작업수량</div></div>'
    + '<div class="sum-card"><div class="n" style="color:'+(totalDef>0?'#dc2626':'#222')+'">'+num(totalDef)+'</div><div class="l">불량</div></div>'
    + '<div class="sum-card"><div class="n" style="color:'+(totalDef>0?'#dc2626':'#222')+'">'+defRate+'%</div><div class="l">불량률</div></div>'

  h += '<table class="rp"><tr><th style="width:74px">사번</th><th style="width:108px">품번</th><th>품명</th><th style="width:100px">작업자</th><th style="width:120px">작업유형</th><th style="width:80px">총수량</th><th style="width:54px">불량</th><th style="width:46px">건수</th><th style="width:26px"></th></tr>';
  sabuns.forEach(function(sb, i){
    var g = bySabun[sb];

      + '<td>'+esc(sb)+'</td><td>'+esc(prod.partNo||'-')+'</td><td class="left">'+esc(prod.partName||'-')+'</td>'

      + '<td class="right" style="font-weight:700">'+num(g.qty)+'</td>'
      + '<td style="color:'+(g.def>0?'#dc2626':'#999')+'">'+num(g.def)+'</td>'
      + '<td>'+num(g.cnt)+'</td>'
      + '<td class="arrow" id="ar-ct'+i+'">▼</td></tr>';
    h += '<tr class="det-row" id="det-ct'+i+'"><td colspan="9">'
      + '<table class="det"><tr><th style="width:80px">일자</th><th>작업유형</th><th style="width:130px">라인 구성</th><th>비고</th></tr>';
    g.rows.forEach(function(r){

  h += '</table>';

  h += '<h2 class="sec">2. 작업유형별 실적</h2>';

      + '<td>'+num(g.cnt)+'</td><td>'+num(Object.keys(g.sabuns).length)+'</td></tr>';

  h += '</table>';

  /* 3. 작업자별 실적 */

  h += '<table class="rp" style="max-width:480px"><tr><th>작업자</th><th style="width:86px">총수량</th><th style="width:64px">불량</th><th style="width:60px">건수</th></tr>';
  workers.forEach(function(w){

    h += '<tr><td>'+esc(w)+'</td><td class="right">'+num(g.qty)+'</td>'
      + '<td style="color:'+(g.def>0?'#dc2626':'#999')+'">'+num(g.def)+'</td><td>'+num(g.cnt)+'</td></tr>';

  h += '</table>';

  /* 4. 특이사항 */
  var remSeen = {}, rems = [];

    if (!t) return;
    var k = r.work_date + '|' + t;

  }

  body.innerHTML = h;

  if (!rows.length){ body.innerHTML = cutSrcBar() + '<div class="empty-msg">해당 기간에 제출된 재단 작업일지가 없습니다.</div>'; return; }

  var bySabun = {}, byMat = {}, byWorker = {}, totalQty = 0, totalBox = 0, totalScrap = 0;
  rows.forEach(function(r){
    var q = r.total_qty || 0, b = r.box_count || 0, s = r.scrap_weight || 0;
    totalQty += q; totalBox += b; totalScrap += s;

    if (!bySabun[sb]) bySabun[sb] = { qty:0, box:0, scrap:0, cnt:0, workers:{}, mats:{}, rows:[] };
    var g = bySabun[sb];
    g.qty += q; g.box += b; g.scrap += s; g.cnt++; g.rows.push(r);
    if (r.worker_name) g.workers[r.worker_name] = 1;
    if (r.material_name) g.mats[r.material_name] = 1;

    byWorker[w].qty += q; byWorker[w].box += b; byWorker[w].scrap += s; byWorker[w].cnt++;
  });

/* ════════════════════ MES 공통 (재단·혼련·평량 — mes_*_raw) ════════════════════ */
/* MES 원자료: deleted_at·created_at 없음 → 전용 조회. product_code = 사번(제품코드). 같은 날짜 재업로드 시 통째로 교체됨(mes_data.html). */
async function fetchMesRows(table, s, e){
  var all=[], from=0, step=1000;
  while (true){
    var res = await db.from(table).select('*')
      .gte('work_date', s).lte('work_date', e)
      .order('work_date', {ascending:true})
      .order('id', {ascending:true})
      .range(from, from+step-1);
    if (res.error) throw res.error;
    all = all.concat(res.data||[]);
    if (!res.data || res.data.length < step) break;
    from += step;
  }
  return all;
}
var cutSrc = 'mes';   /* 재단 탭 자료원: 'mes'(기본) | 'field'(현장 작업일지, 10월 이전 자료용) */
function setCutSrc(v){ cutSrc = v; loadReport(false); }
function cutSrcBar(){
  var b = function(v, t){ var on = cutSrc===v; return '<button type="button" onclick="setCutSrc(\''+v+'\')" style="font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid '+(on?'#243bb2':'#cfd5e3')+';background:'+(on?'#243bb2':'#fff')+';color:'+(on?'#fff':'#555')+';cursor:pointer;font-weight:'+(on?'700':'400')+'">'+t+'</button>'; };
  return '<div class="no-print" style="display:flex;gap:6px;align-items:center;margin:-4px 0 10px;font-size:11px;color:#888">자료원: '+b('mes','MES 재단일보')+b('field','현장 작업일지(구)')+'<span style="margin-left:4px">'+(cutSrc==='mes'?'— MES 자료 페이지에서 업로드한 재단일보 기준':'— 태블릿 현장 입력분 기준 (2026-10 이전 자료)')+'</span></div>';
}
function mesNum(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function mesFix(v, d){ var n = mesNum(v); return n.toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d}); }
function mesKg(v){ return mesFix(v, 1); }
function mesAvg(sum, cnt, d){ return cnt > 0 ? mesFix(sum/cnt, d) : '-'; }
function mesProd(code){ return PRODUCTS[code] || { partNo:'-', partName:'-' }; }
function mesCmp(a, b){ return String(a).localeCompare(String(b), 'ko', {numeric:true}); }
function mesDateSort(list, key2){
  return list.slice().sort(function(a,b){ if (a.work_date !== b.work_date) return a.work_date < b.work_date ? -1 : 1; return key2 ? mesCmp(a[key2]||'', b[key2]||'') : 0; });
}

/* ════════════════════ 평량 (MES: mes_weighing_raw) ════════════════════ */
/* 컬럼: machine · product_code · material(원료명 / 소계 행은 '[▶뱃지계]') · batch_qty(내리수 — 소계 행에만) · item_name · weight_kg
   구조: 품목(사번)마다 원료 행 N개 + 뱃지계 소계 행 1개(내리수·뱃지 총중량). 뱃지 = 일자|호기|사번 단위. */
var MES_SUB = '[▶뱃지계]';
async function renderMesWeighing(rows){
  var body = document.getElementById('rpBody');
  if (!rows.length){ body.innerHTML = '<div class="empty-msg">해당 기간에 업로드된 MES 평량일보가 없습니다. (MES 자료 페이지에서 업로드)</div>'; return; }
  await loadProducts();
  var subs = rows.filter(function(r){ return r.material === MES_SUB; });
  var ings = rows.filter(function(r){ return r.material !== MES_SUB; });
  var byBatch = {}, byMach = {}, byProd = {}, byMat = {};
  var bkey = function(r){ return [r.work_date, r.machine||'', r.product_code||''].join('|'); };
  rows.forEach(function(r){
    var k = bkey(r);
    if (!byBatch[k]) byBatch[k] = { date:r.work_date, mach:r.machine||'(호기미지정)', code:r.product_code||'(사번없음)', name:'', subN:0, bq:0, subWt:0, ingN:0, ingWt:0, ings:[] };
    var B = byBatch[k];
    if (r.material === MES_SUB){ B.subN++; B.bq += mesNum(r.batch_qty); B.subWt += mesNum(r.weight_kg); if (r.item_name && !B.name) B.name = r.item_name; }
    else { B.ingN++; B.ingWt += mesNum(r.weight_kg); B.ings.push(r); if (!B.name && r.item_name) B.name = r.item_name; }
  });
  var batches = Object.keys(byBatch).map(function(k){ return byBatch[k]; });
  var T = { subN:0, bq:0, subWt:0, ingWt:0, ingN:ings.length };
  batches.forEach(function(B){
    T.subN += B.subN; T.bq += B.bq; T.subWt += B.subWt; T.ingWt += B.ingWt;
    if (!byMach[B.mach]) byMach[B.mach] = { subN:0, bq:0, subWt:0, ingN:0, ingWt:0, prods:{}, days:{}, batches:[] };
    var M = byMach[B.mach]; M.subN += B.subN; M.bq += B.bq; M.subWt += B.subWt; M.ingN += B.ingN; M.ingWt += B.ingWt; M.prods[B.code] = 1; M.days[B.date] = 1; M.batches.push(B);
    if (!byProd[B.code]) byProd[B.code] = { name:B.name, subN:0, bq:0, subWt:0, ingN:0, ingWt:0, machs:{}, mats:{}, days:{}, batches:[] };
    var P = byProd[B.code]; if (!P.name && B.name) P.name = B.name;
    P.subN += B.subN; P.bq += B.bq; P.subWt += B.subWt; P.ingN += B.ingN; P.ingWt += B.ingWt; P.machs[B.mach] = 1; P.days[B.date] = 1; P.batches.push(B);
    B.ings.forEach(function(r){ P.mats[r.material||'(원료미지정)'] = 1; });
  });
  ings.forEach(function(r){
    var m = r.material || '(원료미지정)';
    if (!byMat[m]) byMat[m] = { wt:0, cnt:0, prods:{}, days:{} };
    byMat[m].wt += mesNum(r.weight_kg); byMat[m].cnt++; byMat[m].prods[r.product_code||'(사번없음)'] = 1; byMat[m].days[r.work_date] = 1;
  });
  var machs = Object.keys(byMach).sort(mesCmp);
  var prods = Object.keys(byProd).sort(function(a,b){ return byProd[b].subWt - byProd[a].subWt || byProd[b].ingWt - byProd[a].ingWt; });
  var mats = Object.keys(byMat).sort(function(a,b){ return byMat[b].wt - byMat[a].wt; });
  var noSub = batches.filter(function(B){ return B.subN === 0; }).length;
  var pname = function(code, fallback){ var pr = mesProd(code); return pr.partName !== '-' ? pr.partName : (fallback || '-'); };

  var h = '';
  h += '<div class="sum-grid" style="grid-template-columns:repeat(6,1fr)">'

  /* 1. 호기별 */
  h += '<h2 class="sec">1. 호기별 평량 실적 <span style="font-weight:400;font-size:11px;color:#98a0b0">— 행 클릭 시 일자·품목별 뱃지</span></h2>';

    h += '<tr class="det-row" id="det-xw'+i+'"><td colspan="9"><table class="det"><tr><th style="width:78px">일자</th><th style="width:70px">사번</th><th>품명</th><th style="width:60px">내리수</th><th style="width:90px">뱃지중량(kg)</th><th style="width:60px">원료 수</th><th style="width:90px">원료합(kg)</th></tr>';
    M.batches.sort(function(a,b){ return a.date!==b.date ? (a.date<b.date?-1:1) : mesCmp(a.code,b.code); }).forEach(function(B){
      h += '<tr><td>'+esc(B.date)+'</td><td>'+esc(B.code)+'</td><td class="left">'+esc(pname(B.code, B.name))+'</td><td class="right">'+(B.subN?num(B.bq):'<span style="color:#dc2626">소계없음</span>')+'</td><td class="right">'+mesKg(B.subWt)+'</td><td>'+num(B.ingN)+'</td><td class="right">'+mesKg(B.ingWt)+'</td></tr>';
    });
    h += '</table></td></tr>';

  h += '</table>';

  /* 2. 품목별 */
  h += '<h2 class="sec">2. 품목(사번)별 평량 실적 <span style="font-weight:400;font-size:11px;color:#98a0b0">— 행 클릭 시 원료 배합 상세</span></h2>';
  h += '<table class="rp"><tr><th style="width:70px">사번</th><th style="width:104px">품번</th><th>품명</th><th style="width:110px">호기</th><th style="width:60px">작업일</th><th style="width:60px">뱃지 수</th><th style="width:66px">내리수</th><th style="width:92px">뱃지 총중량(kg)</th><th style="width:92px">원료 투입(kg)</th><th style="width:60px">원료 종류</th><th style="width:26px"></th></tr>';
  prods.forEach(function(p, i){
    var P = byProd[p];
    h += '<tr class="grp-row" onclick="toggleDet(\'xq'+i+'\')"><td>'+esc(p)+'</td><td>'+esc(mesProd(p).partNo)+'</td><td class="left">'+esc(pname(p, P.name))+'</td>'
      + '<td style="font-size:11px">'+esc(Object.keys(P.machs).sort(mesCmp).map(function(x){ return x.replace(/\(.*?\)/g,''); }).join(', '))+'</td><td>'+num(Object.keys(P.days).length)+'</td><td>'+num(P.subN)+'</td>'
      + '<td class="right" style="font-weight:700">'+num(P.bq)+'</td><td class="right">'+mesKg(P.subWt)+'</td><td class="right">'+mesKg(P.ingWt)+'</td><td>'+num(Object.keys(P.mats).length)+'</td><td class="arrow" id="ar-xq'+i+'">▼</td></tr>';
    h += '<tr class="det-row" id="det-xq'+i+'"><td colspan="11"><table class="det"><tr><th style="width:78px">일자</th><th style="width:120px">호기</th><th>원료(재질)</th><th style="width:150px">품명</th><th style="width:60px">내리수</th><th style="width:90px">중량(kg)</th></tr>';
    P.batches.sort(function(a,b){ return a.date!==b.date ? (a.date<b.date?-1:1) : mesCmp(a.mach,b.mach); }).forEach(function(B){
      B.ings.forEach(function(r){ h += '<tr><td>'+esc(B.date)+'</td><td class="left" style="font-size:10px">'+esc(B.mach)+'</td><td class="left">'+esc(r.material||'-')+'</td><td class="left" style="font-size:10px">'+esc(r.item_name||'')+'</td><td></td><td class="right">'+mesKg(r.weight_kg)+'</td></tr>'; });
      h += '<tr style="background:#e2e8f0;font-weight:700"><td>'+esc(B.date)+'</td><td class="left" style="font-size:10px">'+esc(B.mach)+'</td><td class="left">▶ 뱃지계'+(B.subN?'':' <span style="color:#dc2626;font-weight:400">(소계 행 없음)</span>')+'</td><td class="left" style="font-size:10px">'+esc(B.name||'')+'</td><td class="right">'+(B.subN?num(B.bq):'-')+'</td><td class="right">'+(B.subN?mesKg(B.subWt):'-')+' <span style="font-weight:400;color:#777;font-size:10px">(원료합 '+mesKg(B.ingWt)+')</span></td></tr>';
    });
    h += '</table></td></tr>';
  });
  h += '</table>';
  h += '<div style="font-size:10.5px;color:#888;margin:4px 0 0">※ 뱃지 총중량 = MES 뱃지계 소계 행의 중량, 원료 투입 = 원료 행 중량 합 (두 값의 관계는 MES 원본 기준 그대로 표시)</div>';

  /* 3. 원료별 */
  h += '<h2 class="sec">3. 원료(재질)별 사용량</h2>';
  h += '<table class="rp" style="max-width:820px"><tr><th>원료(재질)</th><th style="width:96px">사용 중량(kg)</th><th style="width:60px">비중</th><th style="width:60px">사용 건</th><th style="width:60px">작업일</th><th>투입 품목(사번)</th></tr>';
  mats.forEach(function(m){ var X = byMat[m];
    h += '<tr><td class="left">'+esc(m)+'</td><td class="right" style="font-weight:700">'+mesKg(X.wt)+'</td><td>'+(T.ingWt>0?mesFix(X.wt/T.ingWt*100,1)+'%':'-')+'</td><td>'+num(X.cnt)+'</td><td>'+num(Object.keys(X.days).length)+'</td><td class="left" style="font-size:11px">'+esc(Object.keys(X.prods).sort().join(', '))+'</td></tr>'; });
  h += '</table>';
  body.innerHTML = h;

  /* 엑셀 */
  var r1 = function(x){ return Math.round(mesNum(x)*10)/10; };
  var s1 = [['호기','작업일수','뱃지수','내리수','뱃지총중량(kg)','원료투입(kg)','원료행','품목수']];
  machs.forEach(function(m){ var M = byMach[m]; s1.push([m, Object.keys(M.days).length, M.subN, M.bq, r1(M.subWt), r1(M.ingWt), M.ingN, Object.keys(M.prods).length]); });
  var s2 = [['사번','품번','품명','호기','작업일수','뱃지수','내리수','뱃지총중량(kg)','원료투입(kg)','원료종류']];
  prods.forEach(function(p){ var P = byProd[p]; s2.push([p, mesProd(p).partNo==='-'?'':mesProd(p).partNo, pname(p, P.name), Object.keys(P.machs).sort(mesCmp).join(', '), Object.keys(P.days).length, P.subN, P.bq, r1(P.subWt), r1(P.ingWt), Object.keys(P.mats).length]); });
  var s3 = [['원료(재질)','사용중량(kg)','비중(%)','사용건','작업일수','투입품목']];
  mats.forEach(function(m){ var X = byMat[m]; s3.push([m, r1(X.wt), T.ingWt>0?r1(X.wt/T.ingWt*100):'', X.cnt, Object.keys(X.days).length, Object.keys(X.prods).sort().join(', ')]); });
  var s4 = [['일자','호기','사번','품명','구분','원료(재질)','내리수','중량(kg)']];
  batches.sort(function(a,b){ return a.date!==b.date ? (a.date<b.date?-1:1) : (mesCmp(a.mach,b.mach) || mesCmp(a.code,b.code)); }).forEach(function(B){
    B.ings.forEach(function(r){ s4.push([B.date, B.mach, B.code, r.item_name||'', '원료', r.material||'', '', mesNum(r.weight_kg)]); });
    s4.push([B.date, B.mach, B.code, B.name||'', '뱃지계', '', B.subN?B.bq:'', B.subN?r1(B.subWt):'']);
  });
  lastXlsx = { name:'weighing_mes', sheets:[ {n:'호기별',d:s1}, {n:'품목별',d:s2}, {n:'원료별',d:s3}, {n:'상세내역',d:s4} ] };
}

/* ════════════════════ 성형 (molding) ════════════════════ */
/* 컬럼: sabun(사번) · equipment_no(호기) · team(반) · shift_type · work_type(면: 가면/나면/다면/'') · batch_no · cavity · shot_count
   production_qty(양품 = C/V×Shot−불량) · defect_qty · start_time/end_time · note(JSON: text·face·conditions·downtime)
   ※ LOT 개념 없음(배치=batch_no). 비가동/식사 제외 계산은 data_viewer와 동일 규칙(#18). */
function mdNote(r){ try { var n = JSON.parse(r.note); return (n && typeof n === 'object') ? n : {}; } catch(e){ return { text: r.note || '' }; } }
function mdToMin(t){ var p=(''+t).split(':'); return (+p[0])*60 + (+p[1]); }
/* 구간(start~end) 순수 분 = 길이 − 점심(12:00~13:00)·저녁(17:00~17:30) 겹침 (자정 걸침 대응) */
function mdNetMin(start, end){
  if (!start || !end) return 0;
  var a1 = mdToMin(start), len = mdToMin(end) - a1; if (len < 0) len += 1440;
  if (isNaN(len)) return 0;
  var a2 = a1 + len;
  var ov = function(b1,b2){ var lo=Math.max(a1,b1), hi=Math.min(a2,b2); return hi>lo ? hi-lo : 0; };
  var meal = function(m1,m2){ return ov(m1,m2) + ov(m1+1440,m2+1440); };
  var net = len - meal(720,780) - meal(1020,1050);
  return net < 0 ? 0 : net;
}
function mdHr(min){ return (Math.round((min||0)/6)/10).toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1}); }
function mdPct(a, b){ return b > 0 ? (Math.round(a/b*1000)/10).toFixed(1) : '-'; }
function mdFaceRank(f){ var m={'가면':0,'나면':1,'다면':2}; return (f in m) ? m[f] : 3; }
function mdRateColor(rate){ return rate === '-' ? '#999' : (+rate >= 85 ? '#059669' : (+rate >= 70 ? '#d97706' : '#dc2626')); }
function mdEqCmp(a, b){ return String(a).localeCompare(String(b), 'ko', {numeric:true}); }

async function renderMolding(rows){
  var body = document.getElementById('rpBody');
  if (!rows.length){ body.innerHTML = '<div class="empty-msg">해당 기간에 제출된 성형 작업일지가 없습니다.</div>'; return; }
  await loadProducts();

  var byEq = {}, bySabun = {}, byWorker = {}, totProd = 0, totDef = 0, totShot = 0;
  var shiftSeen = {}, shiftFaces = {}, dtSeen = {}, dtList = [], mcMap = {}, noteSeen = {}, notes = [], teams = {};

  rows.forEach(function(r){
    var n = mdNote(r);
    var p = r.production_qty || 0, d = r.defect_qty || 0, s = r.shot_count || 0;
    var eq = r.equipment_no || '(설비미지정)', sb = r.sabun || '(사번미입력)', face = r.work_type || '';
    totProd += p; totDef += d; totShot += s;
    if (r.team) teams[r.team] = 1;

    /* 1) 호기별 */
    if (!byEq[eq]) byEq[eq] = { prod:0, def:0, shot:0, cnt:0, avail:0, dt:0, dtRaw:0, shifts:0, faces:{}, fs:{}, sb:{}, sbOrd:[], teams:{}, sabuns:{}, mc:0, rows:[] };
    var E = byEq[eq];
    E.prod += p; E.def += d; E.shot += s; E.cnt++; E.rows.push(r);
    if (face) E.faces[face] = 1;
    if (!E.fs[face]) E.fs[face] = { prod:0, def:0, shot:0, cnt:0, avail:0, dt:0, sb:{}, sbOrd:[] };
    E.fs[face].prod += p; E.fs[face].def += d; E.fs[face].shot += s; E.fs[face].cnt++;
    [[E.fs[face].sb, E.fs[face].sbOrd], [E.sb, E.sbOrd]].forEach(function(t){
      if (!t[0][sb]){ t[0][sb] = { prod:0, def:0, shot:0, cnt:0, cvs:{} }; t[1].push(sb); }
      var X = t[0][sb]; X.prod += p; X.def += d; X.shot += s; X.cnt++; if (r.cavity) X.cvs[r.cavity] = 1;
    });
    if (r.team) E.teams[r.team] = 1;
    E.sabuns[sb] = 1;
    /* 가동가능시간: 같은 제출(날짜·호기·근무·시각)은 면/사번 행이 여러 개여도 1회만 */
    if (r.start_time && r.end_time){
      var sk = [r.work_date, eq, r.shift_type||'', (''+r.start_time).slice(0,5), (''+r.end_time).slice(0,5)].join('|');
      if (!shiftSeen[sk]){ shiftSeen[sk] = { eq:eq, min:mdNetMin(r.start_time, r.end_time), faces:{} }; E.shifts++; }
      shiftSeen[sk].faces[face] = 1;
      var dk = [r.work_date, eq, r.shift_type||''].join('|');
      if (!shiftFaces[dk]) shiftFaces[dk] = {};
      shiftFaces[dk][face] = 1;
    }

    /* 2) 품목별 */
    if (!bySabun[sb]) bySabun[sb] = { prod:0, def:0, shot:0, cnt:0, eqs:{}, cvs:{}, workers:{}, rows:[] };
    var P = bySabun[sb];
    P.prod += p; P.def += d; P.shot += s; P.cnt++; P.rows.push(r);
    P.eqs[eq + (face ? ' ' + face : '')] = 1;
    if (r.cavity) P.cvs[r.cavity] = 1;
    if (r.worker_name) P.workers[r.worker_name] = 1;

    /* 3) 작업자별 */
    var w = r.worker_name || '(미지정)';
    if (!byWorker[w]) byWorker[w] = { prod:0, def:0, shot:0, cnt:0, days:{}, eqs:{} };
    var W = byWorker[w];
    W.prod += p; W.def += d; W.shot += s; W.cnt++; W.days[r.work_date] = 1; W.eqs[eq] = 1;

    /* 4) 비가동: 본인 사번 기록 + 사번 미지정(공통) 기록만 — 형제 행의 옛 사본(#29) 배제 */
    (n.downtime || []).forEach(function(dt){
      if (!dt || !dt.code) return;
      if (dt.sabun && String(dt.sabun) !== String(r.sabun)) return;
      var key = [r.work_date, eq, r.shift_type||'', dt.face||'', dt.code, dt.sabun||'', dt.start||'', dt.end||''].join('|');
      if (dtSeen[key]) return; dtSeen[key] = 1;
      dtList.push({ date:r.work_date, eq:eq, shift:r.shift_type||'', face:dt.face||'전체', sabun:dt.sabun||'', code:dt.code,
                    start:dt.start||'', end:dt.end||'', min:mdNetMin(dt.start, dt.end), detail:dt.detail||'', worker:r.worker_name||'' });
    });

    /* 5) 금형교체: data_viewer와 동일 규칙 — 키=날짜|설비|면|교체후사번(시각 제외), 본인 행 기록 우선 */
    (n.downtime || []).forEach(function(dt){
      if (!dt || dt.code !== '금형교체') return;
      var key = [r.work_date, eq, dt.face||'', dt.sabun||''].join('|');
      var isAuth = !!(dt.sabun && String(r.sabun) === String(dt.sabun));
      if (!mcMap[key] || (isAuth && !mcMap[key].auth)){
        mcMap[key] = { auth:isAuth, date:r.work_date, eq:eq, face:(dt.face && dt.face !== '전체') ? dt.face : '', sabun:dt.sabun||'',
                       start:dt.start||'', end:dt.end||'', min:mdNetMin(dt.start, dt.end), detail:dt.detail||'', worker:r.worker_name||'' };
      }
    });

    /* 6) 특이사항: 제출 시 전 행에 복사되므로 날짜|설비|내용 dedupe */
    var t = (n.text || '').trim();
    if (t){
      var nk = r.work_date + '|' + eq + '|' + t;
      if (!noteSeen[nk]){ noteSeen[nk] = 1; notes.push({ d:r.work_date, eq:eq, by:r.worker_name||r.created_by_name||'-', t:t }); }
    }
  });

  /* 면별 가동가능시간: 각 근무에서 실제 가동한 면마다 근무시간 전체를 부여 */
  Object.keys(shiftSeen).forEach(function(k){
    var S = shiftSeen[k], E = byEq[S.eq];
    Object.keys(S.faces).forEach(function(f){ E.fs[f].avail += S.min; });
  });
  /* 면별 비가동 귀속(실제 기록 분 그대로, 환산 없음):
     · 면 지정(가/나/다면) → 그 면에만
     · '전체'·면 미지정 → 그 근무에 가동한 모든 면에 각각 (설비가 통째로 섰으므로 면마다 같은 시간 정지) */
  dtList.forEach(function(x){
    var E = byEq[x.eq]; if (!E) return;
    E.dtRaw += x.min;
    var present = shiftFaces[[x.date, x.eq, x.shift].join('|')] || {};
    var pf = Object.keys(present);
    if (!pf.length) pf = Object.keys(E.fs);
    var targets = (x.face && x.face !== '전체' && E.fs[x.face]) ? [x.face] : pf;
    targets.forEach(function(f){ if (E.fs[f]) E.fs[f].dt += x.min; });
  });
  /* 면별 상한(비가동 ≤ 가동가능) 적용 후 호기 합계 = 면 합계 */
  Object.keys(byEq).forEach(function(k){
    var E = byEq[k];
    E.avail = 0; E.dt = 0;
    Object.keys(E.fs).forEach(function(f){

    h += '<h2 class="sec">'+(sec++)+'. 특이사항 / 전달사항</h2>';
    h += '<table class="rp"><tr><th style="width:84px">일자</th><th style="width:76px">호기</th><th style="width:80px">작성자</th><th>내용</th></tr>';
    notes.forEach(function(x){ h += '<tr><td>'+esc(x.d)+'</td><td>'+esc(x.eq)+'</td><td>'+esc(x.by)+'</td><td class="left">'+esc(x.t)+'</td></tr>'; });
    h += '</table>';
  }
  body.innerHTML = h;

  /* 엑셀 */
  var r1 = function(v){ return Math.round((v||0)*10)/10; };
  var shE = [['호기','면','사번','품명','C/V','반','근무횟수','생산','불량','불량률(%)','Shot','가동가능(분)','비가동(분)','실생산(분)','가동률(%)','금형교체','비가동 기록합(분)']];
  var xSb = function(k, f, map, ord){
    ord.forEach(function(sb){ var X = map[sb];
      shE.push([k, f, sb, prodOf(sb).partName, Object.keys(X.cvs).join('/'), '', '', X.prod, X.def, mdPct(X.def,X.prod+X.def), X.shot, '', '', '', '', mcTarget[k+'|'+sb]?'교체후투입':'', '']); });
  };
  eqs.forEach(function(k){
    var E = byEq[k], dt = Math.min(E.dt, E.avail), fc = Object.keys(E.faces).length;
    var one = fc <= 1 && E.sbOrd.length === 1 ? E.sbOrd[0] : '';
    shE.push([k, fc>1?fc+'면 합':'', one || (fc>1?'':E.sbOrd.length+'개 품목'), one ? prodOf(one).partName : '', one ? Object.keys(E.sb[one].cvs).join('/') : '',
      Object.keys(E.teams).sort().join(','), E.shifts, E.prod, E.def, mdPct(E.def,E.prod+E.def), E.shot, E.avail, r1(dt), r1(E.avail-dt), mdPct(E.avail-dt,E.avail), E.mc, E.dtRaw]);
    if (fc > 1){
      Object.keys(E.fs).sort(function(a,b){ return mdFaceRank(a) - mdFaceRank(b); }).forEach(function(f){
        var F = E.fs[f], o1 = F.sbOrd.length === 1 ? F.sbOrd[0] : '';
        shE.push([k, f, o1 || F.sbOrd.length+'개 품목', o1 ? prodOf(o1).partName : '', o1 ? Object.keys(F.sb[o1].cvs).join('/') : '',
          '', '', F.prod, F.def, mdPct(F.def,F.prod+F.def), F.shot, F.avail, F.dt, F.avail-F.dt, mdPct(F.avail-F.dt,F.avail), '', '']);
        if (F.sbOrd.length > 1) xSb(k, f, F.sb, F.sbOrd);
      });
    } else if (E.sbOrd.length > 1) xSb(k, '', E.sb, E.sbOrd);
  });
  var shP = [['사번','품번','품명','호기(면)','C/V','Shot','생산','불량','불량률(%)','건수']];
  sabuns.forEach(function(sb){ var P=bySabun[sb], pr=prodOf(sb); shP.push([sb, pr.partNo, pr.partName, Object.keys(P.eqs).sort(mdEqCmp).join(', '), Object.keys(P.cvs).join('/'), P.shot, P.prod, P.def, mdPct(P.def,P.prod+P.def), P.cnt]); });
  var shW = [['작업자','담당호기','근무일','Shot','생산','불량','불량률(%)','건수']];
  workers.forEach(function(w){ var W=byWorker[w]; shW.push([w, Object.keys(W.eqs).sort(mdEqCmp).join(', '), Object.keys(W.days).length, W.shot, W.prod, W.def, mdPct(W.def,W.prod+W.def), W.cnt]); });
  var shD = [['일자','근무','반','호기','면','사번','품번','품명','Batch','C/V','Shot','생산','불량','시작','종료','작업자','비고']];
  rowsSorted(rows).forEach(function(r){
    var pr = prodOf(r.sabun);
    shD.push([r.work_date, r.shift_type||'', r.team||'', r.equipment_no||'', r.work_type||'', r.sabun||'', pr.partNo, pr.partName, r.batch_no||'', r.cavity||'', r.shot_count||0, r.production_qty||0, r.defect_qty||0,
      (''+(r.start_time||'')).slice(0,5), (''+(r.end_time||'')).slice(0,5), r.worker_name||'', mdNote(r).text||'']);
  });
  lastXlsx = { name:'molding', sheets:[ {n:'호기별',d:shE}, {n:'품목별',d:shP}, {n:'작업자별',d:shW}, {n:'상세내역',d:shD} ] };
  if (dtList.length){
    var shT = [['일자','근무','호기','면','사유','시작','종료','분(식사제외)','사번','상세','작업자']];
    dtList.forEach(function(x){ shT.push([x.date, x.shift, x.eq, x.face, x.code, x.start, x.end, x.min, x.sabun, x.detail, x.worker]); });
    lastXlsx.sheets.push({ n:'비가동', d:shT });
  }
  if (mcs.length){
    var shM = [['일자','호기','면','시작','종료','분','교체후사번','교체후품명','작업자']];
    mcs.forEach(function(m){ shM.push([m.date, m.eq, m.face, m.start, m.end, m.min, m.sabun, m.sabun?prodOf(m.sabun).partName:'', m.worker]); });
    lastXlsx.sheets.push({ n:'금형교체', d:shM });
  }
  if (notes.length){
    var shN = [['일자','호기','작성자','내용']];
    notes.forEach(function(x){ shN.push([x.d, x.eq, x.by, x.t]); });
    lastXlsx.sheets.push({ n:'특이사항', d:shN });
  }
}

/* ── 상세 펼침 ── */
function toggleDet(id){
  var el = document.getElementById('det-'+id);
  if (!el) return;
  el.classList.toggle('open');
  var ar = document.getElementById('ar-'+id);
  if (ar) ar.textContent = el.classList.contains('open') ? '▲' : '▼';
}
var allOpen = false;
function toggleAllDetails(){
  allOpen = !allOpen;
  document.querySelectorAll('tr.det-row').forEach(function(el){ el.classList.toggle('open', allOpen); });
  document.querySelectorAll('[id^="ar-"]').forEach(function(el){ el.textContent = allOpen ? '▲' : '▼'; });
  document.getElementById('btnExpand').textContent = allOpen ? '전체 접기' : '전체 펼치기';
}
function resetExpandBtn(){ allOpen = false; document.getElementById('btnExpand').textContent = '전체 펼치기'; }

/* ── 결재란 토글 ── */
function toggleSign(){
  document.body.classList.toggle('no-sign', !document.getElementById('chkSign').checked);
}

/* ── 엑셀 다운로드 ── */
function downloadXlsx(){
  if (!lastXlsx){ alert('먼저 조회 후 다운로드해주세요.'); return; }
  var wb = XLSX.utils.book_new();
  lastXlsx.sheets.forEach(function(sh){
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sh.d), sh.n);
  });
  var s = document.getElementById('sDate').value.replace(/-/g,'');
  var e = document.getElementById('eDate').value.replace(/-/g,'');
  XLSX.writeFile(wb, 'report_' + lastXlsx.name + '_' + s + '_' + e + '.xlsx');
}

/* ── 초기화 ── */
document.addEventListener('DOMContentLoaded', async function(){
  try {
    var params = new URLSearchParams(location.search);
    var q = params.get('proc');
    if (q && procOf(q)) curProc = q;
  } catch(e){}
  renderTabs();
  if (typeof checkAuth === 'function') {
    myInfo = await checkAuth();
    if (!myInfo) return;
  }
  quick('today');
});
</script>
