<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>금형관리 대시보드 - HKHT</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f1f3f9; color:#1e293b; }


/* ===== 좌측 메뉴바 (공통) ===== */
.sidebar { position:fixed; top:0; left:0; width:220px; height:100vh; background:#1e2a4a; color:#fff; z-index:200; display:flex; flex-direction:column; overflow-y:auto; }
.sidebar-logo { padding:20px 16px 16px; border-bottom:1px solid rgba(255,255,255,0.1); }
.sidebar-logo h2 { font-size:16px; font-weight:700; color:#fff; }
.sidebar-logo .sub { font-size:11px; color:#94a3b8; margin-top:4px; }
.sidebar-section { padding:12px 0 4px; }
.sidebar-section-title { font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:1px; padding:0 16px 8px; }
.sidebar-item { display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:14px; color:#cbd5e1; cursor:pointer; transition:all 0.15s; text-decoration:none; border-left:3px solid transparent; }
.sidebar-item:hover { background:rgba(255,255,255,0.08); color:#fff; }
.sidebar-item.active { background:rgba(36,59,178,0.3); color:#fff; border-left-color:#60a5fa; }
.sidebar-item .icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }
.sidebar-toggle { cursor:pointer; }
.sidebar-toggle .arrow { margin-left:auto; font-size:14px; transition:transform 0.2s; color:#64748b; }
.sidebar-group.open .sidebar-toggle .arrow { transform:rotate(90deg); }
.sidebar-sub { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
.sidebar-group.open .sidebar-sub { max-height:200px; }
.sidebar-sub-item { display:flex; align-items:center; gap:10px; padding:8px 16px 8px 44px; font-size:13px; color:#94a3b8; cursor:pointer; transition:all 0.15s; text-decoration:none; border-left:3px solid transparent; }
.sidebar-sub-item:hover { color:#fff; background:rgba(255,255,255,0.05); }
.sidebar-sub-item .icon { font-size:14px; width:20px; text-align:center; flex-shrink:0; }
.sidebar-bottom { margin-top:auto; padding:12px 16px; border-top:1px solid rgba(255,255,255,0.1); }
.sidebar-bottom a { color:#94a3b8; font-size:12px; text-decoration:none; }
.sidebar-bottom a:hover { color:#fff; }
.main { margin-left:220px; min-height:100vh; }
@media(max-width:768px) {
    .sidebar { width:60px; }
    .sidebar-logo h2,.sidebar-logo .sub,.sidebar-section-title,.sidebar-item span:not(.icon):not(.arrow),.sidebar-sub-item span:not(.icon),.sidebar-toggle .arrow { display:none; }
    .sidebar-item,.sidebar-toggle { padding:12px 0; justify-content:center; }
    .sidebar-sub-item { padding:8px 0; justify-content:center; }
    .main { margin-left:60px; }
}

</style>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-logo"><h2>금형관리</h2><div class="sub">Mold Management</div></div>
    <div class="sidebar-section">
        <div class="sidebar-section-title">메뉴</div>
        <a class="sidebar-item active" href="mold_dashboard.html"><span class="icon">📊</span><span>대시보드</span></a>
        <a class="sidebar-item" href="mold_layout.html"><span class="icon">🗄️</span><span>적치대 현황</span></a>
        <a class="sidebar-item" href="mold_admin.html"><span class="icon">📋</span><span>금형 상세관리</span></a>
        <div class="sidebar-group">
            <div class="sidebar-item sidebar-toggle" onclick="toggleSubMenu(this)"><span class="icon">🔧</span><span>이력 관리</span><span class="arrow">›</span></div>
            <div class="sidebar-sub">
                <a class="sidebar-sub-item" href="mold_history.html#damage"><span class="icon">🔴</span><span>손상 이력</span></a>
                <a class="sidebar-sub-item" href="mold_history.html#cleaning"><span class="icon">🧹</span><span>세척 이력</span></a>
                <a class="sidebar-sub-item" href="mold_history.html#repair"><span class="icon">🛠️</span><span>수리 이력</span></a>
            </div>
        </div>
    </div>
    <div class="sidebar-bottom"><a href="#">㈜한국하이테크</a></div>
</nav>

<div class="main">
    <div class="header"><h1>금형관리 대시보드</h1><div class="sub">Mold Management Dashboard</div></div>
    <div class="container">
        <div class="top-row">
            <div class="card"><h4><span>⚠️</span> 유지보수 알람 <span id="alertBadge" style="background:#ef4444;color:#fff;font-size:10px;padding:1px 8px;border-radius:10px;display:none;">0</span></h4><div id="alertCard"><div class="loading">로딩 중...</div></div></div>
            <div class="card"><h4><span>📋</span> 최근 상태 변경 이력</h4><div id="historyCard"><div class="loading">로딩 중...</div></div></div>
        </div>
        <div class="card" style="margin-bottom:20px;" id="repairSection"><h4><span>🔧</span> 현재 수리중 금형</h4><div id="repairCard"><div class="loading">로딩 중...</div></div></div>
        <div class="section-title"><span>📊</span> 금형 현황 요약</div>
        <div class="stat-grid">
            <div class="stat-card"><div class="stat-num" id="sTotal" style="color:#243bb2;">-</div><div class="stat-label">전체 금형</div></div>
            <div class="stat-card"><div class="stat-num" id="sActive" style="color:#0ea5e9;">-</div><div class="stat-label">활성 금형</div></div>
            <div class="stat-card"><div class="stat-num" id="sStored" style="color:#16a34a;">-</div><div class="stat-label">보관중</div></div>
            <div class="stat-card"><div class="stat-num" id="sInuse" style="color:#dc2626;">-</div><div class="stat-label">사용중</div></div>
            <div class="stat-card"><div class="stat-num" id="sRepair" style="color:#f59e0b;">-</div><div class="stat-label">수리중</div></div>
            <div class="stat-card"><div class="stat-num" id="sRetired" style="color:#94a3b8;">-</div><div class="stat-label">사용X</div></div>
        </div>
        <div class="chart-row">
            <div class="card"><h4>상태 분포</h4><div class="donut-wrap"><div class="donut" id="donutChart"><div class="donut-center"><div class="big" id="donutTotal">-</div><div class="small">활성 금형</div></div></div><div class="donut-legend" id="donutLegend"></div></div></div>
            <div class="card"><h4>동별 금형 수</h4><div class="bar-chart" id="barChart"><div class="loading">로딩 중...</div></div></div>
        </div>
    </div>
</div>

<script>
var SU='https://vpaixxlhzkwtgcllimvn.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwYWl4eGxoemt3dGdjbGxpbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNzk4NjMsImV4cCI6MjA5MTk1NTg2M30.V8Bj0cMbM0E2TFhklYYa7TM-vO6Fi70ctACA7uUf4Ig';
var allMolds=[],buildings=[];
async function sf(t,q){var u=SU+'/rest/v1/'+t;if(q)u+='?'+q;var r=await fetch(u,{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});return await r.json();}

async function loadData(){
    try{
        buildings=await sf('mold_buildings','order=sort_order.asc');
        allMolds=await sf('molds','select=*,mold_slots(address,building_id)&order=mold_code.asc');
        renderStats();renderDonut();renderBarChart();renderAlerts();renderRepairList();loadHistory();
    }catch(e){document.getElementById('alertCard').innerHTML='<div class="alert-empty" style="color:#dc2626;">로드 실패</div>';}
}
function renderStats(){
    var t=allMolds.length,st=0,iu=0,rp=0,rt=0;
    for(var i=0;i<t;i++){var m=allMolds[i];if(!m.is_active){rt++;continue;}if(m.status==='stored')st++;else if(m.status==='in_use')iu++;else if(m.status==='repairing')rp++;}
    document.getElementById('sTotal').textContent=t;document.getElementById('sActive').textContent=t-rt;
    document.getElementById('sStored').textContent=st;document.getElementById('sInuse').textContent=iu;
    document.getElementById('sRepair').textContent=rp;document.getElementById('sRetired').textContent=rt;
}
function renderDonut(){
    var st=0,iu=0,rp=0;
    for(var i=0;i<allMolds.length;i++){var m=allMolds[i];if(!m.is_active)continue;if(m.status==='stored')st++;else if(m.status==='in_use')iu++;else if(m.status==='repairing')rp++;}
    var ac=st+iu+rp;document.getElementById('donutTotal').textContent=ac;if(ac===0)return;
    var p1=st/ac*100,p2=iu/ac*100,s1=p1,s2=s1+p2;
    document.getElementById('donutChart').style.background='conic-gradient(#22c55e 0% '+s1+'%,#ef4444 '+s1+'% '+s2+'%,#f59e0b '+s2+'% 100%)';
    document.getElementById('donutLegend').innerHTML='<div class="donut-legend-item"><div class="donut-legend-dot" style="background:#22c55e;"></div>보관중 '+st+'개 ('+p1.toFixed(1)+'%)</div><div class="donut-legend-item"><div class="donut-legend-dot" style="background:#ef4444;"></div>사용중 '+iu+'개 ('+p2.toFixed(1)+'%)</div><div class="donut-legend-item"><div class="donut-legend-dot" style="background:#f59e0b;"></div>수리중 '+rp+'개 ('+(100-p1-p2).toFixed(1)+'%)</div>';
}
function renderBarChart(){
    var bc={},mx=0;for(var i=0;i<buildings.length;i++)bc[buildings[i].id]={name:buildings[i].building_name,count:0};
    for(var i=0;i<allMolds.length;i++){var m=allMolds[i];if(m.mold_slots&&bc[m.mold_slots.building_id])bc[m.mold_slots.building_id].count++;}
    for(var k in bc)if(bc[k].count>mx)mx=bc[k].count;
    var cs=['#243bb2','#2563eb','#3b82f6','#60a5fa','#93c5fd','#243bb2','#2563eb','#3b82f6','#60a5fa','#93c5fd','#243bb2','#2563eb','#3b82f6','#60a5fa','#93c5fd','#243bb2'];
    var h='',ci=0;
    for(var i=0;i<buildings.length;i++){var b=buildings[i],c=bc[b.id];if(!c)continue;var p=mx>0?(c.count/mx*100):0;h+='<div class="bar-row"><div class="bar-label">'+c.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+cs[ci%cs.length]+';"><span>'+(c.count>0?c.count:'')+'</span></div></div><div class="bar-count">'+c.count+'</div></div>';ci++;}
    document.getElementById('barChart').innerHTML=h;
}
function renderAlerts(){
    var al=[];for(var i=0;i<allMolds.length;i++){var m=allMolds[i];if(!m.is_active||!m.maintenance_threshold||m.maintenance_threshold<=0)continue;var p=Math.round((m.total_shots||0)/m.maintenance_threshold*100);if(p>=80)al.push({m:m,p:p,l:p>=100?'danger':'warning'});}
    al.sort(function(a,b){return b.p-a.p;});
    var bd=document.getElementById('alertBadge');if(al.length>0){bd.textContent=al.length;bd.style.display='inline-block';}else bd.style.display='none';
    var h='';if(al.length===0)h='<div class="alert-empty">✅ 유지보수가 필요한 금형이 없습니다</div>';
    else{for(var i=0;i<Math.min(al.length,8);i++){var a=al[i],m=a.m,ad=m.mold_slots?m.mold_slots.address:'',ic=a.l==='danger'?'🔴':'🟡',co=a.l==='danger'?'#dc2626':'#f59e0b';h+='<div class="alert-item"><div class="alert-item-icon">'+ic+'</div><div class="alert-item-info"><div class="alert-item-title">'+m.mold_code+' ('+m.product_code+')</div><div class="alert-item-sub">'+ad+' · '+(m.total_shots||0).toLocaleString()+' / '+m.maintenance_threshold.toLocaleString()+'타</div></div><div class="alert-item-pct" style="color:'+co+';">'+a.p+'%</div></div>';}}
    document.getElementById('alertCard').innerHTML=h;
}
function renderRepairList(){
    var rp=allMolds.filter(function(m){return m.is_active&&m.status==='repairing';});
    if(rp.length===0){document.getElementById('repairSection').style.display='none';return;}
    document.getElementById('repairSection').style.display='block';
    var h='';for(var i=0;i<rp.length;i++){var m=rp[i],ad=m.mold_slots?m.mold_slots.address:'-';h+='<div class="repair-item"><span style="margin-right:8px;">🔧</span><strong>'+m.mold_code+'</strong><span style="margin:0 8px;color:#64748b;">('+m.product_code+')</span><span style="color:#94a3b8;">'+ad+'</span></div>';}
    document.getElementById('repairCard').innerHTML=h;
}
async function loadHistory(){
    try{var logs=await sf('mold_status_logs','order=created_at.desc&limit=8');
    if(!logs||logs.length===0){document.getElementById('historyCard').innerHTML='<div class="alert-empty">아직 상태 변경 이력이 없습니다</div>';return;}
    var h='',sk={'stored':'보관중','in_use':'사용중','repairing':'수리중','retired':'사용X'};
    for(var i=0;i<logs.length;i++){var l=logs[i],dc='#22c55e';if(l.new_status==='in_use')dc='#ef4444';else if(l.new_status==='repairing')dc='#f59e0b';
    var pv=sk[l.prev_status]||l.prev_status||'(없음)',nw=sk[l.new_status]||l.new_status,tt='';
    if(l.created_at){var d=new Date(l.created_at);tt=(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
    h+='<div class="history-item"><div class="history-dot" style="background:'+dc+';"></div><div class="history-text"><div class="history-title">'+pv+' → '+nw+'</div><div class="history-sub">'+(l.reason||'')+'</div></div><div class="history-time">'+tt+'</div></div>';}
    document.getElementById('historyCard').innerHTML=h;}catch(e){document.getElementById('historyCard').innerHTML='<div class="alert-empty">이력 로드 실패</div>';}
}
loadData();
</script>
<script>function toggleSubMenu(el){el.parentElement.classList.toggle('open');}</script>
</div><!-- main -->
</body>
</html>
