// ── 변환 유틸 ──
function toDate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ var d=XLSX.SSF.parse_date_code(v); if(d) return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0'); }
  var s=String(v).trim();
  var m=s.match(/^(\d{2})-(\d{2})-(\d{2})$/); if(m) return '20'+m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function toNum(v){ if(v==null||v==='') return null; var n=parseFloat(v); return isNaN(n)?null:Math.round(n*1000)/1000; }
function toInt(v){ if(v==null||v==='') return null; var n=parseInt(v,10); return isNaN(n)?null:n; }
function toMin(v){ if(v==null||v==='') return null; var n=parseFloat(v); if(isNaN(n)) return null; return Math.round(n*1440*10)/10; } // 엑셀 시간값(일)→분
function toTemp(v){ if(v==null||v==='') return null; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; } // '70º'→70
function conv(type,v){ return type==='date'?toDate(v):type==='num'?toNum(v):type==='int'?toInt(v):type==='min'?toMin(v):type==='temp'?toTemp(v):(v==null?null:String(v).trim()||null); }

function switchTab(proc){
  curProc=proc;
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-proc')===proc);
  renderPanel();
}

function fmtToday(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function setRange(type){
  var now=new Date(), s='', e=fmtToday();
  if(type==='today'){ s=fmtToday(); }
  else if(type==='month'){ s=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01'; }
  else if(type==='all'){ s='2000-01-01'; e='2999-12-31'; }
  document.getElementById('fStart').value=s;
  document.getElementById('fEnd').value=e;
}

// ── 업로드 ──
function onPick(input){ if(input.files && input.files[0]) handleFile(input.files[0]); }
function handleFile(file){
  var P=PROC[curProc];
  document.getElementById('uResult').innerHTML='';
  if(!file){ return; }
  if(!/\.(xlsx|xls)$/i.test(file.name)){
    document.getElementById('uBtn').disabled=true;
    document.getElementById('uResult').style.color='#dc2626';
    document.getElementById('uResult').textContent='❌ 엑셀(.xlsx/.xls) 파일만 업로드할 수 있어요.';
    return;
  }
  document.getElementById('uFname').textContent=file.name;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      // 헤더행 찾기: '순' 과 '일자' 가 같이 있는 행
      var hIdx=-1;
      for(var i=0;i<Math.min(aoa.length,6);i++){
        var row=aoa[i].map(function(x){return String(x).trim();});
        if(row.indexOf('순')!==-1 && row.indexOf('일자')!==-1){ hIdx=i; break; }
      }
      if(hIdx===-1){ throw new Error('헤더(순/일자)를 찾지 못했습니다. 올바른 '+P.title+' 일보인지 확인하세요.'); }
      var header=aoa[hIdx].map(function(x){return String(x).trim();});
      var sunIdx=header.indexOf('순');
      // 컬럼 인덱스 매핑
      var colIdx={};
      P.map.forEach(function(m){ colIdx[m[1]]=header.indexOf(m[0]); });
      var missing=P.map.filter(function(m){return colIdx[m[1]]===-1;}).map(function(m){return m[0];});
      if(missing.length){ throw new Error('엑셀에 다음 컬럼이 없습니다: '+missing.join(', ')); }

      var rows=[], dates={}, skipped=0;
      for(var r=hIdx+1;r<aoa.length;r++){
        var raw=aoa[r];
        if(!raw) continue;
        var joined=raw.map(function(x){return String(x);}).join(' ');
        if(joined.indexOf('▶')!==-1){ skipped++; continue; }            // 소계(사번별계/뱃지계)
        var sun=raw[sunIdx];
        if(sun===''||sun==null||isNaN(parseFloat(sun))){ skipped++; continue; } // 총계/요약/빈행
        var rec={ source_file:file.name };
        P.map.forEach(function(m){ rec[m[1]]=conv(m[2], raw[colIdx[m[1]]]); });
        if(!rec.work_date || !rec.product_code){ skipped++; continue; }   // 날짜/제품번호 없으면 제외
        rows.push(rec);
        dates[rec.work_date]=true;
      }
      if(rows.length===0){ throw new Error('업로드할 실제 작업행이 없습니다. (소계/총계만 있는 파일일 수 있어요)'); }
      pending[curProc]={ rows:rows, dates:Object.keys(dates), fname:file.name };
      document.getElementById('uBtn').disabled=false;
      document.getElementById('uResult').style.color='#166534';
      document.getElementById('uResult').textContent=
        '✅ 검증 완료: 실제 '+rows.length+'건 (소계·총계 등 '+skipped+'행 제외) · 날짜: '+Object.keys(dates).join(', ')+'\n"업로드" 버튼을 누르면 저장됩니다.';
    }catch(err){
      document.getElementById('uBtn').disabled=true;
      document.getElementById('uResult').style.color='#dc2626';
      document.getElementById('uResult').textContent='❌ '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function doUpload(){
  var P=PROC[curProc];
  var pk=pending[curProc];
  if(!pk||!pk.rows.length){ return; }
  if(!confirm(P.title+' '+pk.rows.length+'건을 업로드합니다.\n해당 날짜('+pk.dates.join(', ')+')의 기존 데이터는 새 파일로 교체됩니다.\n진행할까요?')){ return; }
  var btn=document.getElementById('uBtn'); btn.disabled=true; btn.textContent='업로드 중...';
  var res=document.getElementById('uResult'); res.style.color='#334155';
  try{
    // 1) 같은 날짜 기존 데이터 삭제(교체)
    for(var i=0;i<pk.dates.length;i++){
      await fetch(SU+'/rest/v1/'+P.table+'?work_date=eq.'+encodeURIComponent(pk.dates[i]), {method:'DELETE', headers:H()});
    }
    // 2) 신규 적재 (200건씩)
    var ok=0;
    for(var s=0;s<pk.rows.length;s+=200){
      var chunk=pk.rows.slice(s,s+200);
      var r=await fetch(SU+'/rest/v1/'+P.table, {method:'POST', headers:H(), body:JSON.stringify(chunk)});
      if(!r.ok){ throw new Error('저장 실패('+r.status+'): '+(await r.text()).slice(0,200)); }
      ok+=chunk.length;
    }
    res.style.color='#166534';
    res.textContent='🎉 업로드 완료: '+ok+'건 저장됨';
    pending[curProc]=null;
    document.getElementById('uFname').textContent='선택된 파일 없음';
    document.getElementById('mesFile').value='';
    loadData();
  }catch(err){
    res.style.color='#dc2626';
    res.textContent='❌ '+err.message;
  }finally{
    btn.textContent='업로드';
  }
}

// ── 조회 ──
var lastRows=[];
async function loadData(){
  var P=PROC[curProc];
  var s=document.getElementById('fStart').value, e=document.getElementById('fEnd').value;
  var prod=(document.getElementById('fProd').value||'').trim();
  var q='?order=work_date.desc,id.asc&limit=5000';
  if(s) q+='&work_date=gte.'+s;
  if(e) q+='&work_date=lte.'+e;
  if(prod) q+='&product_code=ilike.*'+encodeURIComponent(prod)+'*';
  document.getElementById('mesBody').innerHTML='<tr><td class="empty" colspan="'+P.view.length+'">불러오는 중...</td></tr>';
  try{
    var r=await fetch(SU+'/rest/v1/'+P.table+q, {headers:HR()});
    var data=await r.json();
    lastRows=data||[];
    renderRows();
  }catch(err){
    document.getElementById('mesBody').innerHTML='<tr><td class="empty" colspan="'+P.view.length+'">불러오기 실패</td></tr>';
  }
}
function cell(v){ return (v==null||v==='')?'-':String(v); }
function renderRows(){
  var P=PROC[curProc];
  document.getElementById('mesCnt').textContent='총 '+lastRows.length+'건';
  if(!lastRows.length){ document.getElementById('mesBody').innerHTML='<tr><td class="empty" colspan="'+P.view.length+'">데이터가 없습니다</td></tr>'; return; }
  var html='';
  for(var i=0;i<lastRows.length;i++){
    var d=lastRows[i];
    html+='<tr>'+P.view.map(function(c){ return '<td>'+cell(d[c[0]])+'</td>'; }).join('')+'</tr>';
  }
  document.getElementById('mesBody').innerHTML=html;
}

// ── 엑셀 내보내기 ──
function exportXlsx(){
  var P=PROC[curProc];
  if(!lastRows.length){ alert('내보낼 데이터가 없습니다. 먼저 조회하세요.'); return; }
  var out=lastRows.map(function(d){ var o={}; P.view.forEach(function(c){ o[c[1]]=d[c[0]]; }); return o; });
  var ws=XLSX.utils.json_to_sheet(out);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, P.title);
  XLSX.writeFile(wb, 'MES_'+P.title+'_'+fmtToday().replace(/-/g,'')+'.xlsx');
}

// ── 드래그 앤 드롭 ──
function dzOver(e){ e.preventDefault(); var z=document.getElementById('dropZone'); if(z) z.classList.add('dragover'); }
function dzLeave(e){ e.preventDefault(); var z=document.getElementById('dropZone'); if(z) z.classList.remove('dragover'); }
function dzDrop(e){
  e.preventDefault();
  var z=document.getElementById('dropZone'); if(z) z.classList.remove('dragover');
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) handleFile(f);
}
// 영역 밖에 떨어뜨려도 브라우저가 파일을 열지 않도록 차단
['dragover','drop'].forEach(function(ev){ window.addEventListener(ev, function(e){ e.preventDefault(); }, false); });

// 시작
renderPanel();
</script>
