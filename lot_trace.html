    function setSummary(html) { var b = document.getElementById('sumBox'); b.innerHTML = html; b.style.display = html ? '' : 'none'; }

      btn.dataset.open = open ? '1' : '0'; btn.textContent = open ? '모두 접기' : '모두 펼치기';
    }
    var lastListQ = null;   // 직전에 본 목록(사번/부분검색) — "목록으로" 버튼용
    function renderNav(kind) {
      var nb = document.getElementById('navBar'); var h = '';

    }

      lastListQ = null; document.getElementById('q').value = ''; document.getElementById('result').innerHTML = ''; renderNav(null);
      setSummary(''); document.getElementById('hintBar').style.display = '';   // 2026-11-25
      history.pushState({ q: null, list: null }, '', location.pathname);
      document.getElementById('q').focus();
    }

    // ───────── 검색 분기 ─────────
    function runSearch(push) {
      var q = document.getElementById('q').value.trim().toUpperCase();
      if (!q) return;
      var out = document.getElementById('result'); out.innerHTML = '';
      setSummary(''); document.getElementById('hintBar').style.display = 'none';   // 2026-11-25
      var isList = /^\d{6}$/.test(q) || !(/^C\d{9}$/.test(q) || /^[MI]\d/.test(q));
      if (isList) lastListQ = q;
      if (push !== false) history.pushState({ q: q, list: lastListQ }, '', '?q=' + encodeURIComponent(q));   // 2026-11-24 검색마다 기록 → 뒤로가기로 복귀
      renderNav(isList ? 'list' : 'detail');
      if (/^C\d{9}$/.test(q)) return traceBack(q);
      if (/^M\d/.test(q)) return traceForward(q, 'batch');
      if (/^I\d/.test(q)) return traceForward(q, 'receipt');
      if (/^\d{6}$/.test(q)) return listBySabun(q);
      // 부분 입력 → 라벨 후보
      showLoading('검색 중...');
      supabase.from('lot_labels').select('label, work_date, equipment_no, face, sabun, batch_no').ilike('label', '%' + q + '%').order('work_date', { ascending: false }).limit(50)
        .then(function(r) {
          hideLoading();
          if (r.error) { showToast('조회 실패: ' + r.error.message); return; }
          if (!r.data || !r.data.length) { out.innerHTML = '<div class="lt-card empty-msg">"' + esc(q) + '" 에 해당하는 LOT 을 찾지 못했어요.<br>성형 LOT(C…) · 혼련 배치(M…) · 입고 LOT(I…) · 사번 6자리로 검색해 주세요.</div>'; return; }
          out.innerHTML = '<div class="lt-card"><div style="font-size:13px;font-weight:700;margin-bottom:8px;">"' + esc(q) + '" 가 포함된 성형 LOT ' + r.data.length + '건</div>' + labelListTable(r.data) + '</div>';
        });
    }
    function listBySabun(sabun) {
      showLoading('조회 중...');
      supabase.from('lot_labels').select('label, work_date, equipment_no, face, sabun, batch_no, production_qty').eq('sabun', sabun).order('work_date', { ascending: false }).limit(100)
        .then(function(r) {
          hideLoading();
          if (r.error) { showToast('조회 실패: ' + r.error.message); return; }
          var out = document.getElementById('result');
          if (!r.data || !r.data.length) { out.innerHTML = '<div class="lt-card empty-msg">사번 ' + esc(sabun) + ' 의 성형 LOT 발행 내역이 없어요. (MES 자료 업로드 범위를 확인해 주세요)</div>'; return; }
          out.innerHTML = '<div class="lt-card"><div style="font-size:13px;font-weight:700;margin-bottom:8px;">사번 ' + esc(sabun) + ' · 최근 성형 LOT ' + r.data.length + '건 — 클릭하면 역추적</div>' + labelListTable(r.data) + '</div>';
        });
    }
    function labelListTable(rows) {
      var h = '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>성형 LOT</th><th>사번</th><th>일자</th><th>호기·면</th><th>BatchNo</th><th class="num">생산</th></tr></thead><tbody>';   // 2026-11-24 사번을 LOT 옆으로
      rows.forEach(function(r) {
        h += '<tr><td><a href="?q=' + esc(r.label) + '" onclick="go(\'' + esc(r.label) + '\');return false;"><b>' + esc(r.label) + '</b></a></td><td><b>' + esc(r.sabun || '-') + '</b></td><td>' + esc(r.work_date) + '</td><td>' + esc(r.equipment_no || r.equip_raw || '-') + ' ' + esc(r.face || '') + '</td>'
          + '<td>' + (r.batch_no ? '<a href="#" onclick="go(\'' + esc(r.batch_no) + '\');return false;">' + esc(r.batch_no) + '</a>' : '-') + '</td><td class="num">' + (r.production_qty != null ? r.production_qty.toLocaleString() : '-') + '</td></tr>';
      });
      return h + '</tbody></table></div>';
    }
    function go(v) { document.getElementById('q').value = v; runSearch(); window.scrollTo(0, 0); }

    // ───────── 역추적: 성형 LOT → 재료 ─────────
    function traceBack(L) {
      showLoading('역추적 중...');
      var ctx = { L: L };
      supabase.from('lot_labels').select('*').eq('label', L).maybeSingle().then(function(r) {
        if (r.error) throw new Error('라벨 조회 실패: ' + r.error.message);
        ctx.lab = r.data || null;
        var qs = [
          supabase.from('sasang_reports').select('id, work_date, worker_name, sabun, production_qty, defect_qty, deleted_at').eq('lot_no', L),
          supabase.from('assembly_reports').select('id, work_date, worker_name, sabun, production_qty, defect_qty, deleted_at').eq('lot_no', L),

          packagingByLots([L]),

        ];

          qs.push(supabase.from('molding_reports').select('id, work_date, equipment_no, work_type, sabun, worker_name, team, shift_type, start_time, end_time, production_qty, defect_qty, shot_count, batch_no')
            .eq('work_date', ctx.lab.work_date).eq('sabun', ctx.lab.sabun).is('deleted_at', null));

          // 2026-11-24 우리 혼련 일지는 'M261019-016', MES 는 'M261019016' → 두 표기 모두로 조회
          qs.push(/^M/i.test(b) ? supabase.from('cmb_reports').select('id, work_date, worker_id, worker_name, material_name, weight, lot_no, is_remix').in('lot_no', batchForms(b))

          qs.push(b ? supabase.from('lot_labels').select('label', { count: 'exact', head: true }).eq('batch_no', b) : Promise.resolve({ count: 0 }));
          // 2026-11-24 MES 혼련 원자료(mes_mixing_raw): 배치 → CMB LotNo(원자재 입고 LOT) 연결
          qs.push(/^M/i.test(b) ? supabase.from('mes_mixing_raw').select('work_date, batch_no, product_code, material, cmb_lot_no, cmb_name, batch_qty, total_weight, worker').in('batch_no', batchForms(b)) : Promise.resolve({ data: [] }));
        }
        return Promise.all(qs);
      }).then(function(res) {
        // 2026-11-24 검사 일지 (lot_nos 배열) + 2026-11-25 도포 일지 (인서트 입고 LOT 기준)
        var coatQ = (ctx.lab && ctx.lab.insert_lot)
          ? supabase.from('coating_reports').select('id, work_date, worker_id, worker_name, work_type, total_qty, defect_qty, lot_no, deleted_at').eq('lot_no', ctx.lab.insert_lot).order('work_date')

      var mixQ = type === 'batch'
        ? supabase.from('mes_mixing_raw').select('work_date, batch_no, product_code, material, cmb_lot_no, cmb_name, batch_qty, total_weight, worker').in('batch_no', batchForms(X))
        : supabase.from('mes_mixing_raw').select('work_date, batch_no, product_code, material, cmb_lot_no, cmb_name, batch_qty, total_weight, worker').eq('cmb_lot_no', X).order('work_date');

      Promise.all([head, mixQ, coatQ]).then(function(res0) {
        if (res0[0].error) throw new Error(res0[0].error.message);
        if (res0[1].error) console.warn('mes_mixing_raw', res0[1].error);
        ctx.head = res0[0].data; ctx.mesMix = res0[1].data || []; ctx.coat = alive(res0[2].data);
        var batches = type === 'batch' ? batchForms(X) : [];
        if (type === 'receipt') ctx.mesMix.forEach(function(m) { batchForms(m.batch_no).forEach(function(f) { if (batches.indexOf(f) < 0) batches.push(f); }); });
        ctx.batches = batches;
        var labelsQ = type === 'batch'
          ? supabase.from('lot_labels').select('*').in('batch_no', batches).order('work_date').order('start_time')
          : supabase.from('lot_labels').select('*').or('batch_no.eq.' + X + ',insert_lot.eq.' + X + (batches.length ? ',batch_no.in.(' + batches.join(',') + ')' : '')).order('work_date').order('start_time');
        return labelsQ;
      }).then(function(r1) {

          inChunks(Ls, 100, function(ch) { return supabase.from('assembly_reports').select('lot_no, work_date, deleted_at').in('lot_no', ch); }),
          inChunks(Ls, 100, function(ch) { return supabase.from('shot_reports').select('lot_no, work_date, deleted_at').in('lot_no', ch); }),
          packagingByLots(Ls, minDate),
          inChunks(Ls, 25, function(ch) { return supabase.from('inventory_lots').select('*').or(ch.map(function(l) { return 'lot_no.ilike.%' + l + '%'; }).join(',')); }),
          inChunks(Ls, 25, function(ch) { return supabase.from('inventory_movements').select('*').eq('movement_type', 'outbound').or(ch.map(function(l) { return 'lot_no.ilike.%' + l + '%'; }).join(',')); }),
          inspectionByLots(Ls, minDate)   // 2026-11-24 검사

        ctx.by = {};
        ctx.labels.forEach(function(l) { ctx.by[l.label] = { lab: l, sasang: null, assembly: null, shot: null, insp: null, pack: null, inv: [], ship: [] }; });

          res[5].forEach(function(m) { splitLots(m.lot_no).forEach(function(x) { if (ctx.by[x]) ctx.by[x].ship.push(m); }); });
          alive(res[6].data).forEach(function(p) { (p.lot_nos || []).forEach(function(l) { if (ctx.by[l] && !ctx.by[l].insp) ctx.by[l].insp = p.work_date; }); });   // 2026-11-24 검사

    var INSP_LOTS_JSONB = false;   // inspection_reports.lot_nos 가 jsonb 면 true
    function inspectionByLots(Ls, minDate) {
      var q = supabase.from('inspection_reports').select('id, work_date, worker_id, worker_name, lot_nos, inspect_qty, pass_qty, fail_qty, recheck, deleted_at');
      if (Ls.length === 1) q = INSP_LOTS_JSONB ? q.contains('lot_nos', JSON.stringify([Ls[0]])) : q.contains('lot_nos', [Ls[0]]);
      else q = q.gte('work_date', minDate || '2026-01-01').limit(5000);

    }
    function packagingByLots(Ls, minDate) {
      var q = supabase.from('packaging_reports').select('id, work_date, worker_id, worker_name, lot_nos, quantity, created_by_name, deleted_at');
      if (Ls.length === 1) q = PACK_LOTS_JSONB ? q.contains('lot_nos', JSON.stringify([Ls[0]])) : q.contains('lot_nos', [Ls[0]]);
      else q = q.gte('work_date', minDate || '2026-01-01').limit(5000);
      return q;
    }
    function inChunks(arr, size, fn) {
      var chunks = []; for (var i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size));
      return Promise.all(chunks.map(function(ch) { return fn(ch).then(function(r) { if (r.error) console.warn(r.error); return r.data || []; }); }))
        .then(function(parts) { return [].concat.apply([], parts); });
    }
    function alive(rows) { return (rows || []).filter(function(r) { return !r.deleted_at; }); }
    // 2026-11-24 배치번호 두 표기: 'M261019016'(MES) ↔ 'M261019-016'(우리 혼련 일지)
    function batchForms(b) {
      b = String(b || '').trim().toUpperCase(); if (!b) return [];
      var plain = b.replace(/-/g, ''), m = plain.match(/^([A-Z]\d{6})(\d{3})$/);
      var out = [b]; if (plain !== b) out.push(plain); if (m) { var hy = m[1] + '-' + m[2]; if (out.indexOf(hy) < 0) out.push(hy); }
      return out;
    }
    function splitLots(s) { return String(s || '').split(',').map(function(x) { return x.trim().toUpperCase(); }).filter(Boolean); }
    function eqKey(e) { var m = String(e || '').match(/([AB]).*?(\d{1,2})/i); return m ? m[1].toUpperCase() + ('0' + parseInt(m[2], 10)).slice(-2) : String(e || '').replace(/\s+/g, '').toLowerCase(); }
    function locLabel(l) {
      if (l.status === 'waiting') return '입고대기';
      if (l.location_type === 'zone') { var z = zones[l.zone_id]; return z ? ((z.zone_name || z.zone_code || '') + ' ' + (z.lane_name || (z.lane_no ? z.lane_no + '라인' : ''))).trim() + ' (대차장)' : '대차장'; }
      var r = racks[l.rack_id]; return (r ? r.rack_name : '') + (l.slot_code ? ' ' + l.slot_code : '') + (r || l.slot_code ? ' (적재대)' : (l.status === 'shipped' ? '출하됨' : '-'));
    }
    function statusKo(s) { return { waiting: '입고대기', stocked: '재고', shipped: '출하완료' }[s] || s || '-'; }
    function chk(d) { return d ? '<span style="color:#166534">' + esc(md(d)) + ' ✓</span>' : '<span style="color:#9ca3af">—</span>'; }
    function md(d) { return d ? String(d).slice(5, 10).replace('-', '/') : ''; }
    function tm(t) { return t ? String(t).slice(0, 5) : '-'; }
    function num(v) { return v == null ? '-' : Number(v).toLocaleString(); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function fmtKst(iso, withTime) {
      if (!iso) return '-'; var d = new Date(iso); var p = function(n) { return ('0' + n).slice(-2); };
      var s = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
      return withTime ? s + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) : s;
    }
    function showToast(msg) { var t = document.getElementById('toastMsg'); t.textContent = msg; t.className = 'toast-msg show'; setTimeout(function() { t.className = 'toast-msg'; }, 3500); }
    function showLoading(text) { document.getElementById('loadingText').textContent = text || '조회 중...'; document.getElementById('loadingOverlay').className = 'loading-overlay show'; }
    function hideLoading() { document.getElementById('loadingOverlay').className = 'loading-overlay'; }
  </script>
  <script src="sidebar.js"></script>
</body>
